              <button onClick={viewMode === 'month' ? nextMonth : nextWeek} className="p-2 rounded-xl hover:bg-primary/20 transition-colors text-textMain"><IconChevronRight /></button>
            </div>
          </header>

          {viewMode === 'month' ? (
            <div className="bento-card flex-1 p-3 sm:p-5 flex flex-col">
              <div className="grid grid-cols-7 gap-1 sm:gap-2 mb-2 text-center text-[10px] sm:text-xs font-extrabold text-textMuted uppercase">
                <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div className="text-red-600/80">Сб</div><div className="text-red-600/80">Вс</div>
              </div>
              <div className="grid grid-cols-7 gap-1 sm:gap-2 flex-1 auto-rows-fr">
                {Array.from({ length: firstDay }).map((_, i) => <div key={`empty-${i}`} className="rounded-2xl bg-inputBg/40 opacity-40"></div>)}
                {Array.from({ length: daysInMonth }).map((_, i) => {
                  const day = i + 1;
                  const dateStr = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                  const dayTasks = getTasksForDate(dateStr);
                  const isToday = dateStr === getTodayStr();

                  return (
                    <div 
                      key={day} 
                      onClick={() => setViewDayDate(dateStr)} 
                      className={`p-1.5 sm:p-2 rounded-2xl border flex flex-col gap-1 cursor-pointer transition-all ${isToday ? 'border-2 border-primary bg-primary/15 shadow-sm' : 'border-glassBorder bg-surface hover:border-primary/60 hover:bg-surfaceHover'}`}
                    >
                      <div className="flex justify-between items-center px-1">
                        <span className={`text-xs sm:text-sm font-extrabold ${isToday ? 'text-primary' : 'text-textMain'}`}>{day}</span>
                        {dayTasks.length > 0 && (
                          <span className="text-[10px] font-extrabold px-1.5 py-0.2 rounded-full bg-primary text-btnText">
                            {dayTasks.length}
                          </span>
                        )}
                      </div>
                      <div className="hidden sm:flex flex-col gap-1 overflow-y-auto no-scrollbar max-h-20 mt-0.5">
                        {dayTasks.map(t => (
                          <div key={t.id} className={`text-[10px] px-1.5 py-0.5 rounded-lg flex items-center gap-1 truncate font-bold ${t.status === 'completed' ? 'opacity-50 line-through bg-inputBg' : 'bg-inputBg text-textMain border border-glassBorder'}`}>
                            {t.parentId && <span className="text-primary font-extrabold">└</span>} {t.title}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
            <div className="bento-card flex-1 p-4 sm:p-6 flex flex-col overflow-y-auto no-scrollbar">
              <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2 mb-5 p-4 bg-inputBg rounded-2xl border border-glassBorder">
                <div>
                  <span className="font-extrabold text-textMain">Прогресс недели (включая подзадачи)</span>
                  <p className="text-xs font-bold text-textMuted">Всего задач на неделе: {weekTasksAll.length}</p>
                </div>
                <div className="flex items-center gap-3 w-full sm:w-1/2">
                  <div className="flex-1 h-3.5 bg-surface rounded-full overflow-hidden border border-glassBorder">
                    <div style={{ width: `${weekProgress}%` }} className="h-full bg-primary rounded-full transition-all duration-500"></div>
                  </div>
                  <span className="text-sm font-extrabold text-primary">{weekProgress}%</span>
                </div>
              </div>

              <div className="flex flex-col gap-3.5">
                {weekDays.map((dateStr) => {
                  const dayTasks = getTasksForDate(dateStr);
                  const isToday = dateStr === getTodayStr();
                  const d = new Date(dateStr);
                  
                  return (
                    <div key={dateStr} className={`p-4 rounded-2xl border ${isToday ? 'border-2 border-primary bg-surface shadow-sm' : 'border-glassBorder bg-surface/80'} flex flex-col gap-2.5`}>
                      <div className="flex justify-between items-center border-b border-glassBorder pb-2">
                        <h3 className={`font-extrabold ${isToday ? 'text-primary' : 'text-textMain'}`}>
                          {dayNames[d.getDay()]}, <span className="font-bold text-textMuted text-sm">{d.getDate()} {monthNames[d.getMonth()]}</span>
                        </h3>
                        <button onClick={() => onOpenModal({ date: dateStr })} className="text-btnText bg-primary hover:bg-primaryHover px-3 py-1 rounded-xl text-xs font-extrabold transition-colors flex items-center gap-1">
                          <IconPlus size={14} /> Добавить
                        </button>
                      </div>
                      <div className="flex flex-col gap-1.5">
                        {dayTasks.length === 0 ? <p className="text-xs text-textMuted font-bold py-1">Свободный день</p> : dayTasks.map(t => <TaskItem key={t.id} task={t} onOpenModal={onOpenModal} />)}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <DayTasksModal 
            isOpen={Boolean(viewDayDate)} 
            onClose={() => setViewDayDate(null)} 
            date={viewDayDate} 
            onOpenModal={(cfg) => { setViewDayDate(null); onOpenModal(cfg); }} 
          />
        </div>
      );
    };

    // --- РАЗДЕЛ 4: ФОКУС-ТАЙМЕР ---
    const FocusView = ({ onOpenModal }) => {
      const { 
        tasks, pomoMode, pomoSeconds, pomoRunning, setPomoRunning, 
        switchPomoMode, pomoTaskId, setPomoTaskId, pomoDurations 
      } = useContext(TaskContext);

      const mins = String(Math.floor(pomoSeconds / 60)).padStart(2, '0');
      const secs = String(pomoSeconds % 60).padStart(2, '0');
      const activeTasks = tasks.filter(t => t.status === 'active' && !t.parentId);
      const focusedTask = tasks.find(t => t.id === pomoTaskId);

      return (
        <div className="pb-32 sm:pb-12 max-w-3xl mx-auto">
          <h1 className="text-2xl sm:text-3xl font-extrabold text-textMain mb-1">Режим Фокуса</h1>
          <p className="text-sm font-bold text-textMuted mb-6">Таймер продолжает идти в мини-окне, даже если ты переключишься на задачи</p>

          <div className="bento-card p-6 sm:p-8 text-center mb-6">
            <div className="inline-flex bg-inputBg p-1.5 rounded-2xl border border-glassBorder mb-6 gap-1">
              <button onClick={() => switchPomoMode('work')} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition-colors ${pomoMode === 'work' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Работа (25 мин)</button>
              <button onClick={() => switchPomoMode('short')} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition-colors ${pomoMode === 'short' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Перерыв (5 мин)</button>
              <button onClick={() => switchPomoMode('long')} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition-colors ${pomoMode === 'long' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Отдых (15 мин)</button>
            </div>

            <div className="text-6xl sm:text-7xl font-extrabold tracking-tight text-textMain my-4 font-mono">
              {mins}:{secs}
            </div>

            <div className="flex justify-center gap-3 mt-6">
              <button 
                onClick={() => setPomoRunning(!pomoRunning)} 
                className="px-8 py-3 bg-primary hover:bg-primaryHover text-btnText rounded-2xl font-extrabold text-sm shadow-lg transition-transform active:scale-95"
              >
                {pomoRunning ? 'Пауза' : 'Старт'}
              </button>
              <button 
                onClick={() => { setPomoRunning(false); switchPomoMode(pomoMode); }} 
                className="px-5 py-3 bg-inputBg hover:bg-primary/20 text-textMain rounded-2xl font-extrabold text-sm border border-glassBorder transition-colors"
              >
                Сброс
              </button>
            </div>
          </div>

          <div className="bento-card p-5">
            <label className="text-xs uppercase font-extrabold text-textMuted block mb-2">Выбери текущую задачу для концентрации:</label>
            <select 
              value={pomoTaskId} 
              onChange={e => setPomoTaskId(e.target.value)}
              className="w-full bg-inputBg border border-glassBorder rounded-2xl px-4 py-3 text-sm font-extrabold text-textMain outline-none mb-4"
            >
              <option value="" className="bg-surface text-textMain">— Не выбрано —</option>
              {activeTasks.map(t => <option key={t.id} value={t.id} className="bg-surface text-textMain">{t.title}</option>)}
            </select>

            {focusedTask && (
              <div className="mt-2">
                <TaskItem task={focusedTask} onOpenModal={onOpenModal} />
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- РАЗДЕЛ 5: НАСТРОЙКИ ---
    const SettingsView = () => {
      const { tasks, syncToFirebase, isDark, setIsDark, soundEnabled, setSoundEnabled, addToast } = useContext(TaskContext);
      const fileInputRef = useRef(null);

      const handleExport = () => {
        const dataStr = JSON.stringify(tasks, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `studyflow-backup-${getTodayStr()}.json`;
        a.click();
        addToast('Резервная копия сохранена');
      };

      const handleImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            if (Array.isArray(imported)) {
              syncToFirebase(imported);
              addToast('Задачи успешно импортированы!');
            }
          } catch (err) {
            addToast('Ошибка файла JSON', 'error');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="pb-32 sm:pb-10 max-w-2xl mx-auto space-y-4">
          <h1 className="text-2xl sm:text-3xl font-extrabold text-textMain mb-6">Настройки</h1>
          
          <div className="bento-card p-5 flex items-center justify-between">
            <div>
              <h3 className="font-extrabold text-textMain text-base">Тема оформления</h3>
              <p className="text-textMuted text-xs font-bold mt-1">Фирменная светлая салатовая или тёмная хвойная</p>
            </div>
            <button 
              onClick={() => setIsDark(!isDark)} 
              className="px-4 py-2.5 bg-inputBg rounded-2xl border border-glassBorder hover:border-primary transition-colors text-textMain flex items-center gap-2 font-extrabold text-xs"
            >
              {isDark ? <><IconSun /> Светлая</> : <><IconMoon /> Тёмная</>}
            </button>
          </div>

          <div className="bento-card p-5 flex items-center justify-between">
            <div>
              <h3 className="font-extrabold text-textMain text-base">Звуковой отклик</h3>
              <p className="text-textMuted text-xs font-bold mt-1">Мягкий аккорд при завершении задач и таймера</p>
            </div>
            <button 
              onClick={() => setSoundEnabled(!soundEnabled)} 
              className={`px-4 py-2.5 rounded-2xl font-extrabold text-xs transition-colors ${soundEnabled ? 'bg-primary text-btnText' : 'bg-inputBg text-textMuted'}`}
            >
              {soundEnabled ? 'Включён 🔔' : 'Выключен 🔕'}
            </button>
          </div>

          <div className="bento-card p-5 space-y-4">
            <div>
              <h3 className="font-extrabold text-textMain text-base">Облако Firebase и Резервная копия</h3>
              <p className="text-textMuted text-xs font-bold mt-1">Все прошлые и новые задачи автоматически синхронизируются с твоей базой Firebase и сохраняются в памяти браузера.</p>
            </div>
            <div className="flex flex-wrap gap-3">
              <button onClick={handleExport} className="px-4 py-2.5 bg-primary text-btnText rounded-2xl font-extrabold text-xs shadow-sm hover:bg-primaryHover transition-colors">
                Скачать копию (JSON)
              </button>
              <button onClick={() => fileInputRef.current?.click()} className="px-4 py-2.5 bg-inputBg text-textMain border border-glassBorder rounded-2xl font-extrabold text-xs hover:bg-primary/20 transition-colors">
                Загрузить из JSON
              </button>
              <input ref={fileInputRef} type="file" accept=".json" className="hidden" onChange={handleImport} />
            </div>
          </div>
        </div>
      );
    };

    // --- ГЛАВНЫЙ КАРКАС ПРИЛОЖЕНИЯ ---
    const App = () => {
      const [currentView, setCurrentView] = useState('dashboard');
      const [modalConfig, setModalConfig] = useState(null); 
      const searchInputRef = useRef(null);
      const { isDark, setIsDark, pomoRunning, pomoSeconds, setPomoRunning } = useContext(TaskContext);
      
      const navItems = [
        { id: 'dashboard', icon: IconHome, label: 'Задачи' }, 
        { id: 'deadlines', icon: () => <IconClock size={19} />, label: 'Сроки' },
        { id: 'calendar', icon: IconCalendar, label: 'Календарь' }, 
        { id: 'focus', icon: IconTarget, label: 'Фокус' },
        { id: 'settings', icon: IconSettings, label: 'Настройки' }
      ];

      // Горячие клавиши для быстрой работы: Alt+N (новая задача), / (поиск)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.altKey && (e.key === 'n' || e.key === 'N' || e.key === 'т' || e.key === 'Т')) {
            e.preventDefault();
            setModalConfig({});
          } else if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
            e.preventDefault();
            setCurrentView('dashboard');
            setTimeout(() => searchInputRef.current?.focus(), 50);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const pomoMins = String(Math.floor(pomoSeconds / 60)).padStart(2, '0');
      const pomoSecs = String(pomoSeconds % 60).padStart(2, '0');

      return (
        <div className="flex h-screen w-full relative">
          {/* Боковая панель для ПК */}
          <aside className="hidden md:flex w-64 h-full border-r border-glassBorder bg-surface/90 backdrop-blur-2xl flex-col p-5 z-10 shadow-xl">
            <div className="flex items-center justify-between mb-8">
              <div className="flex items-center gap-3 text-textMain cursor-pointer" onClick={() => setCurrentView('dashboard')}>
                <div className="w-10 h-10 rounded-2xl bg-primary flex items-center justify-center shadow-md">
                  <span className="font-extrabold text-xl text-btnText">S</span>
                </div>
                <div>
                  <span className="text-lg font-extrabold tracking-tight block leading-none">StudyFlow</span>
                  <span className="text-[10px] font-extrabold text-textMuted uppercase tracking-widest">Workstation</span>
                </div>
              </div>
              <button 
                onClick={() => setIsDark(!isDark)} 
                className="p-2 rounded-xl bg-inputBg text-textMain hover:bg-primary hover:text-btnText transition-colors"
                title="Переключить тему"
              >
                {isDark ? <IconSun /> : <IconMoon />}
              </button>
            </div>

            <nav className="flex flex-col gap-1.5 flex-1">
              {navItems.map(item => (
                <button 
                  key={item.id} 
                  onClick={() => setCurrentView(item.id)} 
                  className={`flex items-center gap-3 px-4 py-3 rounded-2xl transition-all w-full text-left font-extrabold text-xs sm:text-sm ${currentView === item.id ? 'bg-primary text-btnText shadow-md' : 'text-textMuted hover:bg-inputBg hover:text-textMain'}`}
                >
                  <item.icon /> <span>{item.label}</span>
                </button>
              ))}
            </nav>

            <div className="space-y-2 pt-4 border-t border-glassBorder">
              <button 
                onClick={() => setModalConfig({})}
                className="w-full py-3 bg-primary hover:bg-primaryHover text-btnText rounded-2xl font-extrabold text-xs sm:text-sm shadow-md flex items-center justify-center gap-2 transition-transform active:scale-95"
              >
                <IconPlus /> Новая задача
              </button>
              <p className="text-[10px] text-center font-bold text-textMuted">Быстрый вызов: Alt + N • Поиск: /</p>
            </div>
          </aside>

          {/* Нижняя панель для смартфона */}
          <nav className="md:hidden fixed bottom-0 left-0 w-full bg-surface/95 backdrop-blur-2xl border-t border-glassBorder flex justify-around items-center p-1.5 z-[90] shadow-2xl">
            {navItems.map(item => (
              <button 
                key={item.id} 
                onClick={() => setCurrentView(item.id)} 
                className={`flex flex-col items-center gap-1 py-1.5 px-3 rounded-2xl transition-all ${currentView === item.id ? 'bg-primary text-btnText font-extrabold' : 'text-textMuted font-bold'}`}
              >
                <item.icon /> <span className="text-[10px]">{item.label}</span>
              </button>
            ))}
          </nav>

          {/* Плавающий мини-таймер Помодоро (если таймер запущен, а мы на другой вкладке) */}
          {(pomoRunning || pomoSeconds < 25 * 60) && currentView !== 'focus' && (
            <div className="fixed bottom-20 md:bottom-6 right-5 z-[110] bento-card px-4 py-2.5 bg-surface border-2 border-primary shadow-xl flex items-center gap-3">
              <button onClick={() => setCurrentView('focus')} className="text-left">
                <span className="text-[10px] uppercase font-extrabold text-textMuted block">Таймер фокуса</span>
                <span className="text-sm font-extrabold font-mono text-textMain">{pomoMins}:{pomoSecs}</span>
              </button>
              <button 
                onClick={() => setPomoRunning(!pomoRunning)}
                className="px-2.5 py-1 rounded-xl bg-primary text-btnText text-xs font-extrabold"
              >
                {pomoRunning ? 'Пауза' : 'Старт'}
              </button>
            </div>
          )}

          {/* Основная рабочая область */}
          <main className="flex-1 h-full overflow-y-auto p-3.5 sm:p-7 relative no-scrollbar">
            {currentView === 'dashboard' && <Dashboard onOpenModal={setModalConfig} searchInputRef={searchInputRef} />}
            {currentView === 'deadlines' && <DeadlinesView onOpenModal={setModalConfig} />}
            {currentView === 'calendar' && <CalendarView onOpenModal={setModalConfig} />}
            {currentView === 'focus' && <FocusView onOpenModal={setModalConfig} />}
            {currentView === 'settings' && <SettingsView />}
          </main>
          
          <TaskModal isOpen={Boolean(modalConfig)} onClose={() => setModalConfig(null)} config={modalConfig || {}} />
        </div>
      );
    };

    const Root = () => <AppProvider><App /></AppProvider>;
    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
