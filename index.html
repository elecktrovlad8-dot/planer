<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StudyFlow - Premium Planner</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { 
            background: 'var(--bg-color)', surface: 'var(--surface-color)', 
            primary: 'var(--primary-color)', primaryHover: 'var(--primary-hover)',
            glass: 'var(--glass-bg)', glassBorder: 'var(--glass-border)',
            textMain: 'var(--text-main)', textMuted: 'var(--text-muted)'
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --bg-color: #9fc792;
      --surface-color: rgba(244, 249, 242, 0.95); 
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(62, 96, 52, 0.25); 
      --text-main: #1a2916; 
      --text-muted: #4a6842; 
      --primary-color: #3e6034;
      --primary-hover: #2b4523;
    }

    .dark {
      --bg-color: #0f140f;
      --surface-color: #172116; 
      --glass-bg: rgba(23, 33, 22, 0.8);
      --glass-border: rgba(159, 199, 146, 0.2);
      --text-main: #f3f7f2;
      --text-muted: #95ab91;
      --primary-color: #9fc792;
      --primary-hover: #b2d7a6;
    }

    body {
      background-color: var(--bg-color); color: var(--text-main);
      margin: 0; overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    .glass-panel {
      background: var(--glass-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border); border-radius: 1.25rem; 
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.12);
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useMemo } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- Firebase Инициализация ---
    const firebaseConfig = {
      apiKey: "AIzaSyDz5wPBB05uU0q1vlQlgyGWmnyVwt3APk0",
      authDomain: "ourwishlist-b6bd7.firebaseapp.com",
      databaseURL: "https://ourwishlist-b6bd7-default-rtdb.firebaseio.com",
      projectId: "ourwishlist-b6bd7",
      storageBucket: "ourwishlist-b6bd7.firebasestorage.app",
      messagingSenderId: "170914082679",
      appId: "1:170914082679:web:2bc01fc83713a230fe3b72",
      measurementId: "G-LTX7TDL8KP"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- Утилиты ---
    const generateId = () => Math.random().toString(36).substr(2, 9);
    const getTodayStr = () => {
      const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    
    const getRelativeDateStr = (dateStr) => {
      if (!dateStr) return '';
      const today = new Date(getTodayStr()); const target = new Date(dateStr);
      const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return 'Сегодня';
      if (diffDays === 1) return 'Завтра';
      if (diffDays === 2) return 'Послезавтра';
      if (diffDays === -1) return 'Вчера (Просрочено)';
      if (diffDays < -1) return `Просрочено на ${Math.abs(diffDays)} дн.`;
      return target.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    };

    const getStartOfWeek = (date) => {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
      return new Date(d.setDate(diff));
    };

    const priorityScore = { urgent: 4, high: 3, normal: 2, low: 1 };
    const priorityLabels = { urgent: 'Срочный 🔴', high: 'Высокий 🔥', normal: 'Обычный', low: 'Низкий' };
    const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    const dayNames = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

    // --- Иконки ---
    const IconHome = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const IconCalendar = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const IconSettings = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    const IconChevronRight = ({ className = "" }) => <svg className={className} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;
    const IconCircle = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/></svg>;
    const IconCheckCircle = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconTrash = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    const IconEdit = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
    const IconPlus = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const IconClock = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const IconClose = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconSun = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
    const IconCloud = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>;

    // --- Стейт Менеджмент ---
    const TaskContext = createContext();

    const getInitialLocalTasks = () => {
      for (let i = 10; i >= 1; i--) {
        const saved = localStorage.getItem(`studyflow-tasks-v${i}`);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          } catch(e) {}
        }
      }
      return [{ id: '1', title: 'Разобраться в приложении', subject: 'Введение', description: 'Добавьте первую задачу.', priority: 'high', color: 'var(--primary-color)', status: 'active', parentId: null, deadline: getTodayStr(), createdAt: getTodayStr() }];
    };

    const AppProvider = ({ children }) => {
      const [tasks, setTasks] = useState(getInitialLocalTasks);
      const [toasts, setToasts] = useState([]);
      const [isSyncing, setIsSyncing] = useState(true);
      
      const [isDark, setIsDark] = useState(() => {
        const saved = localStorage.getItem('studyflow-theme-settings');
        return saved ? saved === 'dark' : false;
      });

      useEffect(() => {
        const tasksRef = db.ref('tasks');
        tasksRef.once('value').then(snapshot => {
          if (!snapshot.exists()) {
            const current = getInitialLocalTasks();
            if (current.length > 0) {
              const tasksObj = {}; current.forEach(t => tasksObj[t.id] = t);
              tasksRef.set(tasksObj);
            }
          }
        });

        tasksRef.on('value', (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            const loadedTasks = Object.values(data);
            setTasks(loadedTasks);
            localStorage.setItem('studyflow-tasks-v6', JSON.stringify(loadedTasks));
          }
          setIsSyncing(false);
        });

        return () => tasksRef.off();
      }, []);

      useEffect(() => {
        localStorage.setItem('studyflow-theme-settings', isDark ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', isDark);
      }, [isDark]);

      const addToast = (message, type = 'success') => {
        const id = generateId(); setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };

      const syncToFirebase = (newTasksArray) => {
        setTasks(newTasksArray);
        localStorage.setItem('studyflow-tasks-v6', JSON.stringify(newTasksArray));
        const tasksObj = {}; newTasksArray.forEach(t => tasksObj[t.id] = t);
        db.ref('tasks').set(tasksObj).catch(err => {
           addToast('Ошибка синхронизации', 'error');
        });
      };

      const toggleComplete = (id) => {
        const newTasks = tasks.map(t => t.id === id ? { ...t, status: t.status === 'completed' ? 'active' : 'completed' } : t);
        syncToFirebase(newTasks);
      };

      const saveTask = (task) => {
        if (task.id) {
          syncToFirebase(tasks.map(t => t.id === task.id ? { ...t, ...task } : t));
          addToast('Изменения сохранены');
        } else {
          syncToFirebase([...tasks, { ...task, id: generateId(), createdAt: getTodayStr(), status: 'active' }]);
          addToast('Задача сохранена');
        }
      };

      const deleteTask = (id) => {
        const getChildrenIds = (parentId, allTasks) => {
          const children = allTasks.filter(t => t.parentId === parentId);
          return children.reduce((acc, child) => [...acc, child.id, ...getChildrenIds(child.id, allTasks)], []);
        };
        const idsToRemove = [id, ...getChildrenIds(id, tasks)];
        syncToFirebase(tasks.filter(t => !idsToRemove.includes(t.id)));
        addToast('Удалено', 'error');
      };

      return (
        <TaskContext.Provider value={{ tasks, toggleComplete, saveTask, deleteTask, isDark, setIsDark, addToast, isSyncing }}>
          {children}
          <div className="fixed top-6 right-6 z-[200] flex flex-col gap-2">
            <AnimatePresence>
              {toasts.map(toast => (
                <motion.div key={toast.id} initial={{ opacity: 0, y: -20, scale: 0.9 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, scale: 0.9 }}
                  className="px-4 py-3 rounded-xl shadow-lg border backdrop-blur-md text-sm font-bold flex items-center gap-3 bg-surface border-glassBorder text-textMain">
                  {toast.type === 'error' ? <IconTrash className="text-red-500" /> : <IconCheckCircle className="text-primary" />}
                  {toast.message}
                </motion.div>
              ))}
            </AnimatePresence>
          </div>
        </TaskContext.Provider>
      );
    };

    const TaskItem = ({ task, level = 0, onOpenModal }) => {
      const { tasks, toggleComplete, deleteTask } = useContext(TaskContext);
      const [isExpanded, setIsExpanded] = useState(false);
      
      const children = tasks.filter(t => t.parentId === task.id);
      const isCompleted = task.status === 'completed';
      const progress = children.length > 0 ? Math.round((children.filter(c => c.status === 'completed').length / children.length) * 100) : null;
      
      const dateStatusStr = getRelativeDateStr(task.deadline);
      const isOverdue = task.deadline && task.deadline < getTodayStr() && !isCompleted;

      return (
        <div className="w-full">
          <div className={`group flex flex-col sm:flex-row sm:items-center justify-between p-3 rounded-xl transition-all duration-200 hover:bg-primary/10 border border-transparent hover:border-glassBorder ${isCompleted ? 'opacity-60 grayscale' : 'opacity-100'}`}>
            
            <div className="flex items-start gap-3 flex-1 min-w-0">
              <button onClick={() => setIsExpanded(!isExpanded)} className={`p-1 mt-0.5 rounded-md hover:bg-primary/20 transition-colors ${children.length === 0 ? 'invisible' : ''}`}>
                <motion.div animate={{ rotate: isExpanded ? 90 : 0 }}><IconChevronRight className="text-textMuted" /></motion.div>
              </button>
              
              <button onClick={() => toggleComplete(task.id)} className="text-primary hover:scale-110 transition-transform flex-shrink-0 mt-0.5">
                {isCompleted ? <IconCheckCircle /> : <IconCircle />}
              </button>
              
              <div className="flex-1 flex flex-col cursor-pointer min-w-0" onClick={() => setIsExpanded(!isExpanded)}>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className={`text-[15px] font-bold break-words ${isCompleted ? 'line-through text-textMuted' : 'text-textMain'}`}>{task.title}</span>
                  {progress !== null && !isCompleted && <span className="text-xs bg-primary/20 px-2 py-0.5 rounded-full text-textMain font-bold">{progress}%</span>}
                  {!isCompleted && task.priority && task.priority !== 'normal' && <span className="text-xs font-bold text-red-500 opacity-90">{priorityLabels[task.priority]}</span>}
                </div>
                
                {task.description && <p className="text-xs text-textMuted mt-1 line-clamp-2 font-medium">{task.description}</p>}
                
                <div className="flex gap-2 mt-1.5 text-xs text-textMuted items-center flex-wrap">
                  {task.subject && <span className="bg-surface px-2 py-0.5 rounded-md border border-glassBorder font-bold">{task.subject}</span>}
                  {task.deadline && (
                    <span className={`flex items-center gap-1 bg-surface px-2 py-0.5 rounded-md border border-glassBorder font-bold ${isOverdue ? 'text-red-500 border-red-500/40 bg-red-500/10' : ''}`}>
                      <IconClock /> {dateStatusStr}
                    </span>
                  )}
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2 mt-3 sm:mt-0 ml-12 sm:ml-0 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
               <button onClick={() => onOpenModal({ parentId: task.id })} className="flex items-center gap-1 px-2.5 py-1.5 bg-primary/15 hover:bg-primary/25 rounded-md text-textMain transition-colors text-xs font-bold">
                 <IconPlus /> Подзадача
               </button>
               <button onClick={() => onOpenModal({ editTask: task })} className="p-1.5 hover:bg-primary/20 rounded-md text-textMuted hover:text-textMain transition-colors" title="Редактировать">
                 <IconEdit />
               </button>
               <button onClick={() => deleteTask(task.id)} className="p-1.5 hover:bg-red-500/20 rounded-md text-textMuted hover:text-red-600 transition-colors" title="Удалить">
                 <IconTrash />
               </button>
               <div className="w-2.5 h-2.5 rounded-full shadow-sm ml-1 border border-glassBorder" style={{ backgroundColor: task.color || 'var(--primary-color)' }} />
            </div>
          </div>

          <AnimatePresence>
            {isExpanded && children.length > 0 && (
              <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: 'auto', opacity: 1 }} exit={{ height: 0, opacity: 0 }} className="overflow-hidden">
                <div className="ml-4 sm:ml-7 pl-2 border-l border-glassBorder flex flex-col gap-1 mt-1 mb-2">
                  {children.map(child => <TaskItem key={child.id} task={child} level={level + 1} onOpenModal={onOpenModal} />)}
                </div>
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    };

    /* Модальный Мини-календарь */
    const MiniDatePickerModal = ({ isOpen, selectedDate, onSelectDate, onClose }) => {
      const [pickerMonth, setPickerMonth] = useState(() => {
        const d = selectedDate ? new Date(selectedDate) : new Date();
        return new Date(d.getFullYear(), d.getMonth(), 1);
      });

      if (!isOpen) return null;

      const daysInMonth = new Date(pickerMonth.getFullYear(), pickerMonth.getMonth() + 1, 0).getDate();
      let firstDay = new Date(pickerMonth.getFullYear(), pickerMonth.getMonth(), 1).getDay();
      firstDay = firstDay === 0 ? 6 : firstDay - 1;

      const prevMonth = (e) => { e.preventDefault(); setPickerMonth(new Date(pickerMonth.getFullYear(), pickerMonth.getMonth() - 1, 1)); };
      const nextMonth = (e) => { e.preventDefault(); setPickerMonth(new Date(pickerMonth.getFullYear(), pickerMonth.getMonth() + 1, 1)); };

      return (
        <div className="fixed inset-0 z-[250] flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm" onClick={onClose}>
          <motion.div 
            initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} 
            className="bg-surface border border-glassBorder p-5 rounded-2xl shadow-2xl w-full max-w-[320px] text-textMain"
            onClick={e => e.stopPropagation()}
          >
            <div className="flex justify-between items-center mb-4">
              <span className="font-bold text-lg">Дата дедлайна</span>
              <button type="button" onClick={onClose} className="p-1 text-textMuted hover:text-textMain bg-primary/10 rounded-lg"><IconClose /></button>
            </div>

            <div className="flex items-center justify-between mb-4 bg-primary/5 p-2 rounded-xl border border-glassBorder">
              <button onClick={prevMonth} className="p-1 hover:bg-primary/20 rounded-lg text-textMuted hover:text-textMain"><IconChevronRight className="rotate-180" /></button>
              <span className="font-bold text-sm tracking-wide">{monthNames[pickerMonth.getMonth()]} {pickerMonth.getFullYear()}</span>
              <button onClick={nextMonth} className="p-1 hover:bg-primary/20 rounded-lg text-textMuted hover:text-textMain"><IconChevronRight /></button>
            </div>

            <div className="grid grid-cols-7 gap-1 text-center text-[10px] text-textMuted font-bold uppercase mb-2">
              <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div className="text-red-500">Сб</div><div className="text-red-500">Вс</div>
            </div>

            <div className="grid grid-cols-7 gap-1 mb-4">
              {Array.from({ length: firstDay }).map((_, i) => <div key={`empty-${i}`} />)}
              {Array.from({ length: daysInMonth }).map((_, i) => {
                const day = i + 1;
                const dateStr = `${pickerMonth.getFullYear()}-${String(pickerMonth.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isSelected = selectedDate === dateStr;
                const isToday = dateStr === getTodayStr();

                return (
                  <button
                    key={day} type="button" onClick={() => onSelectDate(dateStr)}
                    className={`h-9 w-9 text-sm rounded-xl flex items-center justify-center font-bold transition-all mx-auto ${
                      isSelected 
                        ? 'bg-primary text-white shadow-md scale-105' 
                        : isToday
                          ? 'border-2 border-primary text-primary hover:bg-primary/10'
                          : 'hover:bg-primary/20 text-textMain'
                    }`}
                  >
                    {day}
                  </button>
                );
              })}
            </div>

            <div className="flex justify-between items-center pt-3 border-t border-glassBorder">
              <button type="button" onClick={() => onSelectDate(getTodayStr())} className="text-primary font-bold px-3 py-1.5 bg-primary/10 hover:bg-primary/20 rounded-lg transition-colors text-sm">Сегодня</button>
              <button type="button" onClick={() => onSelectDate('')} className="text-textMuted font-bold hover:text-textMain px-3 py-1.5 hover:bg-black/5 dark:hover:bg-white/5 rounded-lg transition-colors text-sm">Без дедлайна</button>
            </div>
          </motion.div>
        </div>
      );
    };

    /* Компонент Выбора Цвета (Палитра) */
    const defaultColors = ['#9fc792', '#e9c46a', '#f4a261', '#e76f51', '#2a9d8f', '#457b9d', '#9b5de5'];
    
    const ColorPickerField = ({ value, onChange }) => {
      const [customColors, setCustomColors] = useState(() => {
        const saved = localStorage.getItem('studyflow-custom-colors');
        return saved ? JSON.parse(saved) : [];
      });

      const allColors = [...new Set([...defaultColors, ...customColors])].slice(-14); 

      const handleCustomAdd = (e) => {
        const newColor = e.target.value;
        onChange(newColor);
        if (!allColors.includes(newColor)) {
            const updated = [...customColors, newColor].slice(-7); 
            setCustomColors(updated);
            localStorage.setItem('studyflow-custom-colors', JSON.stringify(updated));
        }
      };

      return (
        <div className="flex flex-wrap gap-2 mt-2">
            {allColors.map(c => (
                <button 
                    key={c} type="button" onClick={() => onChange(c)}
                    className={`w-7 h-7 rounded-full border-2 transition-transform shadow-sm ${value === c ? 'border-textMain scale-110' : 'border-transparent hover:scale-110'}`}
                    style={{ backgroundColor: c }}
                />
            ))}
            <label className="relative w-7 h-7 rounded-full border-2 border-dashed border-textMuted flex items-center justify-center overflow-hidden hover:border-textMain text-textMuted hover:text-textMain cursor-pointer transition-colors bg-surface">
                <span className="text-lg leading-none absolute">+</span>
                <input type="color" className="opacity-0 absolute inset-0 w-full h-full cursor-pointer" onChange={handleCustomAdd} value={value || '#9fc792'} />
            </label>
        </div>
      )
    };

    // --- Окно Добавления Задачи ---
    const TaskModal = ({ isOpen, onClose, config }) => {
      const { tasks, saveTask, isDark } = useContext(TaskContext);
      const [showDatePicker, setShowDatePicker] = useState(false);
      
      const [formData, setFormData] = useState({
        id: null, title: '', subject: '', description: '', deadline: '', priority: 'normal', color: '', parentId: ''
      });

      useEffect(() => {
        if (isOpen) {
          const defaultColor = isDark ? '#9fc792' : '#3e6034';
          setShowDatePicker(false);
          if (config.editTask) {
            setFormData({ ...config.editTask, parentId: config.editTask.parentId || '' });
          } else {
            setFormData({
              id: null, title: '', subject: '', description: '',
              deadline: config.date || '', priority: 'normal', color: defaultColor, parentId: config.parentId || ''
            });
          }
        }
      }, [isOpen, config, isDark]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        saveTask({ ...formData, parentId: formData.parentId === '' ? null : formData.parentId });
        onClose();
      };

      // Логика защиты от циклического вложения (нельзя вложить задачу саму в себя или в своих детей)
      const getDescendants = (taskId, allTasks) => {
          const children = allTasks.filter(t => t.parentId === taskId);
          return children.reduce((acc, child) => [...acc, child.id, ...getDescendants(child.id, allTasks)], []);
      };
      const descendants = formData.id ? getDescendants(formData.id, tasks) : [];
      const possibleParentsRaw = tasks.filter(t => t.id !== formData.id && !descendants.includes(t.id));
      
      // Красивые пути (Родитель > Ребенок) для выпадающего списка
      const getPath = (task, allTasks) => {
          if (!task.parentId) return task.title;
          const parent = allTasks.find(t => t.id === task.parentId);
          if (!parent) return task.title;
          return getPath(parent, allTasks) + ' > ' + task.title;
      };
      const possibleParents = possibleParentsRaw.map(p => ({...p, path: getPath(p, tasks)})).sort((a,b) => a.path.localeCompare(b.path));

      return (
        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/50 backdrop-blur-md transition-opacity">
          <motion.div initial={{ y: '100%' }} animate={{ y: 0 }} className="glass-panel w-full sm:max-w-xl p-6 bg-surface shadow-2xl rounded-t-3xl sm:rounded-2xl pb-10 sm:pb-6 max-h-[92vh] overflow-y-auto no-scrollbar border border-glassBorder">
            <div className="w-12 h-1.5 bg-primary/30 rounded-full mx-auto mb-6 sm:hidden"></div>
            
            <div className="flex justify-between items-center mb-5">
              <h2 className="text-xl font-bold tracking-tight text-textMain">{formData.id ? 'Редактировать задание' : 'Новое задание'}</h2>
              <button type="button" onClick={onClose} className="p-1.5 rounded-xl text-textMuted hover:text-textMain bg-primary/10 hover:bg-primary/20 transition-colors"><IconClose /></button>
            </div>
            
            <form onSubmit={handleSubmit} className="flex flex-col gap-4">
              <input 
                value={formData.title} onChange={e=>setFormData({...formData, title: e.target.value})} required autoFocus 
                className="w-full bg-white dark:bg-black/40 border border-glassBorder rounded-xl px-4 py-3 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 outline-none focus:border-primary font-bold shadow-sm transition-all focus:ring-2 focus:ring-primary/20" 
                placeholder="Что нужно сделать?" 
              />
              
              <input 
                value={formData.subject} onChange={e=>setFormData({...formData, subject: e.target.value})} 
                className="w-full bg-white dark:bg-black/40 border border-glassBorder rounded-xl px-4 py-2.5 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 outline-none focus:border-primary text-sm font-bold shadow-sm transition-all focus:ring-2 focus:ring-primary/20" 
                placeholder="Предмет или категория" 
              />
              
              <textarea 
                value={formData.description} onChange={e=>setFormData({...formData, description: e.target.value})} rows="2" 
                className="w-full bg-white dark:bg-black/40 border border-glassBorder rounded-xl px-4 py-2.5 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 outline-none focus:border-primary text-sm font-medium resize-none shadow-sm transition-all focus:ring-2 focus:ring-primary/20" 
                placeholder="Подробное описание или ссылки..." 
              />
              
              <div className="grid grid-cols-2 gap-3">
                <div 
                  onClick={() => setShowDatePicker(true)}
                  className="bg-white dark:bg-black/40 border border-glassBorder rounded-xl px-4 py-2 flex flex-col shadow-sm cursor-pointer hover:border-primary/60 transition-colors"
                >
                  <label className="text-[10px] uppercase text-textMuted font-bold cursor-pointer">Дедлайн</label>
                  <div className="text-sm font-bold mt-1 flex items-center gap-1.5 text-gray-900 dark:text-white truncate">
                    <IconClock /> {formData.deadline ? getRelativeDateStr(formData.deadline) : 'Выбрать дату'}
                  </div>
                </div>

                <div className="bg-white dark:bg-black/40 border border-glassBorder rounded-xl px-4 py-2 flex flex-col shadow-sm">
                  <label className="text-[10px] uppercase text-textMuted font-bold">Приоритет</label>
                  <select value={formData.priority} onChange={e=>setFormData({...formData, priority: e.target.value})} className="w-full bg-transparent text-gray-900 dark:text-white outline-none text-sm cursor-pointer mt-1 appearance-none font-bold">
                    <option value="low" className="bg-surface text-textMain">Низкий</option>
                    <option value="normal" className="bg-surface text-textMain">Обычный</option>
                    <option value="high" className="bg-surface text-textMain">Высокий 🔥</option>
                    <option value="urgent" className="bg-surface text-textMain">Срочный 🔴</option>
                  </select>
                </div>
              </div>

              <div className="bg-white dark:bg-black/40 border border-glassBorder rounded-xl px-4 py-3 flex flex-col shadow-sm">
                <label className="text-[10px] uppercase text-textMuted font-bold mb-1">Цвет метки</label>
                <ColorPickerField value={formData.color} onChange={(c) => setFormData({...formData, color: c})} />
              </div>

              <div className="bg-white dark:bg-black/40 border border-glassBorder rounded-xl px-4 py-2 flex flex-col shadow-sm">
                <label className="text-[10px] uppercase text-textMuted font-bold">Вложить в (Сделать подзадачей)</label>
                <select value={formData.parentId} onChange={e=>setFormData({...formData, parentId: e.target.value})} className="w-full bg-transparent text-gray-900 dark:text-white outline-none text-sm cursor-pointer mt-1 appearance-none font-bold truncate">
                  <option value="" className="bg-surface text-textMain">- Выбрать -</option>
                  {possibleParents.map(p => <option key={p.id} value={p.id} className="bg-surface text-textMain">{p.path}</option>)}
                </select>
              </div>
              
              <div className="flex justify-end gap-3 mt-4">
                <button type="button" onClick={onClose} className="px-5 py-2.5 text-textMuted bg-primary/10 hover:bg-primary/20 rounded-xl transition-colors font-bold">Отмена</button>
                <button type="submit" className="px-6 py-2.5 bg-primary hover:bg-primaryHover text-white font-bold rounded-xl shadow-lg shadow-primary/30 transition-all active:scale-95">Сохранить</button>
              </div>
            </form>
          </motion.div>

          <MiniDatePickerModal 
            isOpen={showDatePicker} 
            selectedDate={formData.deadline} 
            onSelectDate={(date) => { setFormData({ ...formData, deadline: date }); setShowDatePicker(false); }} 
            onClose={() => setShowDatePicker(false)}
          />
        </div>
      );
    };

    /* Модальное окно просмотра всех задач выбранного дня */
    const DayTasksModal = ({ isOpen, onClose, date, onOpenModal }) => {
      const { tasks } = useContext(TaskContext);
      if (!isOpen || !date) return null;

      const dayTasks = tasks.filter(t => t.deadline === date);
      const topLevelDayTasks = dayTasks.filter(t => !dayTasks.find(p => p.id === t.parentId));

      const d = new Date(date);
      const titleDate = `${d.getDate()} ${monthNames[d.getMonth()]}, ${dayNames[d.getDay()]}`;

      return (
        <div className="fixed inset-0 z-[140] flex items-center justify-center p-4 bg-black/50 backdrop-blur-md">
          <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="glass-panel w-full max-w-lg p-6 bg-surface shadow-2xl rounded-2xl max-h-[85vh] flex flex-col border border-glassBorder text-textMain">
            <div className="flex justify-between items-center pb-3 border-b border-glassBorder mb-4">
              <div>
                <span className="text-xs uppercase font-bold text-textMuted tracking-wider">План на день</span>
                <h3 className="text-lg font-bold text-textMain mt-0.5">{titleDate}</h3>
              </div>
              <button onClick={onClose} className="p-2 rounded-xl text-textMuted hover:text-textMain bg-primary/10 hover:bg-primary/20 transition-colors"><IconClose /></button>
            </div>

            <div className="flex-1 overflow-y-auto no-scrollbar space-y-2 mb-4">
              {topLevelDayTasks.length === 0 ? (
                <div className="text-center py-10 text-textMuted text-sm font-bold bg-primary/5 rounded-xl border border-glassBorder">
                  На этот день ничего не запланировано. ✨
                </div>
              ) : (
                topLevelDayTasks.map(task => (
                  <TaskItem key={task.id} task={task} onOpenModal={(cfg) => { onClose(); onOpenModal(cfg); }} />
                ))
              )}
            </div>

            <button
              onClick={() => { onClose(); onOpenModal({ date }); }}
              className="w-full py-3 bg-primary hover:bg-primaryHover text-white rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-primary/20 transition-all active:scale-95"
            >
              <IconPlus /> Добавить задачу на этот день
            </button>
          </motion.div>
        </div>
      );
    };

    const Dashboard = ({ onOpenModal }) => {
      const { tasks, isSyncing } = useContext(TaskContext);
      const todayStr = getTodayStr();
      
      const allRoot = useMemo(() => tasks.filter(t => !t.parentId), [tasks]);
      const todayTasks = useMemo(() => allRoot.filter(t => t.deadline === todayStr), [allRoot, todayStr]);
      const todayCompleted = useMemo(() => todayTasks.filter(t => t.status === 'completed').length, [todayTasks]);
      
      let progressToday = 100;
      let progressText = '100% (Можно играть в SIMS 🎮)';
      let subtitleText = 'На сегодня задач нет.';

      if (todayTasks.length > 0) {
        progressToday = Math.round((todayCompleted / todayTasks.length) * 100);
        subtitleText = `Выполнено ${todayCompleted} из ${todayTasks.length} задач`;
        progressText = progressToday === 100 ? '100% (Можно играть в SIMS 🎮)' : `${progressToday}%`;
      }

      const activeRoot = useMemo(() => {
        return allRoot
          .filter(t => t.status === 'active')
          .slice()
          .sort((a, b) => {
            const scoreA = priorityScore[a.priority || 'normal'] || 2;
            const scoreB = priorityScore[b.priority || 'normal'] || 2;
            if (scoreA !== scoreB) return scoreB - scoreA;
            const dateA = a.deadline || '9999-99-99';
            const dateB = b.deadline || '9999-99-99';
            return dateA.localeCompare(dateB);
          });
      }, [allRoot]);

      const completedRoot = useMemo(() => allRoot.filter(t => t.status === 'completed'), [allRoot]);

      return (
        <div className="animate-fade-in pb-32 sm:pb-10">
          <header className="mb-8">
            <h1 className="text-2xl sm:text-3xl font-bold text-textMain mb-3 tracking-tight flex items-center gap-3">
               Ваш план 
               {isSyncing && <IconCloud className="w-5 h-5 text-textMuted animate-pulse" />}
            </h1>
            <div className="glass-panel p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-5 bg-surface/80 border-glassBorder">
              <div>
                <h3 className="font-bold text-textMain text-lg">Прогресс за сегодня</h3>
                <p className="text-sm font-bold text-textMuted mt-1">{subtitleText}</p>
              </div>
              <div className="w-full sm:w-1/2 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
                <div className="flex-1 h-4 bg-black/10 dark:bg-white/10 rounded-full overflow-hidden border border-glassBorder shadow-inner">
                  <motion.div initial={{ width: 0 }} animate={{ width: `${progressToday}%` }} className="h-full bg-primary rounded-full relative overflow-hidden transition-all duration-500">
                    <div className="absolute inset-0 bg-white/20 w-full h-full skew-x-12 translate-x-[-100%] animate-[shimmer_2s_infinite]"></div>
                  </motion.div>
                </div>
                <span className="text-sm font-bold text-primary">{progressText}</span>
              </div>
            </div>
          </header>

          <div className="glass-panel p-2 mb-6 bg-surface/50 border-glassBorder">
            <div className="flex justify-between items-center p-4 mb-2 border-b border-glassBorder">
              <h2 className="text-lg font-bold text-textMain">Активные задания</h2>
              <button onClick={() => onOpenModal({})} className="bg-primary hover:bg-primaryHover text-white px-4 py-2 rounded-xl text-sm font-bold transition-colors shadow-lg shadow-primary/20">
                + Добавить
              </button>
            </div>
            <div className="p-2">
              {activeRoot.length === 0 ? 
                <div className="text-center text-textMuted py-10 font-bold">Все актуальные задачи выполнены! ✨</div> : 
                activeRoot.map(task => <TaskItem key={task.id} task={task} onOpenModal={onOpenModal} />)
              }
            </div>
          </div>

          {completedRoot.length > 0 && (
            <div className="p-2">
              <h3 className="text-sm font-bold text-textMuted uppercase tracking-wider mb-3 pl-2">Выполненные</h3>
              <div className="flex flex-col gap-1 opacity-60 hover:opacity-100 transition-opacity">
                {completedRoot.map(task => <TaskItem key={task.id} task={task} onOpenModal={onOpenModal} />)}
              </div>
            </div>
          )}
        </div>
      );
    };

    const CalendarView = ({ onOpenModal }) => {
      const { tasks } = useContext(TaskContext);
      const [viewMode, setViewMode] = useState('month'); 
      const [currentMonth, setCurrentMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
      const [currentWeek, setCurrentWeek] = useState(() => getStartOfWeek(new Date()));
      const [viewDayDate, setViewDayDate] = useState(null);

      const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
      let firstDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();
      firstDay = firstDay === 0 ? 6 : firstDay - 1;
      
      const nextMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1));
      const prevMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1));
      
      const nextWeek = () => { const d = new Date(currentWeek); d.setDate(d.getDate() + 7); setCurrentWeek(d); };
      const prevWeek = () => { const d = new Date(currentWeek); d.setDate(d.getDate() - 7); setCurrentWeek(d); };
      
      const weekDays = Array.from({length: 7}).map((_, i) => {
        const d = new Date(currentWeek); d.setDate(d.getDate() + i);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      });

      const getTasksForDate = (dateStr) => {
         return tasks.filter(t => {
            if (t.deadline !== dateStr) return false;
            if (t.parentId) {
               const parent = tasks.find(p => p.id === t.parentId);
               if (parent && parent.deadline === dateStr) return false; 
            }
            return true;
         });
      };

      const weekTasks = [];
      weekDays.forEach(d => weekTasks.push(...getTasksForDate(d)));
      const weekProgress = weekTasks.length > 0 ? Math.round((weekTasks.filter(t => t.status === 'completed').length / weekTasks.length) * 100) : 100;

      const titleMonth = `${monthNames[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;
      const titleWeek = `${new Date(weekDays[0]).getDate()} ${monthNames[new Date(weekDays[0]).getMonth()]} - ${new Date(weekDays[6]).getDate()} ${monthNames[new Date(weekDays[6]).getMonth()]}`;

      return (
        <div className="animate-fade-in pb-32 sm:pb-10 h-full flex flex-col">
          <header className="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div className="flex items-center justify-between w-full sm:w-auto gap-4">
               <h1 className="text-2xl font-bold text-textMain">Календарь</h1>
               <div className="flex bg-surface p-1 rounded-xl border border-glassBorder shadow-sm">
                 <button onClick={() => setViewMode('month')} className={`px-4 py-1.5 text-sm font-bold rounded-lg transition-colors ${viewMode === 'month' ? 'bg-primary text-white' : 'text-textMuted hover:text-textMain'}`}>Месяц</button>
                 <button onClick={() => setViewMode('week')} className={`px-4 py-1.5 text-sm font-bold rounded-lg transition-colors ${viewMode === 'week' ? 'bg-primary text-white' : 'text-textMuted hover:text-textMain'}`}>Неделя</button>
               </div>
            </div>
            
            <div className="flex items-center gap-2 bg-surface p-1.5 rounded-2xl border border-glassBorder shadow-sm w-full sm:w-auto justify-between sm:justify-start">
              <button onClick={viewMode === 'month' ? prevMonth : prevWeek} className="p-2 rounded-xl hover:bg-primary/20 transition-colors text-textMain"><IconChevronRight className="rotate-180" /></button>
              <span className="font-bold text-sm text-center text-textMain px-2 whitespace-nowrap">{viewMode === 'month' ? titleMonth : titleWeek}</span>
              <button onClick={viewMode === 'month' ? nextMonth : nextWeek} className="p-2 rounded-xl hover:bg-primary/20 transition-colors text-textMain"><IconChevronRight /></button>
            </div>
          </header>

          {viewMode === 'month' ? (
            <div className="glass-panel flex-1 p-4 sm:p-6 flex flex-col bg-surface/50 border-glassBorder animate-fade-in">
              <div className="grid grid-cols-7 gap-1 sm:gap-2 mb-3 text-center text-[10px] sm:text-xs font-bold text-textMuted uppercase">
                <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div className="text-red-500/80">Сб</div><div className="text-red-500/80">Вс</div>
              </div>
              <div className="grid grid-cols-7 gap-1 sm:gap-2 flex-1 auto-rows-fr">
                {Array.from({ length: firstDay }).map((_, i) => <div key={`empty-${i}`} className="rounded-2xl bg-black/5 dark:bg-white/5 opacity-30"></div>)}
                {Array.from({ length: daysInMonth }).map((_, i) => {
                  const day = i + 1;
                  const dateStr = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                  const dayTasks = getTasksForDate(dateStr);
                  const isToday = dateStr === getTodayStr();

                  return (
                    <div 
                      key={day} 
                      onClick={() => setViewDayDate(dateStr)} 
                      className={`p-1 sm:p-2 rounded-2xl border flex flex-col gap-1 cursor-pointer transition-colors ${isToday ? 'border-primary bg-primary/15 shadow-sm' : 'border-glassBorder bg-surface hover:border-primary/50 hover:bg-primary/10'}`}
                    >
                      <div className="flex justify-between items-center px-1">
                        <span className={`text-xs sm:text-sm font-bold ${isToday ? 'text-primary' : 'text-textMain'}`}>{day}</span>
                        {dayTasks.length > 0 && <span className="w-2 h-2 rounded-full bg-primary shadow-sm"></span>}
                      </div>
                      <div className="hidden sm:flex flex-col gap-1 overflow-y-auto no-scrollbar max-h-20 mt-1">
                        {dayTasks.map(t => (
                          <div key={t.id} className={`text-[10px] px-1.5 py-0.5 rounded-md flex items-center gap-1 truncate font-bold ${t.status === 'completed' ? 'opacity-50 line-through bg-black/5 dark:bg-white/5' : 'bg-primary/20 text-textMain border border-primary/20'}`}>
                            {t.parentId && <span className="text-primary opacity-50 text-[8px] mr-0.5">└</span>} {t.title}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
            <div className="glass-panel flex-1 p-4 sm:p-6 flex flex-col overflow-y-auto bg-surface/50 border-glassBorder animate-fade-in no-scrollbar">
               <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2 mb-6 p-4 bg-primary/10 rounded-2xl border border-primary/20">
                 <span className="font-bold text-textMain">Прогресс недели (Все задачи)</span>
                 <div className="flex items-center gap-3 w-full sm:w-1/2">
                    <div className="flex-1 h-3 bg-black/10 dark:bg-white/10 rounded-full overflow-hidden">
                      <motion.div initial={{ width: 0 }} animate={{ width: `${weekProgress}%` }} className="h-full bg-primary rounded-full"></motion.div>
                    </div>
                    <span className="text-sm font-bold text-primary">{weekProgress}%</span>
                 </div>
               </div>

               <div className="flex flex-col gap-4">
                 {weekDays.map((dateStr, i) => {
                    const dayTasks = getTasksForDate(dateStr);
                    const isToday = dateStr === getTodayStr();
                    const d = new Date(dateStr);
                    
                    return (
                      <div key={dateStr} className={`p-4 rounded-2xl border ${isToday ? 'border-primary bg-primary/5 shadow-sm' : 'border-glassBorder bg-surface'} flex flex-col gap-3`}>
                        <div className="flex justify-between items-center border-b border-glassBorder pb-2">
                          <h3 className={`font-bold ${isToday ? 'text-primary' : 'text-textMain'}`}>{dayNames[i]}, <span className="font-bold text-textMuted text-sm">{d.getDate()} {monthNames[d.getMonth()]}</span></h3>
                          <button onClick={() => onOpenModal({ date: dateStr })} className="text-primary bg-primary/10 hover:bg-primary hover:text-white p-1.5 rounded-lg transition-colors"><IconPlus /></button>
                        </div>
                        <div className="flex flex-col gap-1">
                           {dayTasks.length === 0 ? <p className="text-xs text-textMuted italic font-bold">Нет задач</p> : dayTasks.map(t => <TaskItem key={t.id} task={t} onOpenModal={onOpenModal} />)}
                        </div>
                      </div>
                    )
                 })}
               </div>
            </div>
          )}

          <DayTasksModal 
            isOpen={Boolean(viewDayDate)} 
            onClose={() => setViewDayDate(null)} 
            date={viewDayDate} 
            onOpenModal={(cfg) => { setViewDayDate(null); onOpenModal(cfg); }} 
          />
        </div>
      );
    };

    const SettingsView = () => (
      <div className="animate-fade-in pb-32 sm:pb-10 max-w-2xl"><h1 className="text-2xl font-bold text-textMain mb-6">Настройки</h1><div className="glass-panel p-6 bg-surface/80 border-glassBorder">
        <TaskContext.Consumer>
          {({ isDark, setIsDark }) => (
            <div className="flex items-center justify-between">
              <div><h3 className="font-bold text-textMain text-lg">Оформление</h3><p className="text-textMuted text-sm font-bold mt-1">Переключение между светлой и темной темой.</p></div>
              <button onClick={() => setIsDark(!isDark)} className="p-4 bg-surface rounded-2xl border border-glassBorder shadow-md hover:border-primary hover:text-primary transition-colors text-textMain"><IconSun /></button>
            </div>
          )}
        </TaskContext.Consumer>
      </div></div>
    );

    const App = () => {
      const [currentView, setCurrentView] = useState('dashboard');
      const [modalConfig, setModalConfig] = useState(null); 
      
      const navItems = [
        { id: 'dashboard', icon: IconHome, label: 'Главная' }, { id: 'calendar', icon: IconCalendar, label: 'Календарь' }, { id: 'settings', icon: IconSettings, label: 'Настройки' }
      ];

      return (
        <div className="flex h-screen w-full relative">
          <aside className="hidden md:flex w-64 h-full border-r border-glassBorder bg-surface/80 backdrop-blur-2xl flex-col p-6 z-10 shadow-2xl">
            <div className="flex items-center gap-3 mb-10 text-textMain cursor-pointer" onClick={() => setCurrentView('dashboard')}>
              <div className="w-10 h-10 rounded-2xl bg-primary flex items-center justify-center shadow-lg shadow-primary/30"><span className="font-bold text-xl text-white">S</span></div>
              <span className="text-xl font-bold tracking-wide">StudyFlow</span>
            </div>
            <nav className="flex flex-col gap-2">
              {navItems.map(item => (
                 <button key={item.id} onClick={() => setCurrentView(item.id)} className={`flex items-center gap-3 px-4 py-3.5 rounded-2xl transition-all w-full text-left font-bold ${currentView === item.id ? 'bg-primary text-white shadow-md shadow-primary/20' : 'text-textMuted hover:bg-primary/10 hover:text-textMain'}`}>
                  <item.icon /> <span>{item.label}</span>
                </button>
              ))}
            </nav>
          </aside>

          <nav className="md:hidden fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-xl border-t border-glassBorder flex justify-around items-center p-2 z-[90] pb-safe shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
            {navItems.map(item => (
              <button key={item.id} onClick={() => setCurrentView(item.id)} className={`flex flex-col items-center gap-1 p-2 w-20 rounded-xl transition-all ${currentView === item.id ? 'text-primary' : 'text-textMuted'}`}>
                <item.icon /> <span className="text-[10px] font-bold">{item.label}</span>
              </button>
            ))}
          </nav>

          <main className="flex-1 h-full overflow-y-auto p-4 sm:p-8 relative no-scrollbar">
            {currentView === 'dashboard' && <Dashboard onOpenModal={setModalConfig} />}
            {currentView === 'calendar' && <CalendarView onOpenModal={setModalConfig} />}
            {currentView === 'settings' && <SettingsView />}
          </main>
          
          <TaskModal isOpen={!!modalConfig} onClose={() => setModalConfig(null)} config={modalConfig || {}} />
        </div>
      );
    }

    const Root = () => <AppProvider><App /></AppProvider>;
    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
