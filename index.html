<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StudyFlow — Рабочее пространство</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { 
            background: 'var(--bg-color)', 
            surface: 'var(--surface-color)', 
            surfaceHover: 'var(--surface-hover)',
            inputBg: 'var(--input-bg)',
            primary: 'var(--primary-color)', 
            primaryHover: 'var(--primary-hover)',
            btnText: 'var(--btn-text)',
            glass: 'var(--glass-bg)', 
            glassBorder: 'var(--glass-border)',
            textMain: 'var(--text-main)', 
            textMuted: 'var(--text-muted)'
          },
          fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Firebase Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
    
    /* Светлая тема: Фирменный салатовый (#9fc792) + тактильный мятный фарфор */
    :root {
      --bg-color: #9fc792;
      --bg-gradient: radial-gradient(circle at 10% 15%, #b5d9a8 0%, #9fc792 55%, #8db680 100%);
      --surface-color: #f3f8f1; 
      --surface-hover: #e9f2e6;
      --input-bg: #e2ede0;
      --glass-bg: rgba(243, 248, 241, 0.86);
      --glass-border: rgba(45, 79, 37, 0.18); 
      --text-main: #142411; 
      --text-muted: #43613c; 
      --primary-color: #2d5225;
      --primary-hover: #1e3b18;
      --btn-text: #f5faf4;
      --shadow-soft: 0 10px 30px -10px rgba(20, 36, 17, 0.12), 0 4px 12px -2px rgba(20, 36, 17, 0.05);
    }

    /* Тёмная тема: Глубокий хвойный лес */
    .dark {
      --bg-color: #0b100b;
      --bg-gradient: radial-gradient(circle at 15% 15%, #162215 0%, #0b100b 65%);
      --surface-color: #141d13; 
      --surface-hover: #1b271a;
      --input-bg: #1e2c1c;
      --glass-bg: rgba(20, 29, 19, 0.88);
      --glass-border: rgba(159, 199, 146, 0.16);
      --text-main: #edf5eb;
      --text-muted: #8aa685;
      --primary-color: #9fc792;
      --primary-hover: #b4d8a8;
      --btn-text: #0f1a0d;
      --shadow-soft: 0 14px 36px -10px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      margin: 0; 
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    
    .bento-card {
      background: var(--glass-bg); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); 
      border-radius: 1.25rem; 
      box-shadow: var(--shadow-soft);
    }

    .task-card {
      background: var(--surface-color);
      border: 1px solid var(--glass-border);
      border-radius: 1rem;
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .task-card:hover {
      background: var(--surface-hover);
      box-shadow: 0 4px 14px -4px rgba(20, 36, 17, 0.08);
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%) skewX(-15deg); }
      100% { transform: translateX(200%) skewX(-15deg); }
    }
    .shimmer-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      animation: shimmer 2.8s infinite;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useMemo, useRef, useCallback, memo } = React;

    // --- Firebase Инициализация (Твоя база данных) ---
    const firebaseConfig = {
      apiKey: "AIzaSyDz5wPBB05uU0q1vlQlgyGWmnyVwt3APk0",
      authDomain: "ourwishlist-b6bd7.firebaseapp.com",
      databaseURL: "https://ourwishlist-b6bd7-default-rtdb.firebaseio.com",
      projectId: "ourwishlist-b6bd7",
      storageBucket: "ourwishlist-b6bd7.firebasestorage.app",
      messagingSenderId: "170914082679",
      appId: "1:170914082679:web:2bc01fc83713a230fe3b72",
      measurementId: "G-LTX7TDL8KP"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- Утилиты дат и звука ---
    const generateId = () => Math.random().toString(36).substr(2, 9);
    
    const getTodayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const getOffsetDateStr = (offsetDays) => {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    
    const getRelativeDateStr = (dateStr) => {
      if (!dateStr) return '';
      const today = new Date(getTodayStr()); 
      const target = new Date(dateStr);
      const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return 'Сегодня';
      if (diffDays === 1) return 'Завтра';
      if (diffDays === 2) return 'Послезавтра';
      if (diffDays === -1) return 'Вчера (Просрочено)';
      if (diffDays < -1) return `Просрочено (${Math.abs(diffDays)} дн.)`;
      if (diffDays > 2 && diffDays <= 7) return `Через ${diffDays} дн.`;
      return target.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    };

    const getStartOfWeek = (date) => {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
      return new Date(d.setDate(diff));
    };

    const playChime = (type = 'complete') => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = type === 'complete' ? [523.25, 659.25, 783.99] : [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.07, ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.08);
          osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
        });
      } catch (e) {}
    };

    const priorityScore = { urgent: 4, high: 3, normal: 2, low: 1 };
    const priorityLabels = { urgent: 'Срочно', high: 'Высокий', normal: 'Обычный', low: 'Низкий' };
    const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    const dayNames = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
    const defaultColors = ['#2d5225', '#67945b', '#2a9d8f', '#d97706', '#e76f51', '#3b82f6', '#8b5cf6', '#ec4899'];

    // --- Иконки ---
    const IconHome = () => <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>;
    const IconCalendar = () => <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const IconClock = ({ size = 14 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const IconTarget = () => <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
    const IconSettings = () => <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    const IconChevronRight = ({ className = "" }) => <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;
    const IconCircle = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9.5"/></svg>;
    const IconCheckCircle = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="var(--surface-color)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="16 9 10.5 14.5 8 12"/></svg>;
    const IconTrash = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    const IconEdit = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
    const IconPlus = ({ size = 16 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const IconClose = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconSun = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
    const IconMoon = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
    const IconCloud = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>;
    const IconSearch = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const IconPin = ({ active }) => <svg width="14" height="14" viewBox="0 0 24 24" fill={active ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>;
    const IconLink = () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>;
    const IconPlumbob = () => (
      <svg width="16" height="20" viewBox="0 0 24 32" fill="none" className="inline-block animate-bounce">
        <polygon points="12,1 22,16 12,31 2,16" fill="#22c55e" stroke="#14532d" strokeWidth="1.5"/>
        <polygon points="12,1 22,16 12,16" fill="#86efac" opacity="0.75"/>
        <polygon points="12,31 22,16 12,16" fill="#16a34a" opacity="0.85"/>
      </svg>
    );

    // --- Стейт-менеджмент и Безопасная Синхронизация ---
    const TaskContext = createContext();

    // Чтение всех прошлых версий из localStorage без потери данных
    const getInitialLocalTasks = () => {
      for (let i = 10; i >= 1; i--) {
        const saved = localStorage.getItem(`studyflow-tasks-v${i}`);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          } catch(e) {}
        }
      }
      const legacy = localStorage.getItem('studyflow-tasks');
      if (legacy) {
        try {
          const parsed = JSON.parse(legacy);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        } catch(e) {}
      }
      return [];
    };

    const AppProvider = ({ children }) => {
      const [tasks, setTasks] = useState(getInitialLocalTasks);
      const [toasts, setToasts] = useState([]);
      const [isSyncing, setIsSyncing] = useState(true);
      const [soundEnabled, setSoundEnabled] = useState(() => localStorage.getItem('studyflow-sound') !== 'false');
      const [expandSignal, setExpandSignal] = useState({ mode: true, tick: 0 });
      const cloudReadyRef = useRef(false);

      // Глобальный таймер Помодоро (работает даже при переключении вкладок)
      const [pomoMode, setPomoMode] = useState('work');
      const [pomoSeconds, setPomoSeconds] = useState(25 * 60);
      const [pomoRunning, setPomoRunning] = useState(false);
      const [pomoTaskId, setPomoTaskId] = useState('');
      const pomoDurations = { work: 25 * 60, short: 5 * 60, long: 15 * 60 };

      const [isDark, setIsDark] = useState(() => {
        const saved = localStorage.getItem('studyflow-theme-settings');
        return saved ? saved === 'dark' : false; // По умолчанию фирменная светлая салатовая тема
      });

      useEffect(() => {
        const tasksRef = db.ref('tasks');

        tasksRef.on('value', (snapshot) => {
          cloudReadyRef.current = true;
          if (snapshot.exists()) {
            const data = snapshot.val();
            const loadedTasks = Object.values(data)
              .filter(Boolean)
              .map(t => ({
                ...t,
                parentId: t.parentId || null,
                isPinned: Boolean(t.isPinned)
              }));
            setTasks(loadedTasks);
            localStorage.setItem('studyflow-tasks-v6', JSON.stringify(loadedTasks));
          } else {
            // Если в облаке пусто, но локально есть старые задачи — бережно переносим их в облако
            const localBackup = getInitialLocalTasks();
            if (localBackup.length > 0) {
              const tasksObj = {};
              localBackup.forEach(t => { if (t && t.id) tasksObj[t.id] = JSON.parse(JSON.stringify(t)); });
              tasksRef.set(tasksObj);
            }
          }
          setIsSyncing(false);
        }, () => {
          setIsSyncing(false);
        });

        return () => tasksRef.off();
      }, []);

      useEffect(() => {
        localStorage.setItem('studyflow-theme-settings', isDark ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', isDark);
      }, [isDark]);

      useEffect(() => {
        localStorage.setItem('studyflow-sound', soundEnabled ? 'true' : 'false');
      }, [soundEnabled]);

      // Работа фонового таймера Помодоро
      useEffect(() => {
        if (!pomoRunning) return;
        const timer = setInterval(() => {
          setPomoSeconds(prev => {
            if (prev <= 1) {
              setPomoRunning(false);
              if (soundEnabled) playChime('timer');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [pomoRunning, soundEnabled]);

      const switchPomoMode = useCallback((newMode) => {
        setPomoRunning(false);
        setPomoMode(newMode);
        setPomoSeconds(pomoDurations[newMode]);
      }, []);

      const addToast = useCallback((message, type = 'success', undoAction = null) => {
        const id = generateId();
        setToasts(prev => [...prev, { id, message, type, undoAction }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), undoAction ? 5500 : 3000);
      }, []);

      const syncToFirebase = useCallback((newTasksArray) => {
        const cleanArray = JSON.parse(JSON.stringify(newTasksArray));
        setTasks(cleanArray);
        localStorage.setItem('studyflow-tasks-v6', JSON.stringify(cleanArray));
        const tasksObj = {};
        cleanArray.forEach(t => { if (t && t.id) tasksObj[t.id] = t; });
        db.ref('tasks').set(tasksObj).catch(() => {
          addToast('Сохранено локально (нет сети)', 'error');
        });
      }, [addToast]);

      const toggleComplete = useCallback((id) => {
        setTasks(prev => {
          const target = prev.find(t => t.id === id);
          if (!target) return prev;
          const nextStatus = target.status === 'completed' ? 'active' : 'completed';
          if (nextStatus === 'completed' && soundEnabled) playChime('complete');
          const updated = prev.map(t => t.id === id ? { ...t, status: nextStatus } : t);
          localStorage.setItem('studyflow-tasks-v6', JSON.stringify(updated));
          db.ref(`tasks/${id}/status`).set(nextStatus);
          return updated;
        });
      }, [soundEnabled]);

      const togglePin = useCallback((id) => {
        setTasks(prev => {
          const target = prev.find(t => t.id === id);
          if (!target) return prev;
          const nextPin = !target.isPinned;
          const updated = prev.map(t => t.id === id ? { ...t, isPinned: nextPin } : t);
          localStorage.setItem('studyflow-tasks-v6', JSON.stringify(updated));
          db.ref(`tasks/${id}/isPinned`).set(nextPin);
          return updated;
        });
      }, []);

      const saveTask = useCallback((task) => {
        if (task.id) {
          setTasks(prev => {
            const updated = prev.map(t => t.id === task.id ? { ...t, ...task } : t);
            const cleanItem = JSON.parse(JSON.stringify(updated.find(t => t.id === task.id)));
            localStorage.setItem('studyflow-tasks-v6', JSON.stringify(updated));
            db.ref(`tasks/${task.id}`).set(cleanItem);
            return updated;
          });
          addToast('Задача обновлена');
        } else {
          const newTask = JSON.parse(JSON.stringify({ 
            ...task, 
            id: generateId(), 
            createdAt: getTodayStr(), 
            status: 'active',
            parentId: task.parentId || null,
            isPinned: Boolean(task.isPinned)
          }));
          setTasks(prev => {
            const updated = [...prev, newTask];
            localStorage.setItem('studyflow-tasks-v6', JSON.stringify(updated));
            db.ref(`tasks/${newTask.id}`).set(newTask);
            return updated;
          });
          addToast('Задача добавлена');
        }
      }, [addToast]);

      const deleteTask = useCallback((id) => {
        setTasks(prev => {
          const getChildrenIds = (parentId, allTasks) => {
            const children = allTasks.filter(t => t.parentId === parentId);
            return children.reduce((acc, child) => [...acc, child.id, ...getChildrenIds(child.id, allTasks)], []);
          };
          const idsToRemove = [id, ...getChildrenIds(id, prev)];
          const backupTasks = [...prev];
          const newTasks = prev.filter(t => !idsToRemove.includes(t.id));
          
          localStorage.setItem('studyflow-tasks-v6', JSON.stringify(newTasks));
          const updates = {};
          idsToRemove.forEach(remId => { updates[remId] = null; });
          db.ref('tasks').update(updates);

          addToast('Удалено', 'error', () => {
            syncToFirebase(backupTasks);
            addToast('Восстановлено!');
          });
          return newTasks;
        });
      }, [addToast, syncToFirebase]);

      const triggerExpandAll = (mode) => setExpandSignal(prev => ({ mode, tick: prev.tick + 1 }));

      return (
        <TaskContext.Provider value={{ 
          tasks, syncToFirebase, toggleComplete, togglePin, saveTask, deleteTask, 
          isDark, setIsDark, soundEnabled, setSoundEnabled, addToast, isSyncing,
          expandSignal, triggerExpandAll,
          pomoMode, pomoSeconds, pomoRunning, setPomoRunning, switchPomoMode, pomoTaskId, setPomoTaskId, pomoDurations
        }}>
          {children}
          {/* Уведомления */}
          <div className="fixed top-4 right-4 z-[300] flex flex-col gap-2 max-w-xs w-full pointer-events-none">
            {toasts.map(toast => (
              <div 
                key={toast.id} 
                className="pointer-events-auto px-4 py-3 rounded-2xl shadow-xl border backdrop-blur-xl text-xs font-extrabold flex items-center justify-between gap-3 bg-surface border-glassBorder text-textMain transition-all"
              >
                <div className="flex items-center gap-2">
                  {toast.type === 'error' ? <IconTrash /> : <IconCheckCircle />}
                  <span>{toast.message}</span>
                </div>
                {toast.undoAction && (
                  <button 
                    onClick={() => { toast.undoAction(); setToasts(prev => prev.filter(t => t.id !== toast.id)); }}
                    className="px-2.5 py-1 rounded-xl bg-primary text-btnText text-[11px] font-extrabold hover:opacity-90"
                  >
                    Вернуть
                  </button>
                )}
              </div>
            ))}
          </div>
        </TaskContext.Provider>
      );
    };

    // --- Оптимизированная Карточка Задачи с Мгновенным Вводом Подзадач ---
    const TaskItem = memo(({ task, level = 0, onOpenModal }) => {
      const { tasks, toggleComplete, togglePin, saveTask, deleteTask, expandSignal, isDark } = useContext(TaskContext);
      const [isExpanded, setIsExpanded] = useState(true);
      const [showInlineSub, setShowInlineSub] = useState(false);
      const [inlineTitle, setInlineTitle] = useState('');

      useEffect(() => {
        if (expandSignal.tick > 0) setIsExpanded(expandSignal.mode);
      }, [expandSignal]);
      
      const children = useMemo(() => {
        return tasks
          .filter(t => t.parentId === task.id)
          .sort((a, b) => {
            if (a.status !== b.status) return a.status === 'completed' ? 1 : -1;
            const scoreA = priorityScore[a.priority || 'normal'] || 2;
            const scoreB = priorityScore[b.priority || 'normal'] || 2;
            if (scoreA !== scoreB) return scoreB - scoreA;
            return (a.deadline || '9999-99-99').localeCompare(b.deadline || '9999-99-99');
          });
      }, [tasks, task.id]);

      const isCompleted = task.status === 'completed';
      const completedChildrenCount = children.filter(c => c.status === 'completed').length;
      const progress = children.length > 0 ? Math.round((completedChildrenCount / children.length) * 100) : null;
      const allChildrenDone = children.length > 0 && completedChildrenCount === children.length && !isCompleted;
      
      const dateStatusStr = getRelativeDateStr(task.deadline);
      const isOverdue = task.deadline && task.deadline < getTodayStr() && !isCompleted;

      const handleInlineSubSubmit = (e) => {
        e.preventDefault();
        if (!inlineTitle.trim()) return;
        saveTask({
          title: inlineTitle.trim(),
          subject: task.subject || '',
          description: '',
          link: '',
          deadline: task.deadline || '',
          priority: 'normal',
          color: task.color || (isDark ? '#9fc792' : '#2d5225'),
          parentId: task.id
        });
        setInlineTitle('');
        setIsExpanded(true);
      };

      return (
        <div className="w-full">
          <div 
            className={`task-card group relative flex flex-col p-3 sm:px-3.5 sm:py-2.5 overflow-hidden ${task.isPinned && !isCompleted ? 'ring-1 ring-primary/50' : ''} ${isCompleted ? 'opacity-60' : ''}`}
            style={{ borderLeft: `4px solid ${task.color || 'var(--primary-color)'}` }}
          >
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div className="flex items-start gap-2.5 flex-1 min-w-0">
                {children.length > 0 ? (
                  <button 
                    onClick={() => setIsExpanded(!isExpanded)} 
                    className="p-1 mt-0.5 rounded-lg hover:bg-inputBg transition-colors text-textMuted"
                    title={isExpanded ? "Свернуть подзадачи" : "Развернуть подзадачи"}
                  >
                    <IconChevronRight className={`transition-transform duration-200 ${isExpanded ? 'rotate-90' : ''}`} />
                  </button>
                ) : (
                  <div className="w-6 flex-shrink-0" />
                )}
                
                <button 
                  onClick={() => toggleComplete(task.id)} 
                  className="text-primary hover:scale-110 transition-transform flex-shrink-0 mt-0.5"
                >
                  {isCompleted ? <IconCheckCircle /> : <IconCircle />}
                </button>
                
                <div className="flex-1 flex flex-col min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span 
                      onClick={() => children.length > 0 && setIsExpanded(!isExpanded)}
                      className={`text-[14.5px] font-bold break-words cursor-pointer ${isCompleted ? 'line-through text-textMuted' : 'text-textMain'}`}
                    >
                      {task.title}
                    </span>

                    {progress !== null && (
                      <span className="text-[11px] bg-inputBg border border-glassBorder px-2 py-0.5 rounded-full text-textMain font-extrabold">
                        {completedChildrenCount}/{children.length} • {progress}%
                      </span>
                    )}

                    {!isCompleted && task.priority && task.priority !== 'normal' && (
                      <span className={`text-[10.5px] font-extrabold px-2 py-0.5 rounded-md ${
                        task.priority === 'urgent' 
                          ? 'bg-red-500/15 text-red-700 dark:text-red-400 border border-red-500/30' 
                          : task.priority === 'high'
                            ? 'bg-amber-500/15 text-amber-800 dark:text-amber-300 border border-amber-500/30'
                            : 'bg-inputBg text-textMuted'
                      }`}>
                        {priorityLabels[task.priority]}
                      </span>
                    )}
                  </div>
                  
                  {task.description && (
                    <p className="text-xs text-textMuted mt-1 whitespace-pre-line font-medium leading-relaxed">
                      {task.description}
                    </p>
                  )}
                  
                  {(task.subject || task.deadline || task.link || allChildrenDone) && (
                    <div className="flex gap-1.5 mt-1.5 text-[11px] text-textMuted items-center flex-wrap">
                      {task.subject && (
                        <span className="bg-inputBg px-2 py-0.5 rounded-md font-bold text-textMain">
                          {task.subject}
                        </span>
                      )}
                      {task.deadline && (
                        <span className={`flex items-center gap-1 px-2 py-0.5 rounded-md font-bold ${isOverdue ? 'bg-red-500/15 text-red-700 dark:text-red-400 border border-red-500/30' : 'bg-inputBg text-textMain'}`}>
                          <IconClock size={12} /> {dateStatusStr}
                        </span>
                      )}
                      {task.link && (
                        <a 
                          href={task.link.startsWith('http') ? task.link : `https://${task.link}`} 
                          target="_blank" 
                          rel="noreferrer"
                          onClick={e => e.stopPropagation()}
                          className="flex items-center gap-1 bg-primary/15 hover:bg-primary/25 text-textMain px-2 py-0.5 rounded-md font-bold transition-colors"
                        >
                          <IconLink /> Ссылка
                        </a>
                      )}
                      {allChildrenDone && (
                        <button
                          onClick={(e) => { e.stopPropagation(); toggleComplete(task.id); }}
                          className="bg-primary text-btnText px-2.5 py-0.5 rounded-md font-extrabold text-[11px] shadow-sm hover:opacity-90 transition-all"
                        >
                          ✨ Все шаги готовы — завершить?
                        </button>
                      )}
                    </div>
                  )}

                  {progress !== null && !isCompleted && (
                    <div className="w-full max-w-[220px] h-1.5 bg-inputBg rounded-full overflow-hidden mt-2">
                      <div className="h-full bg-primary transition-all duration-300 rounded-full" style={{ width: `${progress}%` }} />
                    </div>
                  )}
                </div>
              </div>

              {/* Быстрые действия */}
              <div className="flex items-center gap-1 mt-1.5 sm:mt-0 ml-8 sm:ml-0 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                <button 
                  onClick={() => setShowInlineSub(!showInlineSub)} 
                  className="flex items-center gap-1 px-2.5 py-1 bg-inputBg hover:bg-primary hover:text-btnText rounded-lg text-textMain transition-colors text-[11px] font-extrabold"
                  title="Быстро добавить подзадачу"
                >
                  <IconPlus size={13} /> Шаг
                </button>
                {!task.parentId && (
                  <button 
                    onClick={() => togglePin(task.id)} 
                    className={`p-1.5 rounded-lg transition-colors ${task.isPinned ? 'bg-primary text-btnText' : 'hover:bg-inputBg text-textMuted hover:text-textMain'}`} 
                    title={task.isPinned ? "Открепить" : "Закрепить наверху"}
                  >
                    <IconPin active={task.isPinned} />
                  </button>
                )}
                <button 
                  onClick={() => onOpenModal({ editTask: task })} 
                  className="p-1.5 hover:bg-inputBg rounded-lg text-textMuted hover:text-textMain transition-colors" 
                  title="Редактировать"
                >
                  <IconEdit />
                </button>
                <button 
                  onClick={() => deleteTask(task.id)} 
                  className="p-1.5 hover:bg-red-500/20 rounded-lg text-textMuted hover:text-red-600 transition-colors" 
                  title="Удалить"
                >
                  <IconTrash />
                </button>
              </div>
            </div>

            {/* Мгновенное поле добавления подзадачи прямо внутри карточки */}
            {showInlineSub && (
              <form onSubmit={handleInlineSubSubmit} className="mt-2.5 ml-8 flex items-center gap-1.5 bg-inputBg p-1.5 rounded-xl border border-glassBorder">
                <input 
                  value={inlineTitle}
                  onChange={e => setInlineTitle(e.target.value)}
                  autoFocus
                  placeholder="Название подзадачи (Enter — добавить)..."
                  className="flex-1 bg-transparent px-2 py-1 text-xs font-bold text-textMain placeholder-textMuted/70 outline-none"
                />
                <button type="submit" className="px-2.5 py-1 bg-primary text-btnText rounded-lg text-[11px] font-extrabold">
                  Добавить
                </button>
                <button 
                  type="button" 
                  onClick={() => { setShowInlineSub(false); onOpenModal({ parentId: task.id, date: task.deadline || '' }); }}
                  className="px-2 py-1 bg-surface text-textMuted hover:text-textMain rounded-lg text-[11px] font-bold"
                >
                  Расширенно
                </button>
                <button type="button" onClick={() => setShowInlineSub(false)} className="p-1 text-textMuted hover:text-textMain">
                  <IconClose />
                </button>
              </form>
            )}
          </div>

          {/* Дерево подзадач */}
          {isExpanded && children.length > 0 && (
            <div className="ml-4 sm:ml-6 pl-3 border-l-2 border-primary/30 flex flex-col gap-1.5 mt-1.5 mb-2">
              {children.map(child => (
                <TaskItem key={child.id} task={child} level={level + 1} onOpenModal={onOpenModal} />
              ))}
            </div>
          )}
        </div>
      );
    });

    // --- Модальный Мини-Календарь для выбора дедлайна ---
    const MiniDatePickerModal = ({ isOpen, selectedDate, onSelectDate, onClose }) => {
      const [pickerMonth, setPickerMonth] = useState(() => {
        const d = selectedDate ? new Date(selectedDate) : new Date();
        return new Date(d.getFullYear(), d.getMonth(), 1);
      });

      useEffect(() => {
        if (isOpen) {
          const d = selectedDate ? new Date(selectedDate) : new Date();
          setPickerMonth(new Date(d.getFullYear(), d.getMonth(), 1));
        }
      }, [isOpen, selectedDate]);

      if (!isOpen) return null;

      const daysInMonth = new Date(pickerMonth.getFullYear(), pickerMonth.getMonth() + 1, 0).getDate();
      let firstDay = new Date(pickerMonth.getFullYear(), pickerMonth.getMonth(), 1).getDay();
      firstDay = firstDay === 0 ? 6 : firstDay - 1;

      const prevMonth = (e) => { e.preventDefault(); setPickerMonth(new Date(pickerMonth.getFullYear(), pickerMonth.getMonth() - 1, 1)); };
      const nextMonth = (e) => { e.preventDefault(); setPickerMonth(new Date(pickerMonth.getFullYear(), pickerMonth.getMonth() + 1, 1)); };

      return (
        <div className="fixed inset-0 z-[260] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={onClose}>
          <div 
            className="bg-surface border-2 border-glassBorder p-5 rounded-3xl shadow-2xl w-full max-w-[330px] text-textMain"
            onClick={e => e.stopPropagation()}
          >
            <div className="flex justify-between items-center mb-3">
              <span className="font-extrabold text-base">Дата дедлайна</span>
              <button type="button" onClick={onClose} className="p-1.5 text-textMuted hover:text-textMain bg-inputBg rounded-xl"><IconClose /></button>
            </div>

            <div className="grid grid-cols-3 gap-1.5 mb-3">
              <button type="button" onClick={() => onSelectDate(getTodayStr())} className="py-1.5 px-2 rounded-xl bg-inputBg hover:bg-primary hover:text-btnText text-xs font-extrabold transition-colors">Сегодня</button>
              <button type="button" onClick={() => onSelectDate(getOffsetDateStr(1))} className="py-1.5 px-2 rounded-xl bg-inputBg hover:bg-primary hover:text-btnText text-xs font-extrabold transition-colors">Завтра</button>
              <button type="button" onClick={() => onSelectDate(getOffsetDateStr(7))} className="py-1.5 px-2 rounded-xl bg-inputBg hover:bg-primary hover:text-btnText text-xs font-extrabold transition-colors">+7 дней</button>
            </div>

            <div className="flex items-center justify-between mb-3 bg-inputBg p-2 rounded-xl border border-glassBorder">
              <button onClick={prevMonth} className="p-1 hover:bg-primary/20 rounded-lg text-textMuted hover:text-textMain"><IconChevronRight className="rotate-180" /></button>
              <span className="font-extrabold text-sm">{monthNames[pickerMonth.getMonth()]} {pickerMonth.getFullYear()}</span>
              <button onClick={nextMonth} className="p-1 hover:bg-primary/20 rounded-lg text-textMuted hover:text-textMain"><IconChevronRight /></button>
            </div>

            <div className="grid grid-cols-7 gap-1 text-center text-[10px] text-textMuted font-extrabold uppercase mb-1.5">
              <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div className="text-red-500">Сб</div><div className="text-red-500">Вс</div>
            </div>

            <div className="grid grid-cols-7 gap-1 mb-4">
              {Array.from({ length: firstDay }).map((_, i) => <div key={`empty-${i}`} />)}
              {Array.from({ length: daysInMonth }).map((_, i) => {
                const day = i + 1;
                const dateStr = `${pickerMonth.getFullYear()}-${String(pickerMonth.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isSelected = selectedDate === dateStr;
                const isToday = dateStr === getTodayStr();

                return (
                  <button
                    key={day} type="button" onClick={() => onSelectDate(dateStr)}
                    className={`h-9 w-9 text-xs rounded-xl flex items-center justify-center font-extrabold transition-all mx-auto ${
                      isSelected 
                        ? 'bg-primary text-btnText shadow-md scale-105' 
                        : isToday
                          ? 'border-2 border-primary text-primary hover:bg-primary/15'
                          : 'hover:bg-inputBg text-textMain'
                    }`}
                  >
                    {day}
                  </button>
                );
              })}
            </div>

            <button type="button" onClick={() => onSelectDate('')} className="text-textMuted font-extrabold hover:text-textMain py-2 bg-inputBg rounded-xl transition-colors text-xs w-full">
              Без дедлайна
            </button>
          </div>
        </div>
      );
    };

    // --- Палитра выбора цвета с сохранением своих оттенков ---
    const ColorPickerField = ({ value, onChange }) => {
      const [customColors, setCustomColors] = useState(() => {
        const saved = localStorage.getItem('studyflow-custom-colors');
        return saved ? JSON.parse(saved) : [];
      });

      const allColors = [...new Set([...defaultColors, ...customColors])].slice(-14); 

      const handleCustomAdd = (e) => {
        const newColor = e.target.value;
        onChange(newColor);
        if (!allColors.includes(newColor)) {
          const updated = [...customColors, newColor].slice(-8); 
          setCustomColors(updated);
          localStorage.setItem('studyflow-custom-colors', JSON.stringify(updated));
        }
      };

      return (
        <div className="flex flex-wrap items-center gap-2.5 mt-1.5">
          {allColors.map(c => (
            <button 
              key={c} type="button" onClick={() => onChange(c)}
              className={`w-7 h-7 rounded-full border-2 transition-transform shadow-sm ${value === c ? 'border-textMain scale-110 ring-2 ring-primary/40' : 'border-transparent hover:scale-110'}`}
              style={{ backgroundColor: c }}
            />
          ))}
          <label 
            title="Выбрать свой цвет (сохранится в список)"
            className="relative w-7 h-7 rounded-full border-2 border-dashed border-textMuted flex items-center justify-center overflow-hidden hover:border-textMain text-textMain cursor-pointer transition-colors bg-surface font-extrabold"
          >
            <span className="text-sm leading-none">+</span>
            <input type="color" className="opacity-0 absolute inset-0 w-full h-full cursor-pointer" onChange={handleCustomAdd} value={value || '#2d5225'} />
          </label>
        </div>
      );
    };

    // --- Модальное Окно Задачи ---
    const TaskModal = ({ isOpen, onClose, config }) => {
      const { tasks, saveTask, isDark } = useContext(TaskContext);
      const [showDatePicker, setShowDatePicker] = useState(false);
      
      const [formData, setFormData] = useState({
        id: null, title: '', subject: '', description: '', link: '', deadline: '', priority: 'normal', color: '', parentId: '', isPinned: false
      });

      useEffect(() => {
        if (isOpen) {
          const defaultColor = isDark ? '#9fc792' : '#2d5225';
          setShowDatePicker(false);
          if (config.editTask) {
            setFormData({ 
              ...config.editTask, 
              parentId: config.editTask.parentId || '',
              link: config.editTask.link || '',
              isPinned: Boolean(config.editTask.isPinned)
            });
          } else {
            setFormData({
              id: null, title: '', subject: '', description: '', link: '',
              deadline: config.date || '', priority: 'normal', color: defaultColor, parentId: config.parentId || '', isPinned: false
            });
          }
        }
      }, [isOpen, config, isDark]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title.trim()) return;
        saveTask({ ...formData, parentId: formData.parentId === '' ? null : formData.parentId });
        onClose();
      };

      const getDescendants = (taskId, allTasks) => {
        const children = allTasks.filter(t => t.parentId === taskId);
        return children.reduce((acc, child) => [...acc, child.id, ...getDescendants(child.id, allTasks)], []);
      };
      const descendants = formData.id ? getDescendants(formData.id, tasks) : [];
      const possibleParentsRaw = tasks.filter(t => t.id !== formData.id && !descendants.includes(t.id));
      
      const getPath = (task, allTasks, visited = new Set()) => {
        if (!task.parentId || visited.has(task.id)) return task.title;
        visited.add(task.id);
        const parent = allTasks.find(t => t.id === task.parentId);
        if (!parent) return task.title;
        return getPath(parent, allTasks, visited) + ' ➔ ' + task.title;
      };
      const possibleParents = possibleParentsRaw
        .map(p => ({ ...p, path: getPath(p, tasks) }))
        .sort((a, b) => a.path.localeCompare(b.path));

      // Подсказки уже используемых предметов
      const existingSubjects = [...new Set(tasks.map(t => t.subject).filter(Boolean))];

      return (
        <div className="fixed inset-0 z-[150] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/50 backdrop-blur-md" onClick={onClose}>
          <div 
            className="bento-card w-full sm:max-w-xl p-6 bg-surface shadow-2xl rounded-t-3xl sm:rounded-3xl pb-10 sm:pb-6 max-h-[92vh] overflow-y-auto no-scrollbar border-2 border-glassBorder text-textMain"
            onClick={e => e.stopPropagation()}
          >
            <div className="w-12 h-1.5 bg-primary/40 rounded-full mx-auto mb-5 sm:hidden"></div>
            
            <div className="flex justify-between items-center mb-5">
              <h2 className="text-xl font-extrabold tracking-tight text-textMain">
                {formData.id ? 'Редактировать задачу' : (formData.parentId ? 'Новая подзадача' : 'Новая задача')}
              </h2>
              <button type="button" onClick={onClose} className="p-2 rounded-xl text-textMuted hover:text-textMain bg-inputBg hover:bg-primary/20 transition-colors">
                <IconClose />
              </button>
            </div>
            
            <form onSubmit={handleSubmit} className="flex flex-col gap-3.5">
              <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2.5 focus-within:border-primary transition-colors">
                <label className="text-[10px] uppercase text-textMuted font-extrabold">Название задачи *</label>
                <input 
                  value={formData.title} 
                  onChange={e => setFormData({...formData, title: e.target.value})} 
                  required 
                  autoFocus 
                  className="w-full bg-transparent text-textMain placeholder-textMuted/60 outline-none font-bold text-base mt-0.5" 
                  placeholder="Что нужно сделать?" 
                />
              </div>
              
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2 focus-within:border-primary transition-colors">
                  <label className="text-[10px] uppercase text-textMuted font-extrabold">Предмет / Проект</label>
                  <input 
                    list="subject-suggestions"
                    value={formData.subject} 
                    onChange={e => setFormData({...formData, subject: e.target.value})} 
                    className="w-full bg-transparent text-textMain placeholder-textMuted/60 outline-none text-sm font-bold mt-0.5" 
                    placeholder="Математика, Работа..." 
                  />
                  <datalist id="subject-suggestions">
                    {existingSubjects.map(s => <option key={s} value={s} />)}
                  </datalist>
                </div>
                <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2 focus-within:border-primary transition-colors">
                  <label className="text-[10px] uppercase text-textMuted font-extrabold">Ссылка (по желанию)</label>
                  <input 
                    value={formData.link} 
                    onChange={e => setFormData({...formData, link: e.target.value})} 
                    className="w-full bg-transparent text-textMain placeholder-textMuted/60 outline-none text-sm font-bold mt-0.5" 
                    placeholder="https://..." 
                  />
                </div>
              </div>
              
              <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2 focus-within:border-primary transition-colors">
                <label className="text-[10px] uppercase text-textMuted font-extrabold">Описание и заметки</label>
                <textarea 
                  value={formData.description} 
                  onChange={e => setFormData({...formData, description: e.target.value})} 
                  rows="2" 
                  className="w-full bg-transparent text-textMain placeholder-textMuted/60 outline-none text-sm font-medium resize-none mt-0.5" 
                  placeholder="Детали, заметки или чек-лист..." 
                />
              </div>
              
              <div className="grid grid-cols-2 gap-3">
                <div 
                  onClick={() => setShowDatePicker(true)}
                  className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2.5 flex flex-col cursor-pointer hover:border-primary transition-colors"
                >
                  <label className="text-[10px] uppercase text-textMuted font-extrabold cursor-pointer">Дедлайн</label>
                  <div className="text-sm font-extrabold mt-1 flex items-center gap-1.5 text-textMain truncate">
                    <IconClock /> {formData.deadline ? getRelativeDateStr(formData.deadline) : 'Выбрать дату'}
                  </div>
                </div>

                <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2.5 flex flex-col">
                  <label className="text-[10px] uppercase text-textMuted font-extrabold">Приоритет</label>
                  <select 
                    value={formData.priority} 
                    onChange={e => setFormData({...formData, priority: e.target.value})} 
                    className="w-full bg-transparent text-textMain outline-none text-sm cursor-pointer mt-1 font-extrabold"
                  >
                    <option value="low" className="bg-surface text-textMain">Низкий</option>
                    <option value="normal" className="bg-surface text-textMain">Обычный</option>
                    <option value="high" className="bg-surface text-textMain">Высокий 🔥</option>
                    <option value="urgent" className="bg-surface text-textMain">Срочный 🔴</option>
                  </select>
                </div>
              </div>

              <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2.5 flex flex-col">
                <label className="text-[10px] uppercase text-textMuted font-extrabold">Вложить в (Сделать подзадачей)</label>
                <select 
                  value={formData.parentId} 
                  onChange={e => setFormData({...formData, parentId: e.target.value})} 
                  className="w-full bg-transparent text-textMain outline-none text-sm cursor-pointer mt-1 font-extrabold truncate"
                >
                  <option value="" className="bg-surface text-textMain">-</option>
                  {possibleParents.map(p => (
                    <option key={p.id} value={p.id} className="bg-surface text-textMain">{p.path}</option>
                  ))}
                </select>
              </div>

              <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2.5 flex flex-col">
                <label className="text-[10px] uppercase text-textMuted font-extrabold">Цвет метки</label>
                <ColorPickerField value={formData.color} onChange={(c) => setFormData({...formData, color: c})} />
              </div>
              
              <div className="flex justify-end gap-3 mt-3">
                <button type="button" onClick={onClose} className="px-5 py-2.5 text-textMain bg-inputBg hover:bg-primary/20 rounded-2xl transition-colors font-extrabold text-sm">
                  Отмена
                </button>
                <button type="submit" className="px-6 py-2.5 bg-primary hover:bg-primaryHover text-btnText font-extrabold rounded-2xl shadow-lg transition-all active:scale-95 text-sm">
                  Сохранить
                </button>
              </div>
            </form>
          </div>

          <MiniDatePickerModal 
            isOpen={showDatePicker} 
            selectedDate={formData.deadline} 
            onSelectDate={(date) => { setFormData({ ...formData, deadline: date }); setShowDatePicker(false); }} 
            onClose={() => setShowDatePicker(false)}
          />
        </div>
      );
    };

    // --- Модальное окно просмотра всех задач выбранного дня в Календаре ---
    const DayTasksModal = ({ isOpen, onClose, date, onOpenModal }) => {
      const { tasks } = useContext(TaskContext);
      if (!isOpen || !date) return null;

      const dayTasks = tasks.filter(t => t.deadline === date);
      const topLevelDayTasks = dayTasks.filter(t => !dayTasks.find(p => p.id === t.parentId));

      const d = new Date(date);
      const titleDate = `${d.getDate()} ${monthNames[d.getMonth()]}, ${dayNames[d.getDay()]}`;

      return (
        <div className="fixed inset-0 z-[140] flex items-center justify-center p-4 bg-black/50 backdrop-blur-md" onClick={onClose}>
          <div 
            className="bento-card w-full max-w-lg p-6 bg-surface shadow-2xl rounded-3xl max-h-[85vh] flex flex-col border-2 border-glassBorder text-textMain"
            onClick={e => e.stopPropagation()}
          >
            <div className="flex justify-between items-center pb-3 border-b border-glassBorder mb-4">
              <div>
                <span className="text-[11px] uppercase font-extrabold text-textMuted tracking-wider">План на день</span>
                <h3 className="text-xl font-extrabold text-textMain mt-0.5">{titleDate}</h3>
              </div>
              <button onClick={onClose} className="p-2 rounded-xl text-textMuted hover:text-textMain bg-inputBg hover:bg-primary/20 transition-colors"><IconClose /></button>
            </div>

            <div className="flex-1 overflow-y-auto no-scrollbar space-y-2 mb-5">
              {topLevelDayTasks.length === 0 ? (
                <div className="text-center py-10 text-textMuted text-sm font-bold bg-inputBg rounded-2xl border border-glassBorder">
                  На этот день задач пока нет. ✨
                </div>
              ) : (
                topLevelDayTasks.map(task => (
                  <TaskItem key={task.id} task={task} onOpenModal={(cfg) => { onClose(); onOpenModal(cfg); }} />
                ))
              )}
            </div>

            <button
              onClick={() => { onClose(); onOpenModal({ date }); }}
              className="w-full py-3 bg-primary hover:bg-primaryHover text-btnText rounded-2xl font-extrabold flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 text-sm"
            >
              <IconPlus /> Добавить задачу на этот день
            </button>
          </div>
        </div>
      );
    };

    // --- РАЗДЕЛ 1: ГЛАВНОЕ РАБОЧЕЕ ПРОСТРАНСТВО ---
    const Dashboard = ({ onOpenModal, searchInputRef }) => {
      const { tasks, saveTask, isSyncing, isDark, triggerExpandAll } = useContext(TaskContext);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterMode, setFilterMode] = useState('all'); // 'all' | 'today' | 'urgent'
      const [selectedSubject, setSelectedSubject] = useState('all');
      const [layoutMode, setLayoutMode] = useState('tree'); // 'tree' | 'board'
      const [quickTitle, setQuickTitle] = useState('');
      const [quickDateMode, setQuickDateMode] = useState('today'); // 'today' | 'tomorrow' | 'none'
      const todayStr = getTodayStr();
      
      const allRoot = useMemo(() => tasks.filter(t => !t.parentId), [tasks]);

      // Все уникальные предметы для быстрых вкладок-фильтров
      const subjectsList = useMemo(() => {
        const set = new Set();
        tasks.forEach(t => { if (t.subject && t.subject.trim()) set.add(t.subject.trim()); });
        return Array.from(set);
      }, [tasks]);
      
      // Прогресс за сегодня (только задачи сегодняшнего дня, если их нет или все выполнены -> 100% Можно играть в SIMS)
      const todayTasks = useMemo(() => tasks.filter(t => t.deadline === todayStr), [tasks, todayStr]);
      const todayCompleted = useMemo(() => todayTasks.filter(t => t.status === 'completed').length, [todayTasks]);
      
      let progressToday = 100;
      let isSimsReady = true;
      let subtitleText = 'На сегодня задач нет — все дела закрыты!';

      if (todayTasks.length > 0) {
        progressToday = Math.round((todayCompleted / todayTasks.length) * 100);
        isSimsReady = progressToday === 100;
        subtitleText = `Завершено ${todayCompleted} из ${todayTasks.length} задач на сегодня`;
      }

      const handleQuickAdd = (e) => {
        e.preventDefault();
        if (!quickTitle.trim()) return;
        const targetDeadline = quickDateMode === 'today' ? todayStr : (quickDateMode === 'tomorrow' ? getOffsetDateStr(1) : '');
        saveTask({
          title: quickTitle.trim(),
          subject: selectedSubject !== 'all' ? selectedSubject : '',
          description: '',
          link: '',
          deadline: targetDeadline,
          priority: 'normal',
          color: isDark ? '#9fc792' : '#2d5225',
          parentId: null
        });
        setQuickTitle('');
      };

      const activeRoot = useMemo(() => {
        return allRoot
          .filter(t => t.status === 'active')
          .filter(t => {
            if (selectedSubject !== 'all' && t.subject !== selectedSubject) return false;
            if (filterMode === 'today') return t.deadline === todayStr;
            if (filterMode === 'urgent') return t.priority === 'urgent' || t.priority === 'high';
            return true;
          })
          .filter(t => {
            if (!searchQuery.trim()) return true;
            const q = searchQuery.toLowerCase();
            return (t.title && t.title.toLowerCase().includes(q)) || 
                   (t.subject && t.subject.toLowerCase().includes(q)) ||
                   (t.description && t.description.toLowerCase().includes(q));
          })
          .slice()
          .sort((a, b) => {
            if (Boolean(a.isPinned) !== Boolean(b.isPinned)) return a.isPinned ? -1 : 1;
            const scoreA = priorityScore[a.priority || 'normal'] || 2;
            const scoreB = priorityScore[b.priority || 'normal'] || 2;
            if (scoreA !== scoreB) return scoreB - scoreA;
            const dateA = a.deadline || '9999-99-99';
            const dateB = b.deadline || '9999-99-99';
            return dateA.localeCompare(dateB);
          });
      }, [allRoot, filterMode, selectedSubject, searchQuery, todayStr]);

      const completedRoot = useMemo(() => {
        return allRoot
          .filter(t => t.status === 'completed')
          .filter(t => selectedSubject === 'all' || t.subject === selectedSubject);
      }, [allRoot, selectedSubject]);

      const overdueCount = useMemo(() => tasks.filter(t => t.status === 'active' && t.deadline && t.deadline < todayStr).length, [tasks, todayStr]);

      return (
        <div className=" pb-32 sm:pb-12 max-w-6xl mx-auto">
          {/* Верхний Bento-дашборд */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-5">
            <div className="lg:col-span-2 bento-card p-5 flex flex-col justify-between gap-4">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl sm:text-2xl font-extrabold text-textMain tracking-tight">Прогресс за сегодня</h1>
                    {isSimsReady && <IconPlumbob />}
                    {isSyncing && <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-inputBg text-textMuted flex items-center gap-1"><IconCloud /> Облако</span>}
                  </div>
                  <p className="text-xs sm:text-sm font-bold text-textMuted mt-0.5">{subtitleText}</p>
                </div>
                <span className="px-3.5 py-1.5 rounded-2xl bg-primary text-btnText font-extrabold text-xs sm:text-sm shadow-sm">
                  {isSimsReady ? '100% • Можно играть в SIMS 🎮' : `${progressToday}% выполнено`}
                </span>
              </div>

              <div className="w-full h-3.5 bg-inputBg rounded-full overflow-hidden border border-glassBorder p-0.5">
                <div 
                  style={{ width: `${progressToday}%` }} 
                  className="h-full bg-primary rounded-full relative overflow-hidden transition-all duration-500 shimmer-bar"
                />
              </div>
            </div>

            {/* Мини-сводка состояния */}
            <div className="bento-card p-4 grid grid-cols-3 gap-2 items-center text-center">
              <div className="bg-surface p-3 rounded-2xl border border-glassBorder">
                <span className="text-xl sm:text-2xl font-extrabold text-textMain block">{tasks.filter(t => t.status === 'active').length}</span>
                <span className="text-[11px] font-bold text-textMuted">Активных</span>
              </div>
              <div className={`p-3 rounded-2xl border ${overdueCount > 0 ? 'bg-red-500/15 border-red-500/30 text-red-700 dark:text-red-400' : 'bg-surface border-glassBorder text-textMain'}`}>
                <span className="text-xl sm:text-2xl font-extrabold block">{overdueCount}</span>
                <span className="text-[11px] font-bold opacity-80">Просрочено</span>
              </div>
              <div className="bg-surface p-3 rounded-2xl border border-glassBorder">
                <span className="text-xl sm:text-2xl font-extrabold text-primary block">{tasks.filter(t => t.status === 'completed').length}</span>
                <span className="text-[11px] font-bold text-textMuted">Готово</span>
              </div>
            </div>
          </div>

          {/* Панель быстрого ввода задачи */}
          <form onSubmit={handleQuickAdd} className="bento-card p-2 mb-5 flex flex-wrap sm:flex-nowrap items-center gap-2">
            <input 
              value={quickTitle}
              onChange={e => setQuickTitle(e.target.value)}
              placeholder="Быстро добавить задачу (нажмите Enter)..."
              className="flex-1 min-w-[200px] bg-transparent px-3 py-2 text-sm font-bold text-textMain placeholder-textMuted/70 outline-none"
            />
            <div className="flex items-center gap-1 bg-inputBg p-1 rounded-xl border border-glassBorder text-[11px] font-extrabold">
              <button type="button" onClick={() => setQuickDateMode('today')} className={`px-2.5 py-1 rounded-lg transition-colors ${quickDateMode === 'today' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Сегодня</button>
              <button type="button" onClick={() => setQuickDateMode('tomorrow')} className={`px-2.5 py-1 rounded-lg transition-colors ${quickDateMode === 'tomorrow' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Завтра</button>
              <button type="button" onClick={() => setQuickDateMode('none')} className={`px-2.5 py-1 rounded-lg transition-colors ${quickDateMode === 'none' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Без даты</button>
            </div>
            <button 
              type="submit" 
              className="px-4 py-2 bg-inputBg hover:bg-primary hover:text-btnText text-textMain rounded-xl text-xs font-extrabold transition-colors shrink-0"
            >
              Добавить
            </button>
            <button 
              type="button"
              onClick={() => onOpenModal({})} 
              className="px-4 py-2 bg-primary hover:bg-primaryHover text-btnText rounded-xl text-xs font-extrabold transition-colors shadow-sm shrink-0 flex items-center gap-1"
            >
              <IconPlus size={14} /> Подробно
            </button>
          </form>

          {/* Быстрые вкладки по предметам/проектам */}
          {subjectsList.length > 0 && (
            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar mb-4 pb-1">
              <button 
                onClick={() => setSelectedSubject('all')}
                className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap transition-all ${selectedSubject === 'all' ? 'bg-primary text-btnText shadow-sm' : 'bg-surface/80 text-textMuted hover:text-textMain border border-glassBorder'}`}
              >
                Все категории
              </button>
              {subjectsList.map(subj => (
                <button 
                  key={subj}
                  onClick={() => setSelectedSubject(subj)}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold whitespace-nowrap transition-all ${selectedSubject === subj ? 'bg-primary text-btnText shadow-sm' : 'bg-surface/80 text-textMuted hover:text-textMain border border-glassBorder'}`}
                >
                  {subj}
                </button>
              ))}
            </div>
          )}

          {/* Основной контейнер задач */}
          <div className="bento-card p-3 sm:p-5 mb-6">
            <div className="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-3 pb-3.5 mb-4 border-b border-glassBorder">
              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center gap-1 bg-inputBg p-1 rounded-xl border border-glassBorder">
                  <button onClick={() => setFilterMode('all')} className={`px-3 py-1.5 rounded-lg text-xs font-extrabold transition-colors ${filterMode === 'all' ? 'bg-primary text-btnText shadow-sm' : 'text-textMuted hover:text-textMain'}`}>Все ({activeRoot.length})</button>
                  <button onClick={() => setFilterMode('today')} className={`px-3 py-1.5 rounded-lg text-xs font-extrabold transition-colors ${filterMode === 'today' ? 'bg-primary text-btnText shadow-sm' : 'text-textMuted hover:text-textMain'}`}>Сегодня</button>
                  <button onClick={() => setFilterMode('urgent')} className={`px-3 py-1.5 rounded-lg text-xs font-extrabold transition-colors ${filterMode === 'urgent' ? 'bg-primary text-btnText shadow-sm' : 'text-textMuted hover:text-textMain'}`}>Срочные 🔥</button>
                </div>

                {/* Переключатель Дерево / Доска */}
                <div className="flex items-center gap-1 bg-inputBg p-1 rounded-xl border border-glassBorder">
                  <button onClick={() => setLayoutMode('tree')} className={`px-2.5 py-1.5 rounded-lg text-xs font-extrabold transition-colors ${layoutMode === 'tree' ? 'bg-surface text-textMain shadow-sm' : 'text-textMuted hover:text-textMain'}`}>Дерево</button>
                  <button onClick={() => setLayoutMode('board')} className={`px-2.5 py-1.5 rounded-lg text-xs font-extrabold transition-colors ${layoutMode === 'board' ? 'bg-surface text-textMain shadow-sm' : 'text-textMuted hover:text-textMain'}`}>Канбан</button>
                </div>

                {layoutMode === 'tree' && (
                  <div className="hidden sm:flex items-center gap-1 text-[11px] font-bold text-textMuted">
                    <button onClick={() => triggerExpandAll(true)} className="px-2 py-1 hover:text-textMain hover:bg-inputBg rounded-lg">Развернуть все</button>
                    <span>•</span>
                    <button onClick={() => triggerExpandAll(false)} className="px-2 py-1 hover:text-textMain hover:bg-inputBg rounded-lg">Свернуть все</button>
                  </div>
                )}
              </div>

              <div className="relative flex-1 md:max-w-xs">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-textMuted"><IconSearch /></span>
                <input 
                  ref={searchInputRef}
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Поиск (нажмите /)..."
                  className="w-full bg-inputBg border border-glassBorder rounded-xl pl-9 pr-3 py-1.5 text-xs font-bold text-textMain placeholder-textMuted/70 outline-none focus:border-primary"
                />
              </div>
            </div>
            
            {layoutMode === 'tree' ? (
              <div className="space-y-1.5">
                {activeRoot.length === 0 ? (
                  <div className="text-center text-textMuted py-12 font-bold">
                    {searchQuery ? 'Ничего не найдено.' : 'Все задачи в этой категории выполнены! ✨'}
                  </div>
                ) : (
                  activeRoot.map(task => <TaskItem key={task.id} task={task} onOpenModal={onOpenModal} />)
                )}
              </div>
            ) : (
              /* Канбан-доска по срокам */
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {[
                  { title: 'Горит / Сегодня 🎯', list: activeRoot.filter(t => (t.deadline && t.deadline <= todayStr) || t.priority === 'urgent') },
                  { title: 'Запланировано 📅', list: activeRoot.filter(t => t.deadline && t.deadline > todayStr && t.priority !== 'urgent') },
                  { title: 'Без дедлайна 🌿', list: activeRoot.filter(t => !t.deadline && t.priority !== 'urgent') }
                ].map((col, idx) => (
                  <div key={idx} className="bg-inputBg/60 p-3 rounded-2xl border border-glassBorder flex flex-col gap-2">
                    <div className="flex justify-between items-center px-1 pb-1 border-b border-glassBorder">
                      <span className="text-xs font-extrabold text-textMain">{col.title}</span>
                      <span className="text-[11px] font-extrabold bg-surface px-2 py-0.5 rounded-full">{col.list.length}</span>
                    </div>
                    <div className="space-y-2">
                      {col.list.length === 0 ? (
                        <p className="text-center text-xs text-textMuted py-6 font-bold">Пусто</p>
                      ) : (
                        col.list.map(task => <TaskItem key={task.id} task={task} onOpenModal={onOpenModal} />)
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Выполненные задачи */}
          {completedRoot.length > 0 && (
            <div className="bento-card p-4 opacity-85 hover:opacity-100 transition-opacity">
              <h3 className="text-xs font-extrabold text-textMuted uppercase tracking-wider mb-2.5 pl-1">
                Выполненные ({completedRoot.length}) — нажмите на галочку, чтобы вернуть в активные
              </h3>
              <div className="flex flex-col gap-1.5">
                {completedRoot.map(task => <TaskItem key={task.id} task={task} onOpenModal={onOpenModal} />)}
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- РАЗДЕЛ 2: ДЕДЛАЙНЫ ---
    const DeadlinesView = ({ onOpenModal }) => {
      const { tasks } = useContext(TaskContext);
      const todayStr = getTodayStr();
      const tomorrowStr = getOffsetDateStr(1);
      const nextWeekStr = getOffsetDateStr(7);

      const activeTasks = useMemo(() => {
        return tasks
          .filter(t => t.status === 'active')
          .sort((a, b) => {
            const scoreA = priorityScore[a.priority || 'normal'] || 2;
            const scoreB = priorityScore[b.priority || 'normal'] || 2;
            if (scoreA !== scoreB) return scoreB - scoreA;
            return (a.deadline || '9999-99-99').localeCompare(b.deadline || '9999-99-99');
          });
      }, [tasks]);

      const groups = [
        { title: 'Просрочено ⚠️', items: activeTasks.filter(t => t.deadline && t.deadline < todayStr) },
        { title: 'Сегодня 🎯', items: activeTasks.filter(t => t.deadline === todayStr) },
        { title: 'Завтра ☀️', items: activeTasks.filter(t => t.deadline === tomorrowStr) },
        { title: 'Ближайшие 7 дней 📅', items: activeTasks.filter(t => t.deadline && t.deadline > tomorrowStr && t.deadline <= nextWeekStr) },
        { title: 'Позже 🌿', items: activeTasks.filter(t => t.deadline && t.deadline > nextWeekStr) },
        { title: 'Без дедлайна ♾️', items: activeTasks.filter(t => !t.deadline && !t.parentId) }
      ];

      return (
        <div className="pb-32 sm:pb-12 max-w-5xl mx-auto">
          <div className="flex justify-between items-center mb-6">
            <div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-textMain">Таймлайн дедлайнов</h1>
              <p className="text-sm font-bold text-textMuted">Все активные задачи и подзадачи по дате сдачи</p>
            </div>
            <button onClick={() => onOpenModal({})} className="bg-primary hover:bg-primaryHover text-btnText px-4 py-2.5 rounded-2xl text-xs font-extrabold shadow-md flex items-center gap-1.5">
              <IconPlus /> Новая задача
            </button>
          </div>

          <div className="space-y-4">
            {groups.map((g, idx) => g.items.length > 0 && (
              <div key={idx} className="bento-card p-4">
                <h3 className="text-xs font-extrabold text-textMain uppercase tracking-wider mb-3 pb-2 border-b border-glassBorder flex justify-between">
                  <span>{g.title}</span>
                  <span className="bg-inputBg px-2.5 py-0.5 rounded-full text-xs">{g.items.length}</span>
                </h3>
                <div className="space-y-1.5">
                  {g.items.map(task => <TaskItem key={task.id} task={task} onOpenModal={onOpenModal} />)}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // --- РАЗДЕЛ 3: КАЛЕНДАРЬ (МЕСЯЦ И НЕДЕЛЯ С ПРОГРЕССОМ И ПОДЗАДАЧАМИ) ---
    const CalendarView = ({ onOpenModal }) => {
      const { tasks } = useContext(TaskContext);
      const [viewMode, setViewMode] = useState('month'); 
      const [currentMonth, setCurrentMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
      const [currentWeek, setCurrentWeek] = useState(() => getStartOfWeek(new Date()));
      const [viewDayDate, setViewDayDate] = useState(null);

      const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
      let firstDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();
      firstDay = firstDay === 0 ? 6 : firstDay - 1;
      
      const nextMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1));
      const prevMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1));
      
      const nextWeek = () => { const d = new Date(currentWeek); d.setDate(d.getDate() + 7); setCurrentWeek(d); };
      const prevWeek = () => { const d = new Date(currentWeek); d.setDate(d.getDate() - 7); setCurrentWeek(d); };
      
      const weekDays = Array.from({length: 7}).map((_, i) => {
        const d = new Date(currentWeek); d.setDate(d.getDate() + i);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      });

      const getTasksForDate = (dateStr) => {
        return tasks.filter(t => {
          if (t.deadline !== dateStr) return false;
          if (t.parentId) {
            const parent = tasks.find(p => p.id === t.parentId);
            if (parent && parent.deadline === dateStr) return false; 
          }
          return true;
        });
      };

      const weekTasksAll = tasks.filter(t => weekDays.includes(t.deadline));
      const weekProgress = weekTasksAll.length > 0 
        ? Math.round((weekTasksAll.filter(t => t.status === 'completed').length / weekTasksAll.length) * 100) 
        : 100;

      const titleMonth = `${monthNames[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;
      const titleWeek = `${new Date(weekDays[0]).getDate()} ${monthNames[new Date(weekDays[0]).getMonth()]} — ${new Date(weekDays[6]).getDate()} ${monthNames[new Date(weekDays[6]).getMonth()]}`;

      return (
        <div className="pb-32 sm:pb-10 h-full flex flex-col max-w-6xl mx-auto">
          <header className="mb-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div className="flex items-center justify-between w-full sm:w-auto gap-4">
              <h1 className="text-2xl font-extrabold text-textMain">Календарь</h1>
              <div className="flex bg-surface p-1 rounded-2xl border border-glassBorder shadow-sm">
                <button onClick={() => setViewMode('month')} className={`px-4 py-1.5 text-xs font-extrabold rounded-xl transition-colors ${viewMode === 'month' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Месяц</button>
                <button onClick={() => setViewMode('week')} className={`px-4 py-1.5 text-xs font-extrabold rounded-xl transition-colors ${viewMode === 'week' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Неделя</button>
              </div>
            </div>
            
            <div className="flex items-center gap-2 bg-surface p-1.5 rounded-2xl border border-glassBorder shadow-sm w-full sm:w-auto justify-between sm:justify-start">
              <button onClick={viewMode === 'month' ? prevMonth : prevWeek} className="p-2 rounded-xl hover:bg-primary/20 transition-colors text-textMain"><IconChevronRight className="rotate-180" /></button>
              <span className="font-extrabold text-sm text-center text-textMain px-2 whitespace-nowrap">{viewMode === 'month' ? titleMonth : titleWeek}</span>
