      const { tasks, syncToFirebase, isDark, setIsDark, soundEnabled, setSoundEnabled, addToast } = useContext(TaskContext);
      const fileInputRef = useRef(null);

      const handleExport = () => {
        const dataStr = JSON.stringify(tasks, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `studyflow-backup-${getTodayStr()}.json`;
        a.click();
        addToast('Резервная копия скачана');
      };

      const handleImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            if (Array.isArray(imported)) {
              syncToFirebase(imported);
              addToast('База задач успешно импортирована!');
            }
          } catch (err) {
            addToast('Ошибка чтения JSON файла', 'error');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="animate-fade-in pb-32 sm:pb-10 max-w-2xl mx-auto space-y-4">
          <h1 className="text-2xl sm:text-3xl font-extrabold text-textMain mb-6">Настройки</h1>
          
          <div className="glass-panel p-6 bg-surface/80 border border-glassBorder flex items-center justify-between">
            <div>
              <h3 className="font-extrabold text-textMain text-base">Тема оформления</h3>
              <p className="text-textMuted text-xs font-bold mt-1">Салатовая Matcha (светлая) или Deep Forest (тёмная)</p>
            </div>
            <button 
              onClick={() => setIsDark(!isDark)} 
              className="px-4 py-3 bg-inputBg rounded-2xl border border-glassBorder shadow-sm hover:border-primary transition-colors text-textMain flex items-center gap-2 font-extrabold text-xs"
            >
              {isDark ? <><IconSun /> Светлая</> : <><IconMoon /> Тёмная</>}
            </button>
          </div>

          <div className="glass-panel p-6 bg-surface/80 border border-glassBorder flex items-center justify-between">
            <div>
              <h3 className="font-extrabold text-textMain text-base">Звуковой отклик</h3>
              <p className="text-textMuted text-xs font-bold mt-1">Приятный аккорд при выполнении задачи и окончании таймера</p>
            </div>
            <button 
              onClick={() => setSoundEnabled(!soundEnabled)} 
              className={`px-4 py-2.5 rounded-2xl font-extrabold text-xs transition-colors ${soundEnabled ? 'bg-primary text-btnText' : 'bg-inputBg text-textMuted'}`}
            >
              {soundEnabled ? 'Включён 🔔' : 'Выключен 🔕'}
            </button>
          </div>

          <div className="glass-panel p-6 bg-surface/80 border border-glassBorder space-y-4">
            <div>
              <h3 className="font-extrabold text-textMain text-base">Резервное копирование и Облако</h3>
              <p className="text-textMuted text-xs font-bold mt-1">Все задачи автоматически синхронизируются с вашей базой Firebase. Вы также можете сохранить копию в файл.</p>
            </div>
            <div className="flex flex-wrap gap-3">
              <button onClick={handleExport} className="px-4 py-2.5 bg-primary text-btnText rounded-2xl font-extrabold text-xs shadow-md hover:bg-primaryHover transition-colors">
                Экспорт в JSON
              </button>
              <button onClick={() => fileInputRef.current?.click()} className="px-4 py-2.5 bg-inputBg text-textMain border border-glassBorder rounded-2xl font-extrabold text-xs hover:bg-primary/20 transition-colors">
                Импорт из JSON
              </button>
              <input ref={fileInputRef} type="file" accept=".json" className="hidden" onChange={handleImport} />
            </div>
          </div>
        </div>
      );
    };

    // --- ГЛАВНЫЙ КАРКАС ПРИЛОЖЕНИЯ ---
    const App = () => {
      const [currentView, setCurrentView] = useState('dashboard');
      const [modalConfig, setModalConfig] = useState(null); 
      
      const navItems = [
        { id: 'dashboard', icon: IconHome, label: 'Главная' }, 
        { id: 'deadlines', icon: () => <IconClock size={20} />, label: 'Дедлайны' },
        { id: 'calendar', icon: IconCalendar, label: 'Календарь' }, 
        { id: 'focus', icon: IconTarget, label: 'Фокус' },
        { id: 'settings', icon: IconSettings, label: 'Настройки' }
      ];

      return (
        <div className="flex h-screen w-full relative">
          {/* Боковая панель для компьютера */}
          <aside className="hidden md:flex w-64 h-full border-r border-glassBorder bg-surface/85 backdrop-blur-2xl flex-col p-6 z-10 shadow-xl">
            <div className="flex items-center gap-3 mb-10 text-textMain cursor-pointer" onClick={() => setCurrentView('dashboard')}>
              <div className="w-10 h-10 rounded-2xl bg-primary flex items-center justify-center shadow-lg"><span className="font-extrabold text-xl text-btnText">S</span></div>
              <div>
                <span className="text-xl font-extrabold tracking-tight block leading-none">StudyFlow</span>
                <span className="text-[10px] font-bold text-textMuted uppercase tracking-widest">Cloud Planner</span>
              </div>
            </div>
            <nav className="flex flex-col gap-2 flex-1">
              {navItems.map(item => (
                <button 
                  key={item.id} 
                  onClick={() => setCurrentView(item.id)} 
                  className={`flex items-center gap-3 px-4 py-3.5 rounded-2xl transition-all w-full text-left font-extrabold text-sm ${currentView === item.id ? 'bg-primary text-btnText shadow-md' : 'text-textMuted hover:bg-primary/15 hover:text-textMain'}`}
                >
                  <item.icon /> <span>{item.label}</span>
                </button>
              ))}
            </nav>
            <button 
              onClick={() => setModalConfig({})}
              className="w-full py-3.5 bg-primary hover:bg-primaryHover text-btnText rounded-2xl font-extrabold text-sm shadow-lg flex items-center justify-center gap-2 transition-transform active:scale-95"
            >
              <IconPlus /> Новая задача
            </button>
          </aside>

          {/* Нижняя навигация для телефона */}
          <nav className="md:hidden fixed bottom-0 left-0 w-full bg-surface/95 backdrop-blur-2xl border-t border-glassBorder flex justify-around items-center p-1.5 z-[90] shadow-2xl">
            {navItems.map(item => (
              <button 
                key={item.id} 
                onClick={() => setCurrentView(item.id)} 
                className={`flex flex-col items-center gap-1 py-2 px-3 rounded-2xl transition-all ${currentView === item.id ? 'bg-primary text-btnText font-extrabold' : 'text-textMuted font-bold'}`}
              >
                <item.icon /> <span className="text-[10px]">{item.label}</span>
              </button>
            ))}
          </nav>

          {/* Рабочая область */}
          <main className="flex-1 h-full overflow-y-auto p-4 sm:p-8 relative no-scrollbar">
            {currentView === 'dashboard' && <Dashboard onOpenModal={setModalConfig} />}
            {currentView === 'deadlines' && <DeadlinesView onOpenModal={setModalConfig} />}
            {currentView === 'calendar' && <CalendarView onOpenModal={setModalConfig} />}
            {currentView === 'focus' && <FocusView onOpenModal={setModalConfig} />}
            {currentView === 'settings' && <SettingsView />}
          </main>
          
          <TaskModal isOpen={Boolean(modalConfig)} onClose={() => setModalConfig(null)} config={modalConfig || {}} />
        </div>
      );
    };

    const Root = () => <AppProvider><App /></AppProvider>;
    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
