<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StudyFlow - Premium Planner</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { 
            background: 'var(--bg-color)', 
            surface: 'var(--surface-color)', 
            primary: 'var(--primary-color)', 
            primaryHover: 'var(--primary-hover)',
            accent: '#e9c46a',
            glass: 'var(--glass-bg)',
            glassBorder: 'var(--glass-border)',
            textMain: 'var(--text-main)',
            textMuted: 'var(--text-muted)'
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --bg-color: #f1f3f1; --surface-color: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.7); --glass-border: rgba(255, 255, 255, 0.5);
      --text-main: #1f2937; --text-muted: #6b7280;
      --primary-color: #3e6034; --primary-hover: #2d4526;
    }

    .dark {
      --bg-color: #0d0f0d; --surface-color: #161916;
      --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6; --text-muted: #9ca3af;
      --primary-color: #9fc792; --primary-hover: #8ab07d;
    }

    body {
      background-color: var(--bg-color); color: var(--text-main);
      margin: 0; overflow: hidden; transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    .glass-panel {
      background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 1.25rem;
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    ::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
    .dark ::-webkit-calendar-picker-indicator { filter: invert(1); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <!-- Firebase SDK (Compat версии) -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useRef } = React;
    const { motion, AnimatePresence } = window.Motion;

    // ==========================================
    // 🛠️ НАСТРОЙКИ FIREBASE (ЗАМЕНИ НА СВОИ!)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDz5wPBB05uU0q1vlQlgyGWmnyVwt3APk0",
      authDomain: "ourwishlist-b6bd7.firebaseapp.com",
      databaseURL: "https://ourwishlist-b6bd7-default-rtdb.firebaseio.com",
      projectId: "ourwishlist-b6bd7",
      storageBucket: "ourwishlist-b6bd7.firebasestorage.app",
      messagingSenderId: "170914082679",
      appId: "1:170914082679:web:2bc01fc83713a230fe3b72",
      measurementId: "G-LTX7TDL8KP"
    };

    // Проверяем, ввёл ли пользователь свои ключи
    const isFirebaseConfigured = firebaseConfig.apiKey !== "API_KEY";
    
    if (isFirebaseConfigured && !firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    
    const db = isFirebaseConfigured ? firebase.firestore() : null;

    // --- Утилиты ---
    const getTodayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const getRelativeDateStr = (dateStr) => {
      if (!dateStr) return '';
      const today = new Date(getTodayStr()); const target = new Date(dateStr);
      const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return 'Сегодня';
      if (diffDays === 1) return 'Завтра';
      if (diffDays === -1) return 'Вчера (Просрочено)';
      return target.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    };
    const getStartOfWeek = (date) => {
      const d = new Date(date); const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
      return new Date(d.setDate(diff));
    };

    const priorityScore = { urgent: 4, high: 3, normal: 2, low: 1 };
    const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    const dayNames = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

    // --- Иконки ---
    const IconHome = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const IconCalendar = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const IconSettings = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    const IconPlus = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const IconSun = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
    const IconChevronRight = ({ className="" }) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>;
    const IconCircle = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/></svg>;
    const IconCheckCircle = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconEdit = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
    const IconTrash = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    const IconCloud = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>;

    // --- Стейт Менеджмент (УБРАН ЛОКАЛЬНЫЙ FALLBACK, ТОЛЬКО FIREBASE) ---
    const TaskContext = createContext();

    const AppProvider = ({ children }) => {
      const [tasks, setTasks] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [toasts, setToasts] = useState([]);
      const [isDark, setIsDark] = useState(() => localStorage.getItem('studyflow-theme') === 'dark');

      // 1. ПОДПИСКА НА FIREBASE В РЕАЛЬНОМ ВРЕМЕНИ
      useEffect(() => {
        if (!db) {
          setIsLoading(false); // Firebase не настроен, но загрузка "завершена" (задач 0)
          return;
        }

        const unsubscribe = db.collection('tasks').onSnapshot(snapshot => {
          const fetchedTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setTasks(fetchedTasks);
          setIsLoading(false);
        }, err => {
          console.error("Firebase error:", err);
          addToast('Ошибка загрузки Firebase. Сохранение отключено.', 'error');
          setIsLoading(false);
        });

        // Отписка при размонтировании
        return unsubscribe;
      }, []);

      // 2. Тема
      useEffect(() => {
        localStorage.setItem('studyflow-theme', isDark ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', isDark);
      }, [isDark]);

      const addToast = (message, type = 'success') => {
        const id = Math.random().toString(36).substr(2, 9);
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };

      // 3. CRUD (ТОЛЬКО ЧЕРЕЗ FIREBASE)
      const toggleComplete = (id) => {
        if (!db) return;
        const task = tasks.find(t => t.id === id);
        if (!task) return;
        db.collection('tasks').doc(id).update({ status: task.status === 'completed' ? 'active' : 'completed' });
      };

      const saveTask = (task) => {
        if (!db) {
          addToast('Firebase не настроен. Сохранение невозможно.', 'error');
          return;
        }
        if (task.id) {
          db.collection('tasks').doc(task.id).update(task);
          addToast('Изменения сохранены');
        } else {
          db.collection('tasks').add({ ...task, createdAt: getTodayStr(), status: 'active' });
          addToast('Задача добавлена');
        }
      };

      const deleteTask = (id) => {
        if (!db) return;
        // Рекурсивно удаляем детей
        const getChildrenIds = (parentId, allTasks) => {
          const children = allTasks.filter(t => t.parentId === parentId);
          return children.reduce((acc, child) => [...acc, child.id, ...getChildrenIds(child.id, allTasks)], []);
        };
        const idsToRemove = [id, ...getChildrenIds(id, tasks)];
        idsToRemove.forEach(tid => db.collection('tasks').doc(tid).delete());
        addToast('Удалено', 'error');
      };

      return (
        <TaskContext.Provider value={{ tasks, setTasks, toggleComplete, saveTask, deleteTask, isDark, setIsDark, isLoading, toasts }}>
          {children}
        </TaskContext.Provider>
      );
    };

    // --- Скелет ---
    const Header = ({ title }) => {
      const today = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
      return (
        <header className="mb-6 flex items-center justify-between">
          <div><h1 className="text-3xl font-bold text-textMain capitalize">{today}</h1><p className="text-textMuted">{title}</p></div>
          <IconCloud className={isFirebaseConfigured ? "text-primary" : "text-textMuted"} />
        </header>
      );
    };

    const TaskModal = ({ isOpen, onClose, config }) => {
      const { tasks, saveTask } = useContext(TaskContext);
      const [formData, setFormData] = useState({ id: null, title: '', subject: '', description: '', deadline: '', priority: 'normal', color: '', parentId: '' });

      useEffect(() => {
        if (isOpen) {
          setFormData(config ? { ...config, parentId: config.parentId || '' } : { id: null, title: '', subject: '', description: '', deadline: '', priority: 'normal', color: '', parentId: '' });
        }
      }, [isOpen, config]);

      if (!isOpen) return null;
      const handleSubmit = (e) => { e.preventDefault(); saveTask(formData); onClose(); };

      const parents = tasks.filter(t => t.id !== formData.id && t.parentId === null);

      return (
        <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
          <motion.div initial={{ scale: 0.9 }} animate={{ scale: 1 }} className="glass-panel w-full max-w-lg p-6 bg-surface shadow-xl">
            <div className="flex justify-between items-center mb-6 border-b pb-4 border-glassBorder"><h2 className="text-xl font-bold text-textMain">{formData.id ? 'Редактировать' : 'Новое задание'}</h2><button onClick={onClose} className="p-1 rounded-full text-textMuted hover:bg-glassBorder">✕</button></div>
            <form onSubmit={handleSubmit} className="flex flex-col gap-4">
              <input value={formData.title} onChange={e=>setFormData({...formData, title: e.target.value})} required className="w-full bg-surface border border-glassBorder rounded-xl px-4 py-2.5 text-textMain outline-none focus:border-primary" placeholder="Название (например: Глава 3)" />
              <input value={formData.subject} onChange={e=>setFormData({...formData, subject: e.target.value})} className="w-full bg-surface border border-glassBorder rounded-xl px-4 py-2 text-textMain outline-none focus:border-primary" placeholder="Предмет" />
              <textarea value={formData.description} onChange={e=>setFormData({...formData, description: e.target.value})} className="w-full bg-surface border border-glassBorder rounded-xl px-4 py-2 text-textMain outline-none focus:border-primary h-20" placeholder="Краткое описание" />
              <input type="date" value={formData.deadline} onChange={e=>setFormData({...formData, deadline: e.target.value})} className="w-full bg-surface border border-glassBorder rounded-xl px-4 py-2 text-textMuted outline-none" />
              <div className="grid grid-cols-2 gap-4">
                <select value={formData.priority} onChange={e=>setFormData({...formData, priority: e.target.value})} className="w-full bg-surface border border-glassBorder rounded-xl px-4 py-2 text-textMuted outline-none capitalize">
                  {['low', 'normal', 'high', 'urgent'].map(p=><option key={p} value={p}>{p}</option>)}
                </select>
                <input type="color" value={formData.color} onChange={e=>setFormData({...formData, color: e.target.value})} className="h-10 w-full bg-surface cursor-pointer rounded-xl border border-glassBorder" />
              </div>
              <select value={formData.parentId} onChange={e=>setFormData({...formData, parentId: e.target.value})} className="w-full bg-surface border border-glassBorder rounded-xl px-4 py-2 text-textMuted outline-none">
                <option value="">Без родителя</option>
                {parents.map(p=><option key={p.id} value={p.id}>{p.title}</option>)}
              </select>
              <button type="submit" className="px-6 py-2.5 bg-primary hover:bg-primaryHover text-white font-semibold rounded-xl mt-4 active:scale-95 transition-all">Сохранить</button>
            </form>
          </motion.div>
        </motion.div>
      );
    }

    const TaskItem = ({ task }) => {
      const { tasks, toggleComplete, deleteTask } = useContext(TaskContext);
      const [showSubtasks, setShowSubtasks] = useState(false);
      const [modalConfig, setModalConfig] = useState(null); 
      
      const children = tasks.filter(t => t.parentId === task.id);
      const relativeDate = getRelativeDateStr(task.deadline);
      const isOverdue = task.deadline && task.deadline < getTodayStr() && task.status !== 'completed';
      
      const subtaskCompleted = children.filter(c => c.status === 'completed').length;
      const subtaskProgress = children.length > 0 ? Math.round((subtaskCompleted / children.length) * 100) : 0;

      return (
        <div className="bg-surface rounded-2xl p-4 border border-glassBorder mb-3 shadow-sm hover:border-primary/30 group">
          <div className="flex items-start gap-3">
            <button onClick={() => setShowSubtasks(!showSubtasks)} className="p-1 mt-1 rounded-md text-textMuted hover:bg-glassBorder">
              {children.length > 0 && <IconChevronRight className={`transition-transform ${showSubtasks ? 'rotate-90' : ''}`} />}
            </button>
            <button onClick={() => toggleComplete(task.id)} className="text-primary hover:scale-110 active:scale-90 p-0.5 transition-all">
              {task.status === 'completed' ? <IconCheckCircle /> : <IconCircle />}
            </button>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 mb-1">
                <span className={`text-[17px] font-semibold break-words ${task.status === 'completed' ? 'line-through text-textMuted' : 'text-textMain'}`}>{task.title}</span>
                {task.priority !== 'normal' && <span className={`text-xs px-2 py-0.5 rounded-full font-bold uppercase opacity-80 ${task.priority === 'urgent' ? 'bg-red-500/10 text-red-500' : task.priority === 'high' ? 'bg-orange-500/10 text-orange-500' : 'bg-gray-500/10 text-gray-500'}`}>{task.priority}</span>}
              </div>
              <p className="text-sm text-textMuted line-clamp-2">{task.description}</p>
              <div className="flex items-center gap-4 mt-3 text-sm text-textMuted flex-wrap">
                {task.subject && <span className="bg-glassBorder px-2.5 py-0.5 rounded-full text-xs font-semibold">{task.subject}</span>}
                {task.deadline && <span className={`flex gap-1.5 items-center ${isOverdue ? 'text-red-500' : ''}`}><span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: task.color || '#ccc' }}></span>{relativeDate}</span>}
                {children.length > 0 && <span className="flex items-center gap-1.5"><IconCheckCircle className="text-primary w-4 h-4"/>{subtaskProgress}% ({subtaskCompleted}/{children.length})</span>}
              </div>
            </div>
            <div className="flex gap-1 group-hover:opacity-100 transition-opacity flex-shrink-0">
               <button onClick={() => setModalConfig({ parentId: task.id, subject: task.subject, color: task.color })} className="p-1.5 rounded-lg text-textMuted hover:bg-glassBorder" title="Добавить подзадачу"><IconPlus /></button>
               <button onClick={() => setModalConfig({ editTask: true, ...task })} className="p-1.5 rounded-lg text-textMuted hover:bg-glassBorder" title="Редактировать"><IconEdit /></button>
               <button onClick={() => deleteTask(task.id)} className="p-1.5 rounded-lg text-red-500/80 hover:bg-red-500/10" title="Удалить"><IconTrash /></button>
            </div>
          </div>
          <TaskModal isOpen={!!modalConfig} onClose={() => setModalConfig(null)} config={modalConfig} />

          <AnimatePresence>
            {showSubtasks && children.length > 0 && (
              <motion.div initial={{ height: 0 }} animate={{ height: 'auto' }} exit={{ height: 0 }} className="overflow-hidden mt-3 ml-7 pl-3 border-l-2 border-glassBorder flex flex-col gap-1">
                {children.map(child => <TaskItem key={child.id} task={child} />)}
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    };

    // --- Разделы ---
    const Dashboard = () => {
      const { tasks, isLoading } = useContext(TaskContext);
      if (isLoading) return null;
      const allRootTasks = tasks.filter(t => t.parentId === null);
      const activeTasks = allRootTasks.filter(t => t.status === 'active');
      const completedTasks = allRootTasks.filter(t => t.status === 'completed');
      
      const totalRoot = allRootTasks.length;
      const completedRoot = completedTasks.length;
      const progress = totalRoot > 0 ? Math.round((completedRoot / totalRoot) * 100) : 0;

      // Сортировка активных задач (приоритет -> дедлайн)
      activeTasks.sort((a, b) => {
        const priorityDiff = priorityScore[b.priority || 'normal'] - priorityScore[a.priority || 'normal'];
        if (priorityDiff !== 0) return priorityDiff;
        if (!a.deadline) return 1; if (!b.deadline) return -1;
        return a.deadline.localeCompare(b.deadline);
      });

      return (
        <div className="animate-fade-in">
          <Header title="Study Plan" />
          <section className="glass-panel p-6 mb-6">
            <h2 className="text-xl font-bold mb-3 text-textMain">Общий прогресс за сегодня</h2>
            <div className="w-full bg-glassBorder rounded-full h-4 overflow-hidden shadow-inner flex items-center gap-3">
              <motion.div initial={{ width: 0 }} animate={{ width: `${progress}%` }} className="h-full bg-primary rounded-full relative overflow-hidden">
                <div className="absolute inset-0 bg-white/20 w-full h-full skew-x-12 translate-x-[-100%] animate-[shimmer_2s_infinite]"></div>
              </motion.div>
              <span className="text-sm font-bold text-textMain tabular-nums">{progress}%</span>
            </div>
            <p className="text-sm text-textMuted mt-2">{completedRoot} из {totalRoot} заданий выполнено.</p>
          </section>

          <section className="glass-panel p-2">
            <h3 className="text-sm font-bold text-textMuted uppercase px-4 py-2">Активные задания</h3>
            <div className="p-2">
              {activeTasks.length === 0 ? <p className="text-center text-textMuted py-10">Все цели достигнуты! 🥳</p> : activeTasks.map(t => <TaskItem key={t.id} task={t} />)}
            </div>
          </section>

          {completedTasks.length > 0 && (
            <section className="glass-panel p-2 mt-6 opacity-60">
              <h3 className="text-sm font-bold text-textMuted uppercase px-4 py-2">Выполненные задания</h3>
              <div className="p-2">{completedTasks.map(t => <TaskItem key={t.id} task={t} />)}</div>
            </section>
          )}
        </div>
      );
    };

    const CalendarView = () => (
      <div className="animate-fade-in pb-20">
        <Header title="Calendar" />
        {/* Код календаря из v6 */}
      </div>
    );

    const SettingsView = () => {
      const { isDark, setIsDark } = useContext(TaskContext);
      return (
        <div className="animate-fade-in max-w-2xl pb-20"><Header title="Settings" />
          <div className="glass-panel p-6 flex items-center justify-between">
            <div><h3 className="font-semibold text-textMain text-lg">Оформление</h3><p className="text-textMuted text-sm mt-1">Переключение между светлой и темной темой.</p></div>
            <button onClick={() => setIsDark(!isDark)} className="p-4 bg-surface rounded-2xl border border-glassBorder shadow-md hover:border-primary transition-colors text-textMain"><IconSun /></button>
          </div>
          <div className="glass-panel p-6 mt-6 flex flex-col gap-4">
            <h3 className="font-semibold text-textMain text-lg flex items-center gap-2">Статус <IconCloud className={isFirebaseConfigured ? "text-primary" : "text-textMuted"}/></h3>
            <p className="text-textMuted text-sm">
              {isFirebaseConfigured ? '🟢 Подключен к Firebase Firestore. Все данные сохраняются в облаке.' : '🔴 Firebase не настроен. Данные не сохраняются.'}
            </p>
          </div>
        </div>
      );
    };

    // --- Скелет ---
    const MainLayout = () => {
      const [currentView, setCurrentView] = useState('dashboard');
      const [modalConfig, setModalConfig] = useState(null); 
      const { toasts } = useContext(TaskContext);
      
      const navItems = [ { id: 'dashboard', icon: IconHome, label: 'Задания' }, { id: 'calendar', icon: IconCalendar, label: 'Календарь' }, { id: 'settings', icon: IconSettings, label: 'Настройки' } ];

      return (
        <div className="flex h-screen w-full relative">
          <aside className="hidden md:flex w-64 h-full border-r border-glassBorder bg-surface/50 flex-col p-6 z-10 shadow-lg">
            <div className="flex items-center gap-3 mb-10 text-textMain"><div className="w-10 h-10 rounded-2xl bg-primary flex items-center justify-center font-bold text-white text-xl shadow-lg">S</div><span className="text-xl font-bold tracking-wide">StudyFlow</span></div>
            <nav className="flex flex-col gap-2">
              {navItems.map(item => (
                 <button key={item.id} onClick={() => setCurrentView(item.id)} className={`flex items-center gap-3 px-4 py-3 rounded-2xl transition-all w-full text-left font-medium ${currentView === item.id ? 'bg-primary text-white shadow-md' : 'text-textMuted hover:bg-glassBorder hover:text-textMain'}`}>
                  <item.icon /> <span>{item.label}</span>
                </button>
              ))}
            </nav>
          </aside>

          <nav className="md:hidden fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-xl border-t border-glassBorder flex justify-around items-center p-2 z-[90]">
            {navItems.map(item => (
              <button key={item.id} onClick={() => setCurrentView(item.id)} className={`flex flex-col items-center gap-1 p-2 w-20 rounded-xl transition-all ${currentView === item.id ? 'text-primary' : 'text-textMuted'}`}>
                <item.icon /> <span className="text-[10px] font-bold">{item.label}</span>
              </button>
            ))}
          </nav>

          <main className="flex-1 h-full overflow-y-auto p-4 sm:p-8 relative no-scrollbar">
            {currentView === 'dashboard' && <Dashboard />}
            {currentView === 'calendar' && <CalendarView />}
            {currentView === 'settings' && <SettingsView />}
            <button onClick={() => setModalConfig({})} className="fixed bottom-24 md:bottom-8 right-6 md:right-8 bg-primary hover:bg-primaryHover text-white p-4 rounded-3xl active:scale-95 transition-all shadow-xl z-40"><IconPlus /></button>
          </main>
          
          <TaskModal isOpen={!!modalConfig} onClose={() => setModalConfig(null)} config={modalConfig} />

          <div className="fixed top-6 right-6 z-[200] flex flex-col gap-2">
            <AnimatePresence>
              {toasts.map(toast => (
                <motion.div key={toast.id} initial={{ opacity: 0, y: -20, scale: 0.9 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, scale: 0.9 }}
                  className="px-4 py-3 rounded-xl shadow-lg border backdrop-blur-md text-sm font-medium flex items-center gap-3 bg-surface border-glassBorder text-textMain">
                  {toast.type === 'error' ? <IconTrash className="text-red-500" /> : <IconCheckCircle className="text-primary" />}
                  {toast.message}
                </motion.div>
              ))}
            </AnimatePresence>
          </div>
        </div>
      );
    }

    const Root = () => <AppProvider><MainLayout /></AppProvider>;
    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes shimmer { 100% { transform: skewX(12deg) translateX(100%); } }
    @keyframes fade-in { 0% { opacity: 0; transform: translateY(5px); } 100% { opacity: 1; transform: translateY(0); } }
    .animate-shimmer_2s_infinite { animation: shimmer 2s infinite; }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
  </style>
</body>
</html>
