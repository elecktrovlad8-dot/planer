<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StudyFlow — Идеальный Планер</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { 
            background: 'var(--bg-color)', 
            surface: 'var(--surface-color)', 
            inputBg: 'var(--input-bg)',
            primary: 'var(--primary-color)', 
            primaryHover: 'var(--primary-hover)',
            btnText: 'var(--btn-text)',
            glass: 'var(--glass-bg)', 
            glassBorder: 'var(--glass-border)',
            textMain: 'var(--text-main)', 
            textMuted: 'var(--text-muted)'
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Firebase Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    /* Светлая тема: Тотальный Matcha / Sage Green без единого серого оттенка */
    :root {
      --bg-color: #9fc792;
      --surface-color: #eef6eb; 
      --input-bg: #e1eedd;
      --glass-bg: rgba(238, 246, 235, 0.75);
      --glass-border: rgba(53, 87, 44, 0.25); 
      --text-main: #182814; 
      --text-muted: #46633f; 
      --primary-color: #35572c;
      --primary-hover: #25401e;
      --btn-text: #f4f9f2;
    }

    /* Темная тема: Deep Forest с нежным салатовым акцентом */
    .dark {
      --bg-color: #0d120d;
      --surface-color: #151f14; 
      --input-bg: #1d2b1b;
      --glass-bg: rgba(21, 31, 20, 0.82);
      --glass-border: rgba(159, 199, 146, 0.2);
      --text-main: #eef5ec;
      --text-muted: #8ca687;
      --primary-color: #9fc792;
      --primary-hover: #b4d8a8;
      --btn-text: #111c0f;
    }

    body {
      background-color: var(--bg-color); 
      color: var(--text-main);
      margin: 0; 
      overflow: hidden;
      transition: background-color 0.35s ease, color 0.35s ease;
      -webkit-tap-highlight-color: transparent;
    }
    
    .glass-panel {
      background: var(--glass-bg); 
      backdrop-filter: blur(24px); 
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border); 
      border-radius: 1.35rem; 
      box-shadow: 0 12px 40px -12px rgba(24, 40, 20, 0.14);
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%) skewX(-15deg); }
      100% { transform: translateX(200%) skewX(-15deg); }
    }
    .shimmer-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      animation: shimmer 2.5s infinite;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useMemo, useRef } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- Firebase Инициализация ---
    const firebaseConfig = {
      apiKey: "AIzaSyDz5wPBB05uU0q1vlQlgyGWmnyVwt3APk0",
      authDomain: "ourwishlist-b6bd7.firebaseapp.com",
      databaseURL: "https://ourwishlist-b6bd7-default-rtdb.firebaseio.com",
      projectId: "ourwishlist-b6bd7",
      storageBucket: "ourwishlist-b6bd7.firebasestorage.app",
      messagingSenderId: "170914082679",
      appId: "1:170914082679:web:2bc01fc83713a230fe3b72",
      measurementId: "G-LTX7TDL8KP"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- Утилиты и Звуки ---
    const generateId = () => Math.random().toString(36).substr(2, 9);
    
    const getTodayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const getOffsetDateStr = (offsetDays) => {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    
    const getRelativeDateStr = (dateStr) => {
      if (!dateStr) return '';
      const today = new Date(getTodayStr()); 
      const target = new Date(dateStr);
      const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return 'Сегодня';
      if (diffDays === 1) return 'Завтра';
      if (diffDays === 2) return 'Послезавтра';
      if (diffDays === -1) return 'Вчера (Просрочено)';
      if (diffDays < -1) return `Просрочено (${Math.abs(diffDays)} дн.)`;
      if (diffDays > 2 && diffDays <= 7) return `Через ${diffDays} дн.`;
      return target.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    };

    const getStartOfWeek = (date) => {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
      return new Date(d.setDate(diff));
    };

    // Мягкий приятный звук при выполнении или завершении таймера (Web Audio API)
    const playChime = (type = 'complete') => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = type === 'complete' ? [523.25, 659.25, 783.99] : [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
          gain.gain.setValueAtTime(0.08, ctx.currentTime + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.09);
          osc.stop(ctx.currentTime + idx * 0.09 + 0.35);
        });
      } catch (e) {}
    };

    const priorityScore = { urgent: 4, high: 3, normal: 2, low: 1 };
    const priorityLabels = { urgent: 'Срочный 🔴', high: 'Высокий 🔥', normal: 'Обычный', low: 'Низкий' };
    const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    const dayNames = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
    const defaultColors = ['#35572c', '#9fc792', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51', '#457b9d', '#9b5de5'];

    // --- Иконки ---
    const IconHome = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const IconCalendar = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const IconClock = ({ size = 14 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const IconTarget = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
    const IconSettings = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    const IconChevronRight = ({ className = "" }) => <svg className={className} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;
    const IconCircle = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/></svg>;
    const IconCheckCircle = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconTrash = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    const IconEdit = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
    const IconPlus = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const IconClose = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconSun = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
    const IconMoon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
    const IconCloud = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>;
    const IconSearch = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const IconPin = ({ active }) => <svg width="15" height="15" viewBox="0 0 24 24" fill={active ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>;
    const IconLink = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>;
    // Кристалл Sims Plumbob
    const IconPlumbob = () => (
      <svg width="18" height="22" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg" className="inline-block animate-bounce">
        <polygon points="12,1 22,16 12,31 2,16" fill="#4ade80" stroke="#166534" strokeWidth="1.5"/>
        <polygon points="12,1 22,16 12,16" fill="#86efac" opacity="0.7"/>
        <polygon points="12,31 22,16 12,16" fill="#22c55e" opacity="0.8"/>
      </svg>
    );

    // --- Стейт Менеджмент и Синхронизация ---
    const TaskContext = createContext();

    // Чтение существующих задач из всех прошлых версий без потери данных
    const getInitialLocalTasks = () => {
      for (let i = 10; i >= 1; i--) {
        const saved = localStorage.getItem(`studyflow-tasks-v${i}`);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          } catch(e) {}
        }
      }
      const legacy = localStorage.getItem('studyflow-tasks');
      if (legacy) {
        try {
          const parsed = JSON.parse(legacy);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        } catch(e) {}
      }
      return [{ id: '1', title: 'Разобраться в приложении', subject: 'Введение', description: 'Добавьте первую задачу или подзадачу.', priority: 'high', color: '#35572c', status: 'active', parentId: null, deadline: getTodayStr(), createdAt: getTodayStr(), isPinned: false }];
    };

    const AppProvider = ({ children }) => {
      const [tasks, setTasks] = useState(getInitialLocalTasks);
      const [toasts, setToasts] = useState([]);
      const [isSyncing, setIsSyncing] = useState(true);
      const [soundEnabled, setSoundEnabled] = useState(() => localStorage.getItem('studyflow-sound') !== 'false');
      
      const [isDark, setIsDark] = useState(() => {
        const saved = localStorage.getItem('studyflow-theme-settings');
        return saved ? saved === 'dark' : false;
      });

      useEffect(() => {
        const tasksRef = db.ref('tasks');
        
        tasksRef.once('value').then(snapshot => {
          if (!snapshot.exists()) {
            const current = getInitialLocalTasks();
            if (current.length > 0) {
              const tasksObj = {};
              current.forEach(t => { tasksObj[t.id] = JSON.parse(JSON.stringify(t)); });
              tasksRef.set(tasksObj);
            }
          }
        });

        tasksRef.on('value', (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            const loadedTasks = Object.values(data).map(t => ({
              ...t,
              parentId: t.parentId || null,
              isPinned: Boolean(t.isPinned)
            }));
            setTasks(loadedTasks);
            localStorage.setItem('studyflow-tasks-v6', JSON.stringify(loadedTasks));
          } else {
            setTasks([]);
            localStorage.setItem('studyflow-tasks-v6', JSON.stringify([]));
          }
          setIsSyncing(false);
        });

        return () => tasksRef.off();
      }, []);

      useEffect(() => {
        localStorage.setItem('studyflow-theme-settings', isDark ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', isDark);
      }, [isDark]);

      useEffect(() => {
        localStorage.setItem('studyflow-sound', soundEnabled ? 'true' : 'false');
      }, [soundEnabled]);

      const addToast = (message, type = 'success', undoAction = null) => {
        const id = generateId();
        setToasts(prev => [...prev, { id, message, type, undoAction }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), undoAction ? 5500 : 3200);
      };

      const syncToFirebase = (newTasksArray) => {
        // Очищаем undefined поля, чтобы Firebase никогда не выдавал ошибку
        const cleanArray = JSON.parse(JSON.stringify(newTasksArray));
        setTasks(cleanArray);
        localStorage.setItem('studyflow-tasks-v6', JSON.stringify(cleanArray));
        const tasksObj = {};
        cleanArray.forEach(t => { tasksObj[t.id] = t; });
        db.ref('tasks').set(tasksObj).catch(() => {
          addToast('Ошибка синхронизации с облаком', 'error');
        });
      };

      const toggleComplete = (id) => {
        const target = tasks.find(t => t.id === id);
        if (!target) return;
        const nextStatus = target.status === 'completed' ? 'active' : 'completed';
        if (nextStatus === 'completed' && soundEnabled) playChime('complete');
        const newTasks = tasks.map(t => t.id === id ? { ...t, status: nextStatus } : t);
        syncToFirebase(newTasks);
      };

      const togglePin = (id) => {
        const newTasks = tasks.map(t => t.id === id ? { ...t, isPinned: !t.isPinned } : t);
        syncToFirebase(newTasks);
      };

      const saveTask = (task) => {
        if (task.id) {
          syncToFirebase(tasks.map(t => t.id === task.id ? { ...t, ...task } : t));
          addToast('Изменения сохранены');
        } else {
          const newTask = { 
            ...task, 
            id: generateId(), 
            createdAt: getTodayStr(), 
            status: 'active',
            isPinned: Boolean(task.isPinned)
          };
          syncToFirebase([...tasks, newTask]);
          addToast('Задача добавлена');
        }
      };

      const deleteTask = (id) => {
        const getChildrenIds = (parentId, allTasks) => {
          const children = allTasks.filter(t => t.parentId === parentId);
          return children.reduce((acc, child) => [...acc, child.id, ...getChildrenIds(child.id, allTasks)], []);
        };
        const idsToRemove = [id, ...getChildrenIds(id, tasks)];
        const backupTasks = [...tasks];
        const newTasks = tasks.filter(t => !idsToRemove.includes(t.id));
        syncToFirebase(newTasks);
        
        addToast('Задача удалена', 'error', () => {
          syncToFirebase(backupTasks);
          addToast('Задача восстановлена!');
        });
      };

      return (
        <TaskContext.Provider value={{ 
          tasks, syncToFirebase, toggleComplete, togglePin, saveTask, deleteTask, 
          isDark, setIsDark, soundEnabled, setSoundEnabled, addToast, isSyncing 
        }}>
          {children}
          {/* Уведомления с поддержкой кнопки "Вернуть" */}
          <div className="fixed top-5 right-5 z-[300] flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0">
            <AnimatePresence>
              {toasts.map(toast => (
                <motion.div 
                  key={toast.id} 
                  initial={{ opacity: 0, y: -20, scale: 0.92 }} 
                  animate={{ opacity: 1, y: 0, scale: 1 }} 
                  exit={{ opacity: 0, scale: 0.9 }}
                  className="pointer-events-auto px-4 py-3 rounded-2xl shadow-xl border backdrop-blur-xl text-sm font-bold flex items-center justify-between gap-3 bg-surface border-glassBorder text-textMain"
                >
                  <div className="flex items-center gap-2.5">
                    {toast.type === 'error' ? <IconTrash /> : <IconCheckCircle />}
                    <span>{toast.message}</span>
                  </div>
                  {toast.undoAction && (
                    <button 
                      onClick={() => { toast.undoAction(); setToasts(prev => prev.filter(t => t.id !== toast.id)); }}
                      className="px-3 py-1 rounded-xl bg-primary text-btnText text-xs font-extrabold hover:opacity-90 transition-opacity"
                    >
                      Вернуть
                    </button>
                  )}
                </motion.div>
              ))}
            </AnimatePresence>
          </div>
        </TaskContext.Provider>
      );
    };

    // --- Карточка Задачи (Рекурсивное Дерево) ---
    const TaskItem = ({ task, level = 0, onOpenModal }) => {
      const { tasks, toggleComplete, togglePin, deleteTask } = useContext(TaskContext);
      const [isExpanded, setIsExpanded] = useState(true);
      
      const children = useMemo(() => {
        return tasks
          .filter(t => t.parentId === task.id)
          .sort((a, b) => {
            if (a.status !== b.status) return a.status === 'completed' ? 1 : -1;
            const scoreA = priorityScore[a.priority || 'normal'] || 2;
            const scoreB = priorityScore[b.priority || 'normal'] || 2;
            if (scoreA !== scoreB) return scoreB - scoreA;
            return (a.deadline || '9999-99-99').localeCompare(b.deadline || '9999-99-99');
          });
      }, [tasks, task.id]);

      const isCompleted = task.status === 'completed';
      const completedChildrenCount = children.filter(c => c.status === 'completed').length;
      const progress = children.length > 0 ? Math.round((completedChildrenCount / children.length) * 100) : null;
      const allChildrenDone = children.length > 0 && completedChildrenCount === children.length && !isCompleted;
      
      const dateStatusStr = getRelativeDateStr(task.deadline);
      const isOverdue = task.deadline && task.deadline < getTodayStr() && !isCompleted;

      return (
        <div className="w-full">
          <div className={`group flex flex-col p-3 rounded-2xl transition-all duration-200 hover:bg-primary/10 border ${task.isPinned && !isCompleted ? 'border-primary/40 bg-primary/5' : 'border-transparent hover:border-glassBorder'} ${isCompleted ? 'opacity-60' : 'opacity-100'}`}>
            
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div className="flex items-start gap-2.5 flex-1 min-w-0">
                <button 
                  onClick={() => setIsExpanded(!isExpanded)} 
                  className={`p-1 mt-0.5 rounded-lg hover:bg-primary/20 transition-colors ${children.length === 0 ? 'invisible' : ''}`}
                  title={isExpanded ? "Свернуть ветку" : "Развернуть ветку"}
                >
                  <motion.div animate={{ rotate: isExpanded ? 90 : 0 }}>
                    <IconChevronRight className="text-textMuted" />
                  </motion.div>
                </button>
                
                <button 
                  onClick={() => toggleComplete(task.id)} 
                  className="text-primary hover:scale-110 transition-transform flex-shrink-0 mt-0.5"
                >
                  {isCompleted ? <IconCheckCircle /> : <IconCircle />}
                </button>
                
                <div className="flex-1 flex flex-col cursor-pointer min-w-0" onClick={() => children.length > 0 && setIsExpanded(!isExpanded)}>
                  <div className="flex items-center gap-2 flex-wrap">
                    <div className="w-2.5 h-2.5 rounded-full flex-shrink-0 border border-glassBorder" style={{ backgroundColor: task.color || 'var(--primary-color)' }} />
                    <span className={`text-[15px] font-bold break-words ${isCompleted ? 'line-through text-textMuted' : 'text-textMain'}`}>
                      {task.title}
                    </span>
                    {progress !== null && (
                      <span className="text-[11px] bg-primary/20 px-2 py-0.5 rounded-full text-textMain font-extrabold">
                        {completedChildrenCount}/{children.length} ({progress}%)
                      </span>
                    )}
                    {!isCompleted && task.priority && task.priority !== 'normal' && (
                      <span className={`text-[11px] font-extrabold px-2 py-0.5 rounded-md ${task.priority === 'urgent' ? 'bg-red-500/15 text-red-600 dark:text-red-400' : 'bg-amber-500/15 text-amber-700 dark:text-amber-300'}`}>
                        {priorityLabels[task.priority]}
                      </span>
                    )}
                  </div>
                  
                  {task.description && (
                    <p className="text-xs text-textMuted mt-1 whitespace-pre-line font-medium leading-relaxed">
                      {task.description}
                    </p>
                  )}
                  
                  <div className="flex gap-2 mt-2 text-xs text-textMuted items-center flex-wrap">
                    {task.subject && (
                      <span className="bg-inputBg px-2.5 py-0.5 rounded-lg border border-glassBorder font-bold text-textMain">
                        {task.subject}
                      </span>
                    )}
                    {task.deadline && (
                      <span className={`flex items-center gap-1 bg-inputBg px-2.5 py-0.5 rounded-lg border border-glassBorder font-bold ${isOverdue ? 'text-red-600 dark:text-red-400 border-red-500/40 bg-red-500/10' : 'text-textMain'}`}>
                        <IconClock /> {dateStatusStr}
                      </span>
                    )}
                    {task.link && (
                      <a 
                        href={task.link.startsWith('http') ? task.link : `https://${task.link}`} 
                        target="_blank" 
                        rel="noreferrer"
                        onClick={e => e.stopPropagation()}
                        className="flex items-center gap-1 bg-primary/15 hover:bg-primary/25 text-textMain px-2.5 py-0.5 rounded-lg font-bold transition-colors"
                      >
                        <IconLink /> Ссылка
                      </a>
                    )}
                    {/* Умная подсказка при завершении всех подзадач */}
                    {allChildrenDone && (
                      <button
                        onClick={(e) => { e.stopPropagation(); toggleComplete(task.id); }}
                        className="bg-primary text-btnText px-2.5 py-0.5 rounded-lg font-extrabold text-[11px] shadow-sm hover:opacity-90 transition-all animate-pulse"
                      >
                        ✨ Все шаги готовы! Завершить?
                      </button>
                    )}
                  </div>

                  {/* Мини прогресс-бар подзадач */}
                  {progress !== null && !isCompleted && (
                    <div className="w-full max-w-xs h-1.5 bg-inputBg rounded-full overflow-hidden mt-2 border border-glassBorder">
                      <div className="h-full bg-primary transition-all duration-300 rounded-full" style={{ width: `${progress}%` }} />
                    </div>
                  )}
                </div>
              </div>

              {/* Панель действий карточки */}
              <div className="flex items-center gap-1.5 mt-2 sm:mt-0 ml-11 sm:ml-0 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                <button 
                  onClick={() => onOpenModal({ parentId: task.id, date: task.deadline || '' })} 
                  className="flex items-center gap-1 px-2.5 py-1.5 bg-primary/15 hover:bg-primary/25 rounded-xl text-textMain transition-colors text-xs font-bold"
                  title="Добавить вложенную подзадачу"
                >
                  <IconPlus /> Подзадача
                </button>
                {!task.parentId && (
                  <button 
                    onClick={() => togglePin(task.id)} 
                    className={`p-1.5 rounded-xl transition-colors ${task.isPinned ? 'bg-primary text-btnText' : 'hover:bg-primary/20 text-textMuted hover:text-textMain'}`} 
                    title={task.isPinned ? "Открепить" : "Закрепить наверху"}
                  >
                    <IconPin active={task.isPinned} />
                  </button>
                )}
                <button 
                  onClick={() => onOpenModal({ editTask: task })} 
                  className="p-1.5 hover:bg-primary/20 rounded-xl text-textMuted hover:text-textMain transition-colors" 
                  title="Редактировать"
                >
                  <IconEdit />
                </button>
                <button 
                  onClick={() => deleteTask(task.id)} 
                  className="p-1.5 hover:bg-red-500/20 rounded-xl text-textMuted hover:text-red-600 transition-colors" 
                  title="Удалить"
                >
                  <IconTrash />
                </button>
              </div>
            </div>
          </div>

          {/* Вложенные подзадачи с визуальной линией дерева */}
          <AnimatePresence>
            {isExpanded && children.length > 0 && (
              <motion.div 
                initial={{ height: 0, opacity: 0 }} 
                animate={{ height: 'auto', opacity: 1 }} 
                exit={{ height: 0, opacity: 0 }} 
                className="overflow-hidden"
              >
                <div className="ml-5 sm:ml-7 pl-3 border-l-2 border-primary/30 flex flex-col gap-1 mt-1 mb-2">
                  {children.map(child => (
                    <TaskItem key={child.id} task={child} level={level + 1} onOpenModal={onOpenModal} />
                  ))}
                </div>
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    };

    // --- Модальный Мини-Календарь выбора дедлайна (В отдельном окне без наслоения) ---
    const MiniDatePickerModal = ({ isOpen, selectedDate, onSelectDate, onClose }) => {
      const [pickerMonth, setPickerMonth] = useState(() => {
        const d = selectedDate ? new Date(selectedDate) : new Date();
        return new Date(d.getFullYear(), d.getMonth(), 1);
      });

      useEffect(() => {
        if (isOpen) {
          const d = selectedDate ? new Date(selectedDate) : new Date();
          setPickerMonth(new Date(d.getFullYear(), d.getMonth(), 1));
        }
      }, [isOpen, selectedDate]);

      if (!isOpen) return null;

      const daysInMonth = new Date(pickerMonth.getFullYear(), pickerMonth.getMonth() + 1, 0).getDate();
      let firstDay = new Date(pickerMonth.getFullYear(), pickerMonth.getMonth(), 1).getDay();
      firstDay = firstDay === 0 ? 6 : firstDay - 1;

      const prevMonth = (e) => { e.preventDefault(); setPickerMonth(new Date(pickerMonth.getFullYear(), pickerMonth.getMonth() - 1, 1)); };
      const nextMonth = (e) => { e.preventDefault(); setPickerMonth(new Date(pickerMonth.getFullYear(), pickerMonth.getMonth() + 1, 1)); };

      return (
        <div className="fixed inset-0 z-[260] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={onClose}>
          <motion.div 
            initial={{ scale: 0.9, opacity: 0 }} 
            animate={{ scale: 1, opacity: 1 }} 
            className="bg-surface border-2 border-glassBorder p-5 rounded-3xl shadow-2xl w-full max-w-[330px] text-textMain"
            onClick={e => e.stopPropagation()}
          >
            <div className="flex justify-between items-center mb-3">
              <span className="font-extrabold text-base">Выбор дедлайна</span>
              <button type="button" onClick={onClose} className="p-1.5 text-textMuted hover:text-textMain bg-inputBg rounded-xl"><IconClose /></button>
            </div>

            {/* Быстрые кнопки дат */}
            <div className="grid grid-cols-3 gap-1.5 mb-3">
              <button type="button" onClick={() => onSelectDate(getTodayStr())} className="py-1.5 px-2 rounded-xl bg-inputBg hover:bg-primary hover:text-btnText text-xs font-bold transition-colors">Сегодня</button>
              <button type="button" onClick={() => onSelectDate(getOffsetDateStr(1))} className="py-1.5 px-2 rounded-xl bg-inputBg hover:bg-primary hover:text-btnText text-xs font-bold transition-colors">Завтра</button>
              <button type="button" onClick={() => onSelectDate(getOffsetDateStr(7))} className="py-1.5 px-2 rounded-xl bg-inputBg hover:bg-primary hover:text-btnText text-xs font-bold transition-colors">+1 Неделя</button>
            </div>

            <div className="flex items-center justify-between mb-3 bg-inputBg p-2 rounded-xl border border-glassBorder">
              <button onClick={prevMonth} className="p-1 hover:bg-primary/20 rounded-lg text-textMuted hover:text-textMain"><IconChevronRight className="rotate-180" /></button>
              <span className="font-extrabold text-sm">{monthNames[pickerMonth.getMonth()]} {pickerMonth.getFullYear()}</span>
              <button onClick={nextMonth} className="p-1 hover:bg-primary/20 rounded-lg text-textMuted hover:text-textMain"><IconChevronRight /></button>
            </div>

            <div className="grid grid-cols-7 gap-1 text-center text-[10px] text-textMuted font-extrabold uppercase mb-1.5">
              <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div className="text-red-500">Сб</div><div className="text-red-500">Вс</div>
            </div>

            <div className="grid grid-cols-7 gap-1 mb-4">
              {Array.from({ length: firstDay }).map((_, i) => <div key={`empty-${i}`} />)}
              {Array.from({ length: daysInMonth }).map((_, i) => {
                const day = i + 1;
                const dateStr = `${pickerMonth.getFullYear()}-${String(pickerMonth.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isSelected = selectedDate === dateStr;
                const isToday = dateStr === getTodayStr();

                return (
                  <button
                    key={day} type="button" onClick={() => onSelectDate(dateStr)}
                    className={`h-9 w-9 text-xs rounded-xl flex items-center justify-center font-bold transition-all mx-auto ${
                      isSelected 
                        ? 'bg-primary text-btnText shadow-md scale-105' 
                        : isToday
                          ? 'border-2 border-primary text-primary hover:bg-primary/15'
                          : 'hover:bg-inputBg text-textMain'
                    }`}
                  >
                    {day}
                  </button>
                );
              })}
            </div>

            <div className="flex justify-between items-center pt-3 border-t border-glassBorder">
              <button type="button" onClick={() => onSelectDate('')} className="text-textMuted font-bold hover:text-textMain px-3 py-1.5 bg-inputBg rounded-xl transition-colors text-xs w-full">
                Убрать дедлайн
              </button>
            </div>
          </motion.div>
        </div>
      );
    };

    // --- Палитра выбора цвета с сохранением своих оттенков ---
    const ColorPickerField = ({ value, onChange }) => {
      const [customColors, setCustomColors] = useState(() => {
        const saved = localStorage.getItem('studyflow-custom-colors');
        return saved ? JSON.parse(saved) : [];
      });

      const allColors = [...new Set([...defaultColors, ...customColors])].slice(-14); 

      const handleCustomAdd = (e) => {
        const newColor = e.target.value;
        onChange(newColor);
        if (!allColors.includes(newColor)) {
          const updated = [...customColors, newColor].slice(-8); 
          setCustomColors(updated);
          localStorage.setItem('studyflow-custom-colors', JSON.stringify(updated));
        }
      };

      return (
        <div className="flex flex-wrap items-center gap-2.5 mt-1.5">
          {allColors.map(c => (
            <button 
              key={c} type="button" onClick={() => onChange(c)}
              className={`w-7 h-7 rounded-full border-2 transition-transform shadow-sm ${value === c ? 'border-textMain scale-115 ring-2 ring-primary/40' : 'border-transparent hover:scale-110'}`}
              style={{ backgroundColor: c }}
            />
          ))}
          <label 
            title="Выбрать свой цвет (сохранится в список)"
            className="relative w-7 h-7 rounded-full border-2 border-dashed border-textMuted flex items-center justify-center overflow-hidden hover:border-textMain text-textMain cursor-pointer transition-colors bg-surface font-bold"
          >
            <span className="text-sm leading-none">+</span>
            <input type="color" className="opacity-0 absolute inset-0 w-full h-full cursor-pointer" onChange={handleCustomAdd} value={value || '#35572c'} />
          </label>
        </div>
      );
    };

    // --- Модальное Окно Задачи (В едином стиле Matcha/Forest без серых полей) ---
    const TaskModal = ({ isOpen, onClose, config }) => {
      const { tasks, saveTask, isDark } = useContext(TaskContext);
      const [showDatePicker, setShowDatePicker] = useState(false);
      
      const [formData, setFormData] = useState({
        id: null, title: '', subject: '', description: '', link: '', deadline: '', priority: 'normal', color: '', parentId: '', isPinned: false
      });

      useEffect(() => {
        if (isOpen) {
          const defaultColor = isDark ? '#9fc792' : '#35572c';
          setShowDatePicker(false);
          if (config.editTask) {
            setFormData({ 
              ...config.editTask, 
              parentId: config.editTask.parentId || '',
              link: config.editTask.link || '',
              isPinned: Boolean(config.editTask.isPinned)
            });
          } else {
            setFormData({
              id: null, title: '', subject: '', description: '', link: '',
              deadline: config.date || '', priority: 'normal', color: defaultColor, parentId: config.parentId || '', isPinned: false
            });
          }
        }
      }, [isOpen, config, isDark]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title.trim()) return;
        saveTask({ ...formData, parentId: formData.parentId === '' ? null : formData.parentId });
        onClose();
      };

      // Защита от зацикливания и построение полного пути для всех задач и подзадач
      const getDescendants = (taskId, allTasks) => {
        const children = allTasks.filter(t => t.parentId === taskId);
        return children.reduce((acc, child) => [...acc, child.id, ...getDescendants(child.id, allTasks)], []);
      };
      const descendants = formData.id ? getDescendants(formData.id, tasks) : [];
      const possibleParentsRaw = tasks.filter(t => t.id !== formData.id && !descendants.includes(t.id));
      
      const getPath = (task, allTasks, visited = new Set()) => {
        if (!task.parentId || visited.has(task.id)) return task.title;
        visited.add(task.id);
        const parent = allTasks.find(t => t.id === task.parentId);
        if (!parent) return task.title;
        return getPath(parent, allTasks, visited) + ' ➔ ' + task.title;
      };
      const possibleParents = possibleParentsRaw
        .map(p => ({ ...p, path: getPath(p, tasks) }))
        .sort((a, b) => a.path.localeCompare(b.path));

      return (
        <div className="fixed inset-0 z-[150] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/50 backdrop-blur-md">
          <motion.div 
            initial={{ y: '100%' }} 
            animate={{ y: 0 }} 
            className="glass-panel w-full sm:max-w-xl p-6 bg-surface shadow-2xl rounded-t-3xl sm:rounded-3xl pb-10 sm:pb-6 max-h-[92vh] overflow-y-auto no-scrollbar border-2 border-glassBorder text-textMain"
          >
            <div className="w-12 h-1.5 bg-primary/40 rounded-full mx-auto mb-5 sm:hidden"></div>
            
            <div className="flex justify-between items-center mb-5">
              <h2 className="text-xl font-extrabold tracking-tight text-textMain">
                {formData.id ? 'Редактировать задание' : (formData.parentId ? 'Новая подзадача' : 'Новое задание')}
              </h2>
              <button type="button" onClick={onClose} className="p-2 rounded-xl text-textMuted hover:text-textMain bg-inputBg hover:bg-primary/20 transition-colors">
                <IconClose />
              </button>
            </div>
            
            <form onSubmit={handleSubmit} className="flex flex-col gap-3.5">
              <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2.5 focus-within:border-primary transition-colors">
                <label className="text-[10px] uppercase text-textMuted font-extrabold">Название задачи *</label>
                <input 
                  value={formData.title} 
                  onChange={e => setFormData({...formData, title: e.target.value})} 
                  required 
                  autoFocus 
                  className="w-full bg-transparent text-textMain placeholder-textMuted/60 outline-none font-bold text-base mt-0.5" 
                  placeholder="Например: Подготовить доклад по истории" 
                />
              </div>
              
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2 focus-within:border-primary transition-colors">
                  <label className="text-[10px] uppercase text-textMuted font-extrabold">Предмет / Категория</label>
                  <input 
                    value={formData.subject} 
                    onChange={e => setFormData({...formData, subject: e.target.value})} 
                    className="w-full bg-transparent text-textMain placeholder-textMuted/60 outline-none text-sm font-bold mt-0.5" 
                    placeholder="Математика, Проект..." 
                  />
                </div>
                <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2 focus-within:border-primary transition-colors">
                  <label className="text-[10px] uppercase text-textMuted font-extrabold">Ссылка (по желанию)</label>
                  <input 
                    value={formData.link} 
                    onChange={e => setFormData({...formData, link: e.target.value})} 
                    className="w-full bg-transparent text-textMain placeholder-textMuted/60 outline-none text-sm font-bold mt-0.5" 
                    placeholder="https://docs.google.com/..." 
                  />
                </div>
              </div>
              
              <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2 focus-within:border-primary transition-colors">
                <label className="text-[10px] uppercase text-textMuted font-extrabold">Описание и заметки</label>
                <textarea 
                  value={formData.description} 
                  onChange={e => setFormData({...formData, description: e.target.value})} 
                  rows="2" 
                  className="w-full bg-transparent text-textMain placeholder-textMuted/60 outline-none text-sm font-medium resize-none mt-0.5" 
                  placeholder="Детали задания, страницы учебника, важные мысли..." 
                />
              </div>
              
              <div className="grid grid-cols-2 gap-3">
                <div 
                  onClick={() => setShowDatePicker(true)}
                  className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2.5 flex flex-col cursor-pointer hover:border-primary transition-colors"
                >
                  <label className="text-[10px] uppercase text-textMuted font-extrabold cursor-pointer">Дедлайн (Календарь)</label>
                  <div className="text-sm font-extrabold mt-1 flex items-center gap-1.5 text-textMain truncate">
                    <IconClock /> {formData.deadline ? getRelativeDateStr(formData.deadline) : 'Выбрать дату'}
                  </div>
                </div>

                <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2.5 flex flex-col">
                  <label className="text-[10px] uppercase text-textMuted font-extrabold">Приоритет</label>
                  <select 
                    value={formData.priority} 
                    onChange={e => setFormData({...formData, priority: e.target.value})} 
                    className="w-full bg-transparent text-textMain outline-none text-sm cursor-pointer mt-1 font-extrabold"
                  >
                    <option value="low" className="bg-surface text-textMain">Низкий</option>
                    <option value="normal" className="bg-surface text-textMain">Обычный</option>
                    <option value="high" className="bg-surface text-textMain">Высокий 🔥</option>
                    <option value="urgent" className="bg-surface text-textMain">Срочный 🔴</option>
                  </select>
                </div>
              </div>

              <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2.5 flex flex-col">
                <label className="text-[10px] uppercase text-textMuted font-extrabold">Вложить в (Сделать подзадачей любой задачи или подзадачи)</label>
                <select 
                  value={formData.parentId} 
                  onChange={e => setFormData({...formData, parentId: e.target.value})} 
                  className="w-full bg-transparent text-textMain outline-none text-sm cursor-pointer mt-1 font-extrabold truncate"
                >
                  <option value="" className="bg-surface text-textMain">-</option>
                  {possibleParents.map(p => (
                    <option key={p.id} value={p.id} className="bg-surface text-textMain">{p.path}</option>
                  ))}
                </select>
              </div>

              <div className="bg-inputBg border border-glassBorder rounded-2xl px-4 py-2.5 flex flex-col">
                <label className="text-[10px] uppercase text-textMuted font-extrabold">Цвет метки (свой цвет сохраняется в список)</label>
                <ColorPickerField value={formData.color} onChange={(c) => setFormData({...formData, color: c})} />
              </div>
              
              <div className="flex justify-end gap-3 mt-3">
                <button type="button" onClick={onClose} className="px-5 py-2.5 text-textMain bg-inputBg hover:bg-primary/20 rounded-2xl transition-colors font-extrabold text-sm">
                  Отмена
                </button>
                <button type="submit" className="px-6 py-2.5 bg-primary hover:bg-primaryHover text-btnText font-extrabold rounded-2xl shadow-lg transition-all active:scale-95 text-sm">
                  Сохранить
                </button>
              </div>
            </form>
          </motion.div>

          <MiniDatePickerModal 
            isOpen={showDatePicker} 
            selectedDate={formData.deadline} 
            onSelectDate={(date) => { setFormData({ ...formData, deadline: date }); setShowDatePicker(false); }} 
            onClose={() => setShowDatePicker(false)}
          />
        </div>
      );
    };

    // --- Модальное окно просмотра всех задач выбранного дня в Календаре ---
    const DayTasksModal = ({ isOpen, onClose, date, onOpenModal }) => {
      const { tasks } = useContext(TaskContext);
      if (!isOpen || !date) return null;

      const dayTasks = tasks.filter(t => t.deadline === date);
      const topLevelDayTasks = dayTasks.filter(t => !dayTasks.find(p => p.id === t.parentId));

      const d = new Date(date);
      const titleDate = `${d.getDate()} ${monthNames[d.getMonth()]}, ${dayNames[d.getDay()]}`;

      return (
        <div className="fixed inset-0 z-[140] flex items-center justify-center p-4 bg-black/50 backdrop-blur-md" onClick={onClose}>
          <motion.div 
            initial={{ scale: 0.92, opacity: 0 }} 
            animate={{ scale: 1, opacity: 1 }} 
            className="glass-panel w-full max-w-lg p-6 bg-surface shadow-2xl rounded-3xl max-h-[85vh] flex flex-col border-2 border-glassBorder text-textMain"
            onClick={e => e.stopPropagation()}
          >
            <div className="flex justify-between items-center pb-3 border-b border-glassBorder mb-4">
              <div>
                <span className="text-[11px] uppercase font-extrabold text-textMuted tracking-wider">Задачи на выбранный день</span>
                <h3 className="text-xl font-extrabold text-textMain mt-0.5">{titleDate}</h3>
              </div>
              <button onClick={onClose} className="p-2 rounded-xl text-textMuted hover:text-textMain bg-inputBg hover:bg-primary/20 transition-colors"><IconClose /></button>
            </div>

            <div className="flex-1 overflow-y-auto no-scrollbar space-y-2 mb-5">
              {topLevelDayTasks.length === 0 ? (
                <div className="text-center py-10 text-textMuted text-sm font-bold bg-inputBg rounded-2xl border border-glassBorder">
                  На этот день задач пока нет. ✨
                </div>
              ) : (
                topLevelDayTasks.map(task => (
                  <TaskItem key={task.id} task={task} onOpenModal={(cfg) => { onClose(); onOpenModal(cfg); }} />
                ))
              )}
            </div>

            <button
              onClick={() => { onClose(); onOpenModal({ date }); }}
              className="w-full py-3 bg-primary hover:bg-primaryHover text-btnText rounded-2xl font-extrabold flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 text-sm"
            >
              <IconPlus /> Добавить задачу или подзадачу на этот день
            </button>
          </motion.div>
        </div>
      );
    };

    // --- РАЗДЕЛ 1: ГЛАВНАЯ (ДАШБОРД) ---
    const Dashboard = ({ onOpenModal }) => {
      const { tasks, saveTask, isSyncing, isDark } = useContext(TaskContext);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterMode, setFilterMode] = useState('all'); // 'all' | 'today' | 'urgent'
      const [quickTitle, setQuickTitle] = useState('');
      const todayStr = getTodayStr();
      
      const allRoot = useMemo(() => tasks.filter(t => !t.parentId), [tasks]);
      
      // Прогресс за сегодня (смотрит на все задачи и подзадачи с дедлайном Сегодня)
      const todayTasks = useMemo(() => tasks.filter(t => t.deadline === todayStr), [tasks, todayStr]);
      const todayCompleted = useMemo(() => todayTasks.filter(t => t.status === 'completed').length, [todayTasks]);
      
      let progressToday = 100;
      let isSimsReady = true;
      let subtitleText = 'На сегодня задач нет — день полностью свободен!';

      if (todayTasks.length > 0) {
        progressToday = Math.round((todayCompleted / todayTasks.length) * 100);
        isSimsReady = progressToday === 100;
        subtitleText = `Выполнено ${todayCompleted} из ${todayTasks.length} задач на сегодня`;
      }

      const handleQuickAdd = (e) => {
        e.preventDefault();
        if (!quickTitle.trim()) return;
        saveTask({
          title: quickTitle.trim(),
          subject: '',
          description: '',
          link: '',
          deadline: todayStr,
          priority: 'normal',
          color: isDark ? '#9fc792' : '#35572c',
          parentId: null
        });
        setQuickTitle('');
      };

      // Сортировка: Закрепленные -> По срочности -> По дате дедлайна
      const activeRoot = useMemo(() => {
        return allRoot
          .filter(t => t.status === 'active')
          .filter(t => {
            if (filterMode === 'today') return t.deadline === todayStr;
            if (filterMode === 'urgent') return t.priority === 'urgent' || t.priority === 'high';
            return true;
          })
          .filter(t => {
            if (!searchQuery.trim()) return true;
            const q = searchQuery.toLowerCase();
            return (t.title && t.title.toLowerCase().includes(q)) || 
                   (t.subject && t.subject.toLowerCase().includes(q)) ||
                   (t.description && t.description.toLowerCase().includes(q));
          })
          .slice()
          .sort((a, b) => {
            if (Boolean(a.isPinned) !== Boolean(b.isPinned)) return a.isPinned ? -1 : 1;
            const scoreA = priorityScore[a.priority || 'normal'] || 2;
            const scoreB = priorityScore[b.priority || 'normal'] || 2;
            if (scoreA !== scoreB) return scoreB - scoreA;
            const dateA = a.deadline || '9999-99-99';
            const dateB = b.deadline || '9999-99-99';
            return dateA.localeCompare(dateB);
          });
      }, [allRoot, filterMode, searchQuery, todayStr]);

      const completedRoot = useMemo(() => allRoot.filter(t => t.status === 'completed'), [allRoot]);
      const overdueCount = useMemo(() => tasks.filter(t => t.status === 'active' && t.deadline && t.deadline < todayStr).length, [tasks, todayStr]);

      return (
        <div className="animate-fade-in pb-32 sm:pb-12 max-w-5xl mx-auto">
          <header className="mb-6">
            <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
              <h1 className="text-2xl sm:text-3xl font-extrabold text-textMain tracking-tight flex items-center gap-3">
                Ваш план
                {isSyncing && <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-inputBg text-textMuted flex items-center gap-1.5"><IconCloud /> Синхронизация...</span>}
              </h1>
              <div className="flex items-center gap-2 text-xs font-extrabold">
                <span className="px-3 py-1.5 rounded-xl bg-surface border border-glassBorder">Активных: {tasks.filter(t => t.status === 'active').length}</span>
                {overdueCount > 0 && <span className="px-3 py-1.5 rounded-xl bg-red-500/15 text-red-600 dark:text-red-400 border border-red-500/30">Просрочено: {overdueCount}</span>}
              </div>
            </div>

            {/* Главная карточка прогресса за сегодня + Статус SIMS */}
            <div className="glass-panel p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-5 bg-surface/90 border-2 border-glassBorder">
              <div>
                <div className="flex items-center gap-2">
                  <h3 className="font-extrabold text-textMain text-lg">Прогресс за сегодня</h3>
                  {isSimsReady && <IconPlumbob />}
                </div>
                <p className="text-sm font-bold text-textMuted mt-0.5">{subtitleText}</p>
              </div>
              <div className="w-full sm:w-3/5 flex flex-col gap-2">
                <div className="w-full h-4 bg-inputBg rounded-full overflow-hidden border border-glassBorder p-0.5">
                  <motion.div 
                    initial={{ width: 0 }} 
                    animate={{ width: `${progressToday}%` }} 
                    className="h-full bg-primary rounded-full relative overflow-hidden transition-all duration-500 shimmer-bar"
                  />
                </div>
                <div className="flex justify-between items-center text-xs font-extrabold">
                  <span className="text-textMuted">Цель дня: 100%</span>
                  <span className="text-primary text-sm">
                    {isSimsReady ? '100% (Можно играть в SIMS 🎮)' : `${progressToday}%`}
                  </span>
                </div>
              </div>
            </div>
          </header>

          {/* Быстрое создание задачи на сегодня в 1 клик */}
          <form onSubmit={handleQuickAdd} className="glass-panel p-2 mb-6 bg-surface/80 flex items-center gap-2 border border-glassBorder">
            <input 
              value={quickTitle}
              onChange={e => setQuickTitle(e.target.value)}
              placeholder="Быстрая задача на сегодня (нажмите Enter)..."
              className="flex-1 bg-transparent px-3 py-2 text-sm font-bold text-textMain placeholder-textMuted/70 outline-none"
            />
            <button 
              type="submit" 
              className="px-4 py-2 bg-inputBg hover:bg-primary hover:text-btnText text-textMain rounded-xl text-xs font-extrabold transition-colors shrink-0"
            >
              Быстро +
            </button>
            <button 
              type="button"
              onClick={() => onOpenModal({})} 
              className="px-4 py-2 bg-primary hover:bg-primaryHover text-btnText rounded-xl text-xs font-extrabold transition-colors shadow-md shrink-0 flex items-center gap-1"
            >
              <IconPlus /> Подробно
            </button>
          </form>

          {/* Список активных заданий с фильтрами и поиском */}
          <div className="glass-panel p-3 sm:p-4 mb-6 bg-surface/65 border border-glassBorder">
            <div className="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 pb-3 mb-3 border-b border-glassBorder">
              <div className="flex items-center gap-1.5 bg-inputBg p-1 rounded-xl border border-glassBorder">
                <button onClick={() => setFilterMode('all')} className={`px-3 py-1.5 rounded-lg text-xs font-extrabold transition-colors ${filterMode === 'all' ? 'bg-primary text-btnText shadow-sm' : 'text-textMuted hover:text-textMain'}`}>Все ({allRoot.filter(t=>t.status==='active').length})</button>
                <button onClick={() => setFilterMode('today')} className={`px-3 py-1.5 rounded-lg text-xs font-extrabold transition-colors ${filterMode === 'today' ? 'bg-primary text-btnText shadow-sm' : 'text-textMuted hover:text-textMain'}`}>На сегодня</button>
                <button onClick={() => setFilterMode('urgent')} className={`px-3 py-1.5 rounded-lg text-xs font-extrabold transition-colors ${filterMode === 'urgent' ? 'bg-primary text-btnText shadow-sm' : 'text-textMuted hover:text-textMain'}`}>Важные 🔥</button>
              </div>

              <div className="relative flex-1 sm:max-w-xs">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-textMuted"><IconSearch /></span>
                <input 
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Поиск по задачам и предметам..."
                  className="w-full bg-inputBg border border-glassBorder rounded-xl pl-9 pr-3 py-1.5 text-xs font-bold text-textMain placeholder-textMuted/70 outline-none focus:border-primary"
                />
              </div>
            </div>
            
            <div className="space-y-1">
              {activeRoot.length === 0 ? (
                <div className="text-center text-textMuted py-12 font-bold">
                  {searchQuery ? 'По вашему запросу ничего не найдено.' : 'Все актуальные задачи выполнены! Можно отдыхать ✨'}
                </div>
              ) : (
                activeRoot.map(task => <TaskItem key={task.id} task={task} onOpenModal={onOpenModal} />)
              )}
            </div>
          </div>

          {/* Выполненные задачи (с возможностью вернуть обратно) */}
          {completedRoot.length > 0 && (
            <div className="glass-panel p-3 sm:p-4 bg-surface/40 border border-glassBorder">
              <h3 className="text-xs font-extrabold text-textMuted uppercase tracking-wider mb-2 pl-2">
                Выполненные ({completedRoot.length}) — нажмите на галочку, чтобы вернуть в работу
              </h3>
              <div className="flex flex-col gap-1">
                {completedRoot.map(task => <TaskItem key={task.id} task={task} onOpenModal={onOpenModal} />)}
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- РАЗДЕЛ 2: ДЕДЛАЙНЫ (ВРЕМЕННАЯ ШКАЛА) ---
    const DeadlinesView = ({ onOpenModal }) => {
      const { tasks } = useContext(TaskContext);
      const todayStr = getTodayStr();
      const tomorrowStr = getOffsetDateStr(1);
      const nextWeekStr = getOffsetDateStr(7);

      const activeTasks = useMemo(() => {
        return tasks
          .filter(t => t.status === 'active')
          .sort((a, b) => {
            const scoreA = priorityScore[a.priority || 'normal'] || 2;
            const scoreB = priorityScore[b.priority || 'normal'] || 2;
            if (scoreA !== scoreB) return scoreB - scoreA;
            return (a.deadline || '9999-99-99').localeCompare(b.deadline || '9999-99-99');
          });
      }, [tasks]);

      const groups = [
        { title: 'Просрочено ⚠️', items: activeTasks.filter(t => t.deadline && t.deadline < todayStr) },
        { title: 'Сегодня 🎯', items: activeTasks.filter(t => t.deadline === todayStr) },
        { title: 'Завтра ☀️', items: activeTasks.filter(t => t.deadline === tomorrowStr) },
        { title: 'Ближайшие 7 дней 📅', items: activeTasks.filter(t => t.deadline && t.deadline > tomorrowStr && t.deadline <= nextWeekStr) },
        { title: 'Позже 🌿', items: activeTasks.filter(t => t.deadline && t.deadline > nextWeekStr) },
        { title: 'Без дедлайна ♾️', items: activeTasks.filter(t => !t.deadline && !t.parentId) }
      ];

      return (
        <div className="animate-fade-in pb-32 sm:pb-12 max-w-5xl mx-auto">
          <div className="flex justify-between items-center mb-6">
            <div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-textMain">Контроль дедлайнов</h1>
              <p className="text-sm font-bold text-textMuted">Все активные задачи и подзадачи, распределённые по срокам</p>
            </div>
            <button onClick={() => onOpenModal({})} className="bg-primary hover:bg-primaryHover text-btnText px-4 py-2.5 rounded-2xl text-xs font-extrabold shadow-md flex items-center gap-1.5">
              <IconPlus /> Новая задача
            </button>
          </div>

          <div className="space-y-4">
            {groups.map((g, idx) => g.items.length > 0 && (
              <div key={idx} className="glass-panel p-4 bg-surface/70 border border-glassBorder">
                <h3 className="text-sm font-extrabold text-textMain uppercase tracking-wider mb-3 pb-2 border-b border-glassBorder flex justify-between">
                  <span>{g.title}</span>
                  <span className="bg-inputBg px-2.5 py-0.5 rounded-full text-xs">{g.items.length}</span>
                </h3>
                <div className="space-y-1">
                  {g.items.map(task => <TaskItem key={task.id} task={task} onOpenModal={onOpenModal} />)}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // --- РАЗДЕЛ 3: КАЛЕНДАРЬ (МЕСЯЦ И НЕДЕЛЯ С УЧЕТОМ ПОДЗАДАЧ) ---
    const CalendarView = ({ onOpenModal }) => {
      const { tasks } = useContext(TaskContext);
      const [viewMode, setViewMode] = useState('month'); 
      const [currentMonth, setCurrentMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
      const [currentWeek, setCurrentWeek] = useState(() => getStartOfWeek(new Date()));
      const [viewDayDate, setViewDayDate] = useState(null);

      const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
      let firstDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();
      firstDay = firstDay === 0 ? 6 : firstDay - 1;
      
      const nextMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1));
      const prevMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1));
      
      const nextWeek = () => { const d = new Date(currentWeek); d.setDate(d.getDate() + 7); setCurrentWeek(d); };
      const prevWeek = () => { const d = new Date(currentWeek); d.setDate(d.getDate() - 7); setCurrentWeek(d); };
      
      const weekDays = Array.from({length: 7}).map((_, i) => {
        const d = new Date(currentWeek); d.setDate(d.getDate() + i);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      });

      // Учитывает и основные задачи, и подзадачи без дублирования
      const getTasksForDate = (dateStr) => {
        return tasks.filter(t => {
          if (t.deadline !== dateStr) return false;
          if (t.parentId) {
            const parent = tasks.find(p => p.id === t.parentId);
            if (parent && parent.deadline === dateStr) return false; 
          }
          return true;
        });
      };

      const weekTasksAll = tasks.filter(t => weekDays.includes(t.deadline));
      const weekProgress = weekTasksAll.length > 0 
        ? Math.round((weekTasksAll.filter(t => t.status === 'completed').length / weekTasksAll.length) * 100) 
        : 100;

      const titleMonth = `${monthNames[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;
      const titleWeek = `${new Date(weekDays[0]).getDate()} ${monthNames[new Date(weekDays[0]).getMonth()]} — ${new Date(weekDays[6]).getDate()} ${monthNames[new Date(weekDays[6]).getMonth()]}`;

      return (
        <div className="animate-fade-in pb-32 sm:pb-10 h-full flex flex-col max-w-5xl mx-auto">
          <header className="mb-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div className="flex items-center justify-between w-full sm:w-auto gap-4">
              <h1 className="text-2xl font-extrabold text-textMain">Календарь</h1>
              <div className="flex bg-surface p-1 rounded-2xl border border-glassBorder shadow-sm">
                <button onClick={() => setViewMode('month')} className={`px-4 py-1.5 text-xs font-extrabold rounded-xl transition-colors ${viewMode === 'month' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Месяц</button>
                <button onClick={() => setViewMode('week')} className={`px-4 py-1.5 text-xs font-extrabold rounded-xl transition-colors ${viewMode === 'week' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Неделя</button>
              </div>
            </div>
            
            <div className="flex items-center gap-2 bg-surface p-1.5 rounded-2xl border border-glassBorder shadow-sm w-full sm:w-auto justify-between sm:justify-start">
              <button onClick={viewMode === 'month' ? prevMonth : prevWeek} className="p-2 rounded-xl hover:bg-primary/20 transition-colors text-textMain"><IconChevronRight className="rotate-180" /></button>
              <span className="font-extrabold text-sm text-center text-textMain px-2 whitespace-nowrap">{viewMode === 'month' ? titleMonth : titleWeek}</span>
              <button onClick={viewMode === 'month' ? nextMonth : nextWeek} className="p-2 rounded-xl hover:bg-primary/20 transition-colors text-textMain"><IconChevronRight /></button>
            </div>
          </header>

          {viewMode === 'month' ? (
            <div className="glass-panel flex-1 p-3 sm:p-5 flex flex-col bg-surface/65 border border-glassBorder animate-fade-in">
              <div className="grid grid-cols-7 gap-1 sm:gap-2 mb-2 text-center text-[10px] sm:text-xs font-extrabold text-textMuted uppercase">
                <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div className="text-red-500/80">Сб</div><div className="text-red-500/80">Вс</div>
              </div>
              <div className="grid grid-cols-7 gap-1 sm:gap-2 flex-1 auto-rows-fr">
                {Array.from({ length: firstDay }).map((_, i) => <div key={`empty-${i}`} className="rounded-2xl bg-inputBg/40 opacity-40"></div>)}
                {Array.from({ length: daysInMonth }).map((_, i) => {
                  const day = i + 1;
                  const dateStr = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                  const dayTasks = getTasksForDate(dateStr);
                  const isToday = dateStr === getTodayStr();

                  return (
                    <div 
                      key={day} 
                      onClick={() => setViewDayDate(dateStr)} 
                      className={`p-1.5 sm:p-2 rounded-2xl border flex flex-col gap-1 cursor-pointer transition-all ${isToday ? 'border-2 border-primary bg-primary/15 shadow-sm' : 'border-glassBorder bg-surface hover:border-primary/60 hover:bg-primary/10'}`}
                    >
                      <div className="flex justify-between items-center px-1">
                        <span className={`text-xs sm:text-sm font-extrabold ${isToday ? 'text-primary' : 'text-textMain'}`}>{day}</span>
                        {dayTasks.length > 0 && (
                          <span className="text-[10px] font-extrabold px-1.5 py-0.2 rounded-full bg-primary text-btnText">
                            {dayTasks.length}
                          </span>
                        )}
                      </div>
                      <div className="hidden sm:flex flex-col gap-1 overflow-y-auto no-scrollbar max-h-20 mt-0.5">
                        {dayTasks.map(t => (
                          <div key={t.id} className={`text-[10px] px-1.5 py-0.5 rounded-lg flex items-center gap-1 truncate font-bold ${t.status === 'completed' ? 'opacity-50 line-through bg-inputBg' : 'bg-primary/20 text-textMain border border-primary/20'}`}>
                            {t.parentId && <span className="text-primary font-extrabold">└</span>} {t.title}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
            <div className="glass-panel flex-1 p-4 sm:p-6 flex flex-col overflow-y-auto bg-surface/65 border border-glassBorder animate-fade-in no-scrollbar">
              <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2 mb-5 p-4 bg-inputBg rounded-2xl border border-glassBorder">
                <div>
                  <span className="font-extrabold text-textMain">Прогресс недели (включая подзадачи)</span>
                  <p className="text-xs font-bold text-textMuted">Задач на неделе: {weekTasksAll.length}</p>
                </div>
                <div className="flex items-center gap-3 w-full sm:w-1/2">
                  <div className="flex-1 h-3.5 bg-surface rounded-full overflow-hidden border border-glassBorder">
                    <motion.div initial={{ width: 0 }} animate={{ width: `${weekProgress}%` }} className="h-full bg-primary rounded-full"></motion.div>
                  </div>
                  <span className="text-sm font-extrabold text-primary">{weekProgress}%</span>
                </div>
              </div>

              <div className="flex flex-col gap-3.5">
                {weekDays.map((dateStr, i) => {
                  const dayTasks = getTasksForDate(dateStr);
                  const isToday = dateStr === getTodayStr();
                  const d = new Date(dateStr);
                  
                  return (
                    <div key={dateStr} className={`p-4 rounded-2xl border ${isToday ? 'border-2 border-primary bg-primary/10 shadow-sm' : 'border-glassBorder bg-surface'} flex flex-col gap-2.5`}>
                      <div className="flex justify-between items-center border-b border-glassBorder pb-2">
                        <h3 className={`font-extrabold ${isToday ? 'text-primary' : 'text-textMain'}`}>
                          {dayNames[d.getDay()]}, <span className="font-bold text-textMuted text-sm">{d.getDate()} {monthNames[d.getMonth()]}</span>
                        </h3>
                        <button onClick={() => onOpenModal({ date: dateStr })} className="text-btnText bg-primary hover:bg-primaryHover px-2.5 py-1 rounded-xl text-xs font-extrabold transition-colors flex items-center gap-1">
                          <IconPlus /> Добавить
                        </button>
                      </div>
                      <div className="flex flex-col gap-1">
                        {dayTasks.length === 0 ? <p className="text-xs text-textMuted font-bold py-1">Нет задач на этот день</p> : dayTasks.map(t => <TaskItem key={t.id} task={t} onOpenModal={onOpenModal} />)}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <DayTasksModal 
            isOpen={Boolean(viewDayDate)} 
            onClose={() => setViewDayDate(null)} 
            date={viewDayDate} 
            onOpenModal={(cfg) => { setViewDayDate(null); onOpenModal(cfg); }} 
          />
        </div>
      );
    };

    // --- РАЗДЕЛ 4: ТАЙМЕР ФОКУСА (POMODORO + ВЫБОР ЗАДАЧИ) ---
    const FocusView = ({ onOpenModal }) => {
      const { tasks, soundEnabled } = useContext(TaskContext);
      const [mode, setMode] = useState('work'); // 'work' (25) | 'short' (5) | 'long' (15)
      const [secondsLeft, setSecondsLeft] = useState(25 * 60);
      const [isRunning, setIsRunning] = useState(false);
      const [selectedTaskId, setSelectedTaskId] = useState('');

      const durations = { work: 25 * 60, short: 5 * 60, long: 15 * 60 };

      useEffect(() => {
        if (!isRunning) return;
        const timer = setInterval(() => {
          setSecondsLeft(prev => {
            if (prev <= 1) {
              setIsRunning(false);
              if (soundEnabled) playChime('timer');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [isRunning, soundEnabled]);

      const switchMode = (newMode) => {
        setIsRunning(false);
        setMode(newMode);
        setSecondsLeft(durations[newMode]);
      };

      const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
      const secs = String(secondsLeft % 60).padStart(2, '0');
      const activeTasks = tasks.filter(t => t.status === 'active' && !t.parentId);
      const focusedTask = tasks.find(t => t.id === selectedTaskId);

      return (
        <div className="animate-fade-in pb-32 sm:pb-12 max-w-3xl mx-auto">
          <h1 className="text-2xl sm:text-3xl font-extrabold text-textMain mb-2">Режим Фокуса</h1>
          <p className="text-sm font-bold text-textMuted mb-6">Таймер Помодоро для глубокой концентрации без выгорания</p>

          <div className="glass-panel p-6 sm:p-8 bg-surface/80 border-2 border-glassBorder text-center mb-6">
            <div className="inline-flex bg-inputBg p-1.5 rounded-2xl border border-glassBorder mb-6 gap-1">
              <button onClick={() => switchMode('work')} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition-colors ${mode === 'work' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Фокус (25 мин)</button>
              <button onClick={() => switchMode('short')} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition-colors ${mode === 'short' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Перерыв (5 мин)</button>
              <button onClick={() => switchMode('long')} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition-colors ${mode === 'long' ? 'bg-primary text-btnText' : 'text-textMuted hover:text-textMain'}`}>Отдых (15 мин)</button>
            </div>

            <div className="text-6xl sm:text-7xl font-extrabold tracking-tight text-textMain my-4 font-mono">
              {mins}:{secs}
            </div>

            <div className="flex justify-center gap-3 mt-6">
              <button 
                onClick={() => setIsRunning(!isRunning)} 
                className="px-8 py-3 bg-primary hover:bg-primaryHover text-btnText rounded-2xl font-extrabold text-sm shadow-lg transition-transform active:scale-95"
              >
                {isRunning ? 'Пауза' : 'Старт'}
              </button>
              <button 
                onClick={() => { setIsRunning(false); setSecondsLeft(durations[mode]); }} 
                className="px-5 py-3 bg-inputBg hover:bg-primary/20 text-textMain rounded-2xl font-extrabold text-sm border border-glassBorder transition-colors"
              >
                Сброс
              </button>
            </div>
          </div>

          <div className="glass-panel p-5 bg-surface/70 border border-glassBorder">
            <label className="text-xs uppercase font-extrabold text-textMuted block mb-2">Над какой задачей работаем сейчас?</label>
            <select 
              value={selectedTaskId} 
              onChange={e => setSelectedTaskId(e.target.value)}
              className="w-full bg-inputBg border border-glassBorder rounded-2xl px-4 py-3 text-sm font-extrabold text-textMain outline-none mb-4"
            >
              <option value="" className="bg-surface text-textMain">— Выберите задачу из списка —</option>
              {activeTasks.map(t => <option key={t.id} value={t.id} className="bg-surface text-textMain">{t.title}</option>)}
            </select>

            {focusedTask && (
              <div className="bg-inputBg/60 p-2 rounded-2xl border border-glassBorder">
                <TaskItem task={focusedTask} onOpenModal={onOpenModal} />
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- РАЗДЕЛ 5: НАСТРОЙКИ И РЕЗЕРВНОЕ КОПИРОВАНИЕ ---
    const SettingsView = () => {
